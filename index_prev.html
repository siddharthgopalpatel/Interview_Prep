    {num:1,q:"Design Jenkins pipeline for diverse tech stack (Java, .NET, Python) efficiently?",score:"Reference",scoreClass:"score-pass",a:"Shared Libraries + Docker agents.\n\nShared Library (separate repo): Reusable stages (checkout, build, test, deploy). Functions: buildJavaApp(), buildDotNetApp(), buildPythonApp().\n\nDocker agents per stack: maven:3.9 (Java), dotnet/sdk:8.0 (.NET), python:3.12. Clean, reproducible.\n\nStructure: Outer standardized (governance). Inner parameterized (team flexibility).\n\nAgent allocation: Label-based (heavy-build for Java, lightweight for Python)."},
    {num:2,q:"Jenkins as Code. Version control configs, ensure consistency across environments?",score:"Reference",scoreClass:"score-pass",a:"JCasC (Configuration as Code): Entire config in YAML, version-controlled. System settings, creds, tools, security — all in Git.\n\nPipelines: Jenkinsfile in every repo (mandatory). Same PR review as code.\n\nConsistency: Same JCasC YAML with env-specific overrides. Base identical (dev=prod minus intentional diffs).\n\nRepo: jenkins-infrastructure/ with casc/, shared-libraries/, seed-jobs/, docker/.\n\nWorkflow: PR → review → auto-applied. Full audit trail + rollback."},
    {num:3,q:"Integrate security scanning into Jenkins CI/CD for banking?",score:"Reference",scoreClass:"score-pass",a:"Multi-stage:\n1. SAST (after compile): SonarQube, Checkmarx, Fortify. Critical = fail.\n2. SCA: OWASP Dependency-Check, Snyk. No critical/high CVEs >30 days.\n3. Container scanning: Trivy, Aqua. After build, before push.\n4. DAST: OWASP ZAP against test env. Tickets for security team.\n5. Secrets: truffleHog, git-secrets. Pre-commit + pipeline.\n\nGating: Critical/High → block. Medium/Low → dashboard. DAST → tickets (FP risk). All results to centralized security dashboard."},
    {num:4,q:"Design Jenkins pipelines for multiple environments (dev, test, prod)?",score:"Reference",scoreClass:"score-pass",a:"Single pipeline, parameterized promotion:\n\nBuild → Dev (auto) → Integration Tests → Test (approval/auto) → UAT/Perf → Prod (manual + change ticket).\n\nGates: Dev→Test auto if tests pass. Test→Prod manual (ticket required, peer review).\n\nSafety: Prod only from main/release. Cannot skip envs. Deployment windows. Canary with auto-rollback.\n\nAudit: Who, what, when, commit. Change ticket mandatory. Deployment report artifact.\n\nRollback: One-click, keep last 5 artifacts, blue-green/canary."},
    {num:5,q:"Jenkins pipeline is slow. How to optimize build times?",score:"Reference",scoreClass:"score-pass",a:"Diagnosis: Pipeline Stage View — find slowest stages.\n\nOptimizations:\n1. Parallelization: parallel { test, SAST, SCA } — saves 50%+\n2. Caching: Maven ~/.m2, npm node_modules, Docker layers\n3. Incremental: Only build/test changed modules, scan changed files\n4. Agents: Right-sized, pre-warmed, K8s-based (scale to zero)\n5. Docker: Multi-stage, specific tags, .dockerignore\n6. Tests: Fail fast (smoke first), test impact analysis\n7. Infra: Artifact cache nearby, SSD storage\n\nTarget: <10 min PR feedback, <20 min full pipeline."},
    {num:6,q:"Jenkins high availability and disaster recovery?",score:"Reference",scoreClass:"score-pass",a:"HA Options:\n• Active/Passive: shared EFS, LB failover (RTO 2-5 min)\n• Jenkins on K8s (recommended): Deployment + PV, pod reschedules <1 min, dynamic agents\n\nBackup: JENKINS_HOME daily to S3 (jobs, config, creds, plugins). JCasC in Git. Shared Library in Git. Jenkinsfiles distributed.\n\nDR: Everything as Code — rebuild from scratch <30 min. JCasC + Docker + seed jobs = full reconstruction. Creds in Vault.\n\nPrinciple: Minimize controller state. Treat as cattle not pets. If dies, rebuild from code."}
  ]
},

  id: "jenkins-2",
  category: "jenkins",

  targetRole: "Staff/Principal DevOps Engineer",
  avgScore: "All Passed (Model Answers)",
  questions: [
    {num:1,q:"GitHub Actions deep-dive — workflows, reusable workflows, matrix, OIDC, self-hosted runners?",score:"Passed",scoreClass:"score-pass",a:"Architecture: Workflow (YAML) → Jobs (parallel/sequential) → Steps (actions/scripts). Event triggers: push, PR, schedule, workflow_dispatch.\n\nMatrix: Test across versions/OS combinations. fail-fast:false continues others.\n\nReusable workflows: Template with workflow_call, inputs, secrets. Callers reference with 'uses'. DRY for 50 services.\n\nOIDC for AWS: permissions: id-token:write → configure-aws-credentials with role-to-assume. No access keys! Short-lived, scoped to repo+branch.\n\nSelf-hosted runners: For VPC access, GPU, specific hardware. runs-on: self-hosted.\n\nvs Jenkins: Actions=SaaS, YAML, marketplace. Jenkins=self-hosted, Groovy, full control."},
    {num:2,q:"Trunk-based vs GitFlow? Monorepo CI? Feature flags vs feature branches?",score:"Passed",scoreClass:"score-pass",a:"Trunk-based: Short branches (<24h), merge daily, main always deployable, feature flags hide incomplete work. Best: microservices, mature CI/CD.\n\nGitFlow: Long-lived branches (develop, release, feature), scheduled releases. Best: regulated, less mature CI.\n\nMonorepo CI: Detect changes per service (dorny/paths-filter), only build what changed. Saves time + resources.\n\nFeature flags vs branches: Flags=code in main, hidden behind toggle (continuous integration, A/B test, flag debt). Branches=isolated but merge hell.\n\nRecommendation: Microservices + mature → trunk-based + flags. Regulated/slow → GitFlow (evolve toward trunk)."},
    {num:3,q:"Artifact management — container registries, versioning, retention, promotion between environments?",score:"Passed",scoreClass:"score-pass",a:"Tagging: Never :latest in prod. Use: semver (v2.3.1), git SHA (abc123), or branch+SHA+build.\n\nPromotion: Build ONCE → promote same image through dev → staging → prod. Never rebuild per env.\n\nRetention (ECR lifecycle): Keep last 20 tagged, delete untagged after 7 days.\n\nScanning: Trivy in CI (fail on HIGH/CRITICAL) + ECR scan-on-push.\n\nSigning: Cosign sign after successful scan. Admission controller verifies before deploy.\n\nStorage: ECR (AWS), Harbor (self-hosted), GHCR (GitHub). Nexus/Artifactory for JARs, Helm charts."},
    {num:4,q:"Design CI/CD for 50 microservices — shared pipelines, independent deployability, contract testing?",score:"Passed",scoreClass:"score-pass",a:"Principles: Independent deploy (no coordinated releases), shared logic + service config, build once promote, backward-compatible changes.\n\nShared templates repo: build-docker.yml, deploy-eks.yml, run-tests.yml. Each service calls shared with service-specific inputs.\n\nContract testing (Pact): Consumer defines expectations → provider's CI validates contracts. Prevents breaking changes.\n\nDeployment ordering (when needed): ArgoCD sync waves (0:infra → 1:DB → 2:backend → 3:frontend).\n\nRollback: ArgoCD sync to previous commit, Helm rollback, ECS previous task definition."},
    {num:5,q:"CI/CD metrics — DORA metrics? How to identify and fix pipeline bottlenecks?",score:"Passed",scoreClass:"score-pass",a:"DORA: Deployment Frequency (elite: multiple/day), Lead Time (elite: <1hr), Change Failure Rate (elite: <5%), MTTR (elite: <1hr).\n\nPipeline metrics: Build success rate (>95%), duration (<10min), test pass rate, flaky ratio, queue wait time.\n\nBottleneck identification: Profile each stage timing. Common: dependency install (cache it), test suite (parallelize), Docker build (layer cache), deploy (parallel environments).\n\nFlaky tests: Track 30 days → quarantine → fix → reintroduce → monitor.\n\nExample: 25min pipeline → cache deps (-4min) + parallel tests (-4min) + Docker cache (-3min) = 14min."},
    {num:6,q:"Compare rolling, blue-green, canary, A/B deployments. When each? Rollback? Critical service pipeline?",score:"Passed",scoreClass:"score-pass",a:"Rolling: Replace one-by-one. Simple, no extra infra. Medium risk.\n\nBlue-Green: Full parallel env, switch traffic. Instant rollback (switch back). Extra cost.\n\nCanary: X% to new, monitor, increase. Lowest risk. Argo Rollouts + analysis.\n\nA/B: Route by user attribute (not version). For feature/UX testing.\n\nCritical financial service: Build → security scan → tests → staging → canary 5% → automated analysis (error rate < 0.1%?) → YES: 25% → 50% → 100% → NO: auto-rollback + alert.\n\nGuardrails: No Friday deploys, change ticket required, 2 approvals, auto-rollback on metric breach, keep previous 2 hours."}
  ]
},

  questions: [
    {num:1,q:"What stages are in your CI/CD pipelines and what issues do you face working with development teams?",score:"Passed",scoreClass:"score-pass",a:"Pipeline stages:\n1. Code — PR created, triggers pipeline\n2. Lint & Static Analysis — ansible-lint, hadolint, tflint, ESLint (<1min)\n3. SAST + Secrets Scan — SonarQube, Semgrep, Gitleaks (fail on critical)\n4. Build — compile, Docker build (multi-stage), tag with git-sha\n5. Unit Tests — fast, every PR\n6. SCA (Dependency Scan) — Snyk/Dependabot, check CVEs\n7. Container Scan — Trivy, fail on Critical/High\n8. Image Sign + Push — Cosign sign, push to ECR\n9. Deploy to Dev — auto-deploy, smoke tests\n10. Integration/E2E Tests — against staging\n11. Deploy to Staging — full test suite, DAST (ZAP)\n12. Approval Gate — manual for prod\n13. Deploy to Prod — canary/rolling via ArgoCD, auto-rollback on metric breach\n14. Post-deploy — health check, notify, monitor error budget\n\nCommon issues with dev teams:\n• 'Pipeline too slow' → parallelized stages, caching, fail fast, <10min PR feedback\n• 'Too many false positives' → tuned SAST rules, only block critical/high, baseline existing\n• 'Can't reproduce locally' → Docker-based local pipeline, same image as CI\n• 'Breaking changes between services' → contract testing (Pact), API versioning\n• 'Who owns pipeline?' → shared templates (platform team) + service config (dev team)\n• 'Flaky tests blocking merges' → quarantine flaky, track/fix, SLA on flakiness\n• 'Secrets management' → OIDC federation, no keys in pipeline, External Secrets Operator\n\nKey principle: Platform team owns templates and guardrails. Dev teams own service config. Fast feedback + low friction = adoption."},
    {num:2,q:"How do you determine if a pipeline failure is a developer issue versus a DevOps infrastructure issue?",score:"Passed",scoreClass:"score-pass",a:"Look at WHERE it failed:\n• Unit tests, build compile, SAST findings → Developer (code issue)\n• Container scan (CVE in base image) → DevOps (update golden base image)\n• Container scan (CVE in app dependency) → Developer (update their dependency)\n• Deploy fails (K8s manifest, Helm values) → Depends on who owns config\n• Infra (runner crashed, disk full, timeout) → DevOps (infrastructure)\n• Flaky test (passes on retry) → Developer (fix the test)\n• Registry/network unreachable → DevOps (infra/connectivity)\n• Secrets missing/expired → DevOps (secrets management)\n• OOM during build → DevOps (agent sizing) or Developer (memory leak in tests)\n\nQuick identification:\n• Same pipeline worked yesterday, no infra change → dev code change (check commit diff)\n• Multiple pipelines failing simultaneously → infra issue (runner, network, registry)\n• Only one pipeline failing → app-specific (dev code or config)\n• Intermittent/flaky → infra (resource pressure) or dev (race condition)\n\nOwnership structure:\n• Platform team: runners, agents, shared templates, registry, secrets infra, base images\n• Dev team: Dockerfile, app tests, app dependencies, service-specific config\n• Shared: deployment manifests (Helm values reviewed by both)\n\nKey principle: Tag failures by category, dashboard showing infra vs app failures, auto-route alerts to correct team."},
    {num:3,q:"How is your CI/CD pipeline maintained (shared libraries, scripting language)?",score:"Passed",scoreClass:"score-pass",a:"Shared Libraries / Reusable Templates:\n• Jenkins: Shared Library in separate Git repo. Groovy functions (buildDockerImage(), deployToEKS(), runSecurityScan()). Services call @Library('pipeline-lib') and use standardized stages\n• GitHub Actions: Reusable workflows (workflow_call) + composite actions in central .github repo. Services reference with uses: org/workflows/.github/workflows/build.yml@v2\n• Versioned (semver tags) — teams pin to stable version, upgrade at their pace\n\nStructure:\npipeline-templates/\n├── jenkins/shared-library/ (vars/, src/, resources/)\n├── github-actions/workflows/ (build.yml, deploy.yml, scan.yml)\n├── scripts/ (bash/python helpers)\n└── tests/ (pipeline tests)\n\nLanguages used:\n• Groovy (Jenkins pipelines/shared libs)\n• YAML (GitHub Actions, ArgoCD)\n• Bash (simple scripting, glue)\n• Python (complex automation — reports, Slack bots, custom tooling)\n\nHow maintained:\n• Owned by platform team, PRs welcome from dev teams\n• CODEOWNERS enforces review by platform team\n• Tested — changes tested against staging pipelines before release\n• Versioned — breaking changes = major version bump + migration guide\n• Documented — README per template, example usage, changelog\n\nGovernance:\n• Platform team: owns templates, shared logic, security gates, runner infra\n• Dev teams: own service-specific config (Dockerfile, Helm values, test scripts)\n• Quarterly review: deprecate unused, update tooling, incorporate feedback\n\nKey principle: Pipelines are code — version controlled, tested, reviewed, documented. Platform team provides paved road, dev teams drive on it."}
  ]
},

    {num:1,q:"If a vulnerability is found in the code (e.g., Java Spring Boot), is it your responsibility or the developer's to fix it?",score:"Passed",scoreClass:"score-pass",a:"Short answer: Developer fixes the code, DevOps ensures the system catches it.\n\nDeveloper's responsibility:\n• Fix the vulnerability in their code (SQL injection, XSS, insecure deserialization)\n• Update vulnerable application dependencies (Spring Boot version, Log4j, etc.)\n• Write secure code following guidelines\n• Act on scan findings within SLA\n\nDevOps/Platform team's responsibility:\n• Ensure scanning tools are in place and running (SonarQube, Snyk, Trivy)\n• Define and enforce gating policies (critical = pipeline fails)\n• Maintain golden base images (patch OS-level CVEs)\n• Provide clear, actionable reports (not just raw findings)\n• Set SLAs (critical=24h, high=7d) and track compliance\n• Escalate overdue findings\n\nShared:\n• Defining what blocks vs what's a warning\n• Tuning false positives\n• Security champions program (dev team member bridging both sides)\n\nHow we handled it:\n• Scanner finds Log4Shell in Spring Boot app → ticket auto-created, assigned to dev team\n• DevOps provides: which version is safe, link to advisory, deadline\n• If dev team misses SLA → auto-escalate to engineering manager\n• DevOps blocks deploy if critical unfixed beyond SLA\n\nKey principle: DevOps builds guardrails and visibility. Developers own their code. Fix ownership follows code ownership."}

{

    {num:1,q:"Project: DevSecOps CI/CD Pipeline for AI Learning Platform (Production Ready)",score:"Portfolio",scoreClass:"score-pass",a:"GitHub Repo: https://github.com/siddharthpatel1993/dcp_devsecops\nReference (CI Env): https://gitlab.com/patelsiddharthnids993/harsh_project\n\nProblem Statement:\nNeeded end-to-end DevSecOps pipeline for a Django-based AI learning application integrating security at every stage — from commit to production deployment on Kubernetes. Also needed to build the CI/CD platform infrastructure itself from scratch.\n\nArchitecture (Production Ready):\nDeveloper → Git Push → Jenkins → Unit Tests → SonarQube (SAST) → Quality Gate → Docker Build (multi-stage) → Trivy Scan (gate) → Push → Cosign Sign → S3 Reports → GitOps (ArgoCD) → DAST (OWASP ZAP)\n\nApplication:\n• Django web app using OpenAI API + YouTube Transcript API to generate learning content\n• Served via Gunicorn (3 workers) on port 8000\n• Multi-stage Dockerfile (900MB → 150MB) with .dockerignore\n\nCI/CD Platform Infrastructure (built from scratch):\n• Docker Compose stack: Jenkins Master + Custom Agent (Sonar Scanner + Trivy) + SonarQube\n• Custom Jenkins Agent Dockerfile: Ubuntu + SSH + Sonar Scanner 5.0.1 + Trivy + Java JDK\n• install.bash — bare-metal alternative\n• Result: Entire DevSecOps environment reproducible in <5 minutes\n\n---\nPIPELINE STAGES (12 stages — production ready):\n\n1. Cleanup Workspace — cleanWs() ensures fresh build\n2. Checkout from SCM — clones master from GitHub\n3. Unit Tests — pytest --cov --cov-report=xml, fail fast\n4. SonarQube Analysis (SAST) — code bugs, vulnerabilities, smells, coverage\n5. Quality Gate — threshold evaluation, configurable block\n6. Build Docker Image — multi-stage (slim base, no build tools in prod)\n7. Trivy Image Scan — BEFORE push, --exit-code 1 fails on HIGH/CRITICAL. Vulnerable images NEVER reach registry\n8. Push Docker Image — only if Trivy passes. Git-SHA tag only (no :latest)\n9. Sign Image (Cosign) — cryptographic signature. Kyverno rejects unsigned at admission\n10. S3 Report Upload — Trivy HTML for audit/compliance\n11. Update GitOps Repo — sed updates image tag in Git → ArgoCD auto-syncs\n12. DAST (OWASP ZAP) — runtime scan against deployed app. Reports to S3\n\n---\nSECURITY LAYERS (Defence in Depth):\n\nLayer 1 — Code: SonarQube SAST + pytest coverage + Quality Gate\nLayer 2 — Container: Trivy scan (gate), multi-stage Dockerfile, .dockerignore\nLayer 3 — Supply Chain: Cosign signing, Git-SHA tags, Kyverno policy (reject unsigned)\nLayer 4 — Runtime: OWASP ZAP DAST, K8s probes, resource limits\nLayer 5 — Audit: Trivy + ZAP reports in S3, Git history = deployment audit\n\n---\nKUBERNETES DEPLOYMENT (Production Ready):\n\n• Deployment: 3 replicas + rolling update (maxUnavailable: 0) = zero-downtime\n• Probes: readiness + liveness (httpGet, auto-restart on deadlock)\n• Resources: requests + limits (prevents noisy neighbor, enables HPA)\n• Service: ClusterIP (internal only, Ingress handles external)\n• Ingress: Nginx + TLS via cert-manager (Let's Encrypt auto-renew)\n• PDB: minAvailable: 2 (safe node maintenance)\n• ClusterIssuer: Let's Encrypt production endpoint\n\n---\nGITOPS WITH ARGOCD:\n\n• Jenkins updates image tag in GitOps repo → ArgoCD detects → rolling update\n• Jenkins NEVER touches cluster (no SSH, no kubectl)\n• Drift detection: manual kubectl changes auto-reverted (selfHeal: true)\n• Rollback = git revert → ArgoCD syncs previous state\n• Audit: git log = who deployed what, when\n\n---\nKEY DESIGN DECISIONS:\n\n• Multi-stage Dockerfile: 900MB → 150MB, no build tools in prod\n• Git-SHA tags: immutable, traceable — never :latest\n• Scan BEFORE push: vulnerable images never reach registry\n• Cosign + Kyverno: only CI/CD-built images run in cluster\n• ArgoCD over Ansible: zero-downtime, drift detection, git-based rollback\n• ClusterIP + Ingress: HTTPS, domain routing — not NodePort\n• 3 replicas + PDB: survives failures, safe maintenance\n• DAST after deploy: catches runtime issues SAST can't see\n\n---\nPROJECT FILES:\n\n• Dockerfile — multi-stage, slim, exec form entrypoint, commented\n• .dockerignore — excludes .git, .env, tests, db.sqlite3\n• Jenkinsfile — 12-stage pipeline with security at every gate\n• k8s.yml — Deployment (3 replicas, probes, resources) + ClusterIP + Ingress + TLS + PDB\n• kyverno-policy.yml — reject unsigned images + restrict registries\n• argocd-application.yml — GitOps auto-sync, selfHeal, prune\n• test.yml — deprecated with migration notes\n• README.md — professional documentation\n\n---\nSTILL PENDING (mention as future improvements):\n\n• Secrets Manager + External Secrets Operator (no manual kubectl secrets)\n• Non-root user in Dockerfile (commented out, needs permission fix)\n• Health endpoint /health/ in Django (using /admin/ as workaround)\n• SBOM generation (Syft) for compliance\n• Jenkins on K8s with Helm (dynamic pod agents)\n\n---\nINTERVIEW SUMMARY:\n\nBuilt a production-grade DevSecOps pipeline with 12 stages covering the full security lifecycle. Multi-stage Docker builds (900MB → 150MB), Trivy scanning BEFORE registry push (vulnerable images never leave the build agent), Cosign image signing with Kyverno admission enforcement (only CI/CD-built images run in cluster), GitOps deployment via ArgoCD (zero-downtime, drift detection, git-revert rollback), and OWASP ZAP DAST for runtime vulnerability testing. Also built the CI/CD platform itself from scratch (Docker Compose: Jenkins + SonarQube + custom agent). Every image in production is: tested, scanned, signed, and verified."}

    {num:1,q:"Project: 3-Tier Application Deployment on AWS with Terraform (Production Ready)",score:"Portfolio",scoreClass:"score-pass",a:"Documentation: doc/3-Tier-AWS-Architecture-Project.md\n\nProblem Statement:\nDeploy a production-grade Java Spring Boot application on AWS 3-tier architecture with high availability, auto-scaling, security, and full Terraform automation. Single codebase promotes through dev → staging → prod.\n\nArchitecture:\nInternet → Route53 → CloudFront (CDN) → WAF → ALB (public subnet, 3 AZs) → EC2 ASG (private subnet) → RDS Aurora Multi-AZ (data subnet, isolated)\n\n3-Tier Explained:\n• Web Tier (public): ALB + WAF + CloudFront — receives traffic, blocks attacks, distributes load\n• App Tier (private): EC2 Auto Scaling Group — runs business logic, scales 3→20 based on CPU/requests\n• Data Tier (isolated): RDS Aurora Multi-AZ — stores data, auto-failover <30s, encrypted, no internet access\n\nVPC Design:\n• CIDR: 10.0.0.0/16 across 3 AZs\n• Public subnets (10.0.1-3.0/24): ALB, NAT Gateway\n• Private subnets (10.0.11-13.0/24): App servers (outbound via NAT)\n• Data subnets (10.0.21-23.0/24): RDS (zero internet)\n• NAT Gateway per AZ for high availability\n\nSecurity Design:\n• SG Chain: Internet→ALB-SG(443)→APP-SG(8080 from ALB only)→DB-SG(3306 from APP only)\n• WAF: Rate limiting (2000/5min), SQL injection, XSS, IP reputation\n• Encryption: TLS in transit, KMS at rest (EBS + RDS + S3)\n• IAM: Instance profiles (no keys), RDS IAM auth, OIDC for CI/CD\n• VPC Endpoints: S3, Secrets Manager (private path, no internet)\n\nAuto Scaling:\n• Min: 2 / Desired: 3 / Max: 20\n• Target tracking: CPU 60% + request count per target\n• Scheduled: Scale up 8:50AM weekdays, scale down 10PM\n• Instance refresh: Rolling update 80% min healthy for zero-downtime AMI deploys\n• Health check: ELB-based (/health endpoint), 300s grace period\n\nRDS Aurora:\n• Engine: Aurora MySQL 8.0\n• Multi-AZ: Primary + Replica (auto-failover <30s)\n• Encrypted (KMS CMK), automated backups 7-day retention\n• Writer endpoint (INSERT/UPDATE) + Reader endpoint (SELECT) — split traffic\n• IAM authentication — no password in code\n\nTerraform Structure:\nmodules/ (vpc, alb, asg, rds, monitoring) — reusable\nenvironments/ (dev, staging, prod) — different tfvars, same modules\nRemote state: S3 + DynamoDB locking per environment\nSeparate AWS accounts per environment\n\nKey Design Decisions:\n• 3 AZs (not 2): survives AZ failure with capacity to spare\n• ALB not NLB: need L7 routing, WAF integration, path-based rules\n• NAT per AZ: eliminates cross-AZ SPOF\n• Aurora over standard RDS: faster failover, auto-storage scaling, more replicas\n• ASG instance refresh: zero-downtime AMI updates natively\n• Terraform modules: DRY, versioned, reusable across all environments\n\nMonitoring:\n• CloudWatch alarms: 5xx>5%, CPU>70%, RDS CPU>80%, healthy hosts<2\n• Dashboards: ALB (latency P99, errors), ASG (instance count), RDS (connections, lag)\n\nCost: ~$760/month on-demand, ~$500/month with Savings Plans\n\nNumbers: 3 AZs, 99.99% uptime, 5000 req/s capacity, auto-scales 3→20, RDS failover <30s, zero-downtime deploys\n\n---\nInterview Summary:\nDeployed Java Spring Boot on AWS 3-tier architecture fully automated with Terraform modules. VPC with public/private/data subnets across 3 AZs, ALB with WAF for L7 security, EC2 Auto Scaling Group in private subnets scaling on CPU and request count (3→20 instances), Aurora Multi-AZ in isolated subnets with <30s failover. Security: SG chaining (each tier only talks to adjacent tier), WAF rules, KMS encryption everywhere, IAM authentication for RDS. Same Terraform modules promote through dev/staging/prod with different tfvars. Handles 5000 req/s with zero-downtime rolling deployments via ASG instance refresh."}

    {num:1,q:"Project: Enterprise OS Patching Automation — 18-Step Zero-Touch Lifecycle (Production Ready)",score:"Portfolio",scoreClass:"score-pass",a:"GitLab Repo: https://gitlab.com/patelsiddharthnids993/ansible_os_automation\n\nProblem Statement:\nManually patching Linux servers is error-prone, time-consuming, and lacks audit trail. Need fully automated, zero-touch OS patching lifecycle — from change ticket to final notification — across a RHEL fleet with zero-downtime, automatic rollback, and compliance evidence.\n\nProduction execution: Ansible Automation Platform (AAP) with Workflow Templates, RBAC per team, and scheduled compliance scans.\n\n---\n18-STEP PATCHING LIFECYCLE:\n\n1. Open ServiceNow CR — ITIL compliance, MOP documented, approval tracked\n2. Silence monitoring — Alertmanager + CloudWatch + PagerDuty (auto-expires as safety net)\n3. Pre-connectivity — Gate: SSH + Python reachability with failure categorization\n4. Baseline + backup — 41 config files + commands + package list + kernel version\n5. Drain ALB traffic — Deregister from target group, wait for connections to drain\n6. Stop services — Graceful shutdown\n7. Verify stopped — 3-level check (systemd + port + HTTP)\n8. Apply patches — dnf update with exclusions, snapshot, reboot if kernel updated\n9. Start services — Restart application\n10. Verify running — 3-level health check\n11. Integrity check — Checksum (md5) + app tag verification (8 components)\n12. Certificate validation — Expiry, permissions, key-pair match, CA bundle\n13. Post-patch validation — 7-dimension zero-touch PASS/FAIL (packages, kernel, services, logs, disk, network, app)\n14. Post-connectivity — Server → dependencies port-level nc tests (critical vs non-critical)\n15. Re-register ALB — Add back + wait for ALB health check to pass\n16. Re-enable monitoring — Silences removed, alerts active again\n17. Close ServiceNow CR — Closed with evidence (success/failure + reports)\n18. Send notifications — Slack + Email + PagerDuty (outcome-based)\n\n---\nROLES (12 production-ready roles):\n\n• connectivity — Pre-patch gate with failure categorization (unreachable/auth/Python)\n• pre_backup / post_backup — Captures 41 config files + 26 commands (timestamped)\n• diff — Pre vs post comparison, generates ADDED/REMOVED report\n• stop / start — Service management\n• status — 3-level health: systemd → port listening → HTTP response\n• patch — dnf update, package exclusions, kernel reboot handling, targeted service restarts\n• integrity_check — Checksum (md5) + app tag verification for 8 components\n• cert_check — Certificate expiry, file permissions, cert-key pair match, CA bundle validation\n• post_connectivity — Port-level nc from patched server to all dependencies (config-driven)\n• baseline_check — Python scripts validate no unexpected drift\n• notification — Slack + Email + PagerDuty (SUCCESS/FAILED/ABORTED)\n\n---\nPLAYBOOKS:\n\n• servicenow_patching.yml — Full lifecycle with CR open/update/close\n• alb_traffic_management.yml — ALB drain/re-register with serial: 20% + max_fail_percentage: 10\n• monitoring_silence.yml — Alertmanager + CloudWatch + PagerDuty silence/remove\n• POST_PATCH_VALIDATION.yml — 7-dimension zero-touch validation\n• Collect_Baseline.yml — Pre-patch package/kernel baseline\n• RollBack_POST_PATCH_VALIDATION.yml — Rollback verification\n\n---\n7-DIMENSION ZERO-TOUCH VALIDATION:\n\n1. Package compliance — all pending packages installed?\n2. Kernel verification — new kernel loaded (conditional)?\n3. Service health — critical services active (systemd)?\n4. Log error check — any critical errors in journal?\n5. Disk space — all mounts below 90%?\n6. Network connectivity — server reaches all dependencies?\n7. Application health — HTTP response from app endpoint?\n\nALL PASS → proceed. ANY FAIL → auto-rollback triggered.\n\n---\nTRAFFIC MANAGEMENT (Zero Downtime):\n\n• serial: 20% — only patch 20% of fleet at a time\n• max_fail_percentage: 10 — abort if >10% of batch fails\n• ALB deregister → wait drain (60s) → verify zero connections → patch → health check → re-register → wait ALB healthy\n• Other servers serve traffic while one is patched\n\n---\nSECURITY FEATURES:\n\n• Ansible Vault for all credentials (ServiceNow, SMTP, PagerDuty)\n• Package exclusions (protect DB/custom packages from auto-update)\n• Certificate validation (post-patch TLS health)\n• File integrity (checksum detects overwritten configs)\n• Blast radius control (serial batching)\n• Auto-rollback (no human decision needed)\n\n---\nKEY DESIGN DECISIONS:\n\n• 18 discrete steps — each independently testable and rerunnable\n• Config-driven connectivity matrix — add tests without code changes\n• Critical vs non-critical endpoints — don't block for monitoring being down\n• Auto-expire silences — alerts resume even if playbook fails\n• Reports fetched to controller — evidence survives even if server dies\n• PagerDuty only on failure — don't wake on-call for success\n• Conditional kernel check — don't fail because kernel wasn't pending\n\n---\nSTILL PENDING (mention as future improvements):\n\n• Dynamic inventory (aws_ec2 / vmware_vm_inventory plugin)\n• Molecule testing for roles\n• Master orchestrator playbook (single entry point for all 18 steps)\n• ServiceNow report attachment via API\n\n---\nINTERVIEW SUMMARY:\n\nBuilt a fully automated, zero-touch OS patching system with 18 steps covering the complete lifecycle. Opens ServiceNow Change Request with MOP, silences monitoring, drains traffic from ALB, patches servers in 20% batches with automatic rollback on failure, validates across 7 dimensions (packages, kernel, services, logs, disk, network, application health), verifies file integrity (checksum + tag for 8 components), validates certificates (expiry, permissions, key-pair, CA bundle), tests server-to-server connectivity, re-registers to ALB, re-enables alerts, closes CR, and sends Slack/Email/PagerDuty notifications. Zero human intervention for pass/fail decision. Runs on Ansible Automation Platform.\n\nWhy this matters at 12 YOE:\n• Enterprise-grade Day-2 operations (not just deploy-and-forget)\n• ITIL compliance (ServiceNow CR lifecycle automated)\n• Zero-downtime (ALB drain + serial batching)\n• Zero-touch validation (7 dimensions, no human decision)\n• Multi-layer security (integrity, certs, vault, blast radius)\n• Observability integration (silence/re-enable monitoring)\n• Multi-channel alerting (Slack + Email + PagerDuty)\n• AAP experience = enterprise Ansible Automation Platform"}

    {num:1,q:"Project: Full DevOps Platform Provisioning — Zero to Production with One Command",score:"Portfolio",scoreClass:"score-pass",a:"GitLab Repo: https://gitlab.com/patelsiddharthnids993/devopsproject\n\nProblem Statement:\nSetting up a complete DevOps environment (CI/CD + security scanning + logging + monitoring + Kubernetes cluster) takes days manually. Needed a single-command solution that provisions the entire platform from scratch on AWS — infrastructure, configuration, K8s cluster bootstrap, and full observability stack.\n\nArchitecture:\nPython Orchestrator (sidd.py) → Terraform (6 EC2 instances) → Ansible (configure all) → K8s Cluster (kubeadm) → Monitoring Stack (Prometheus/Grafana/AlertManager)\n\nTwo Deployment Modes:\n• k8s_cluster/ — Production-like: 6 AWS EC2 instances + full K8s cluster + monitoring\n• one_vm/ — Lightweight: single EC2 or Docker Compose (all services on one machine)\n\nPython Orchestrator (sidd.py):\n• Checks prerequisites (Terraform, AWS CLI, Ansible, Docker)\n• Generates SSH ed25519 keypair if missing\n• Installs missing packages automatically\n• Calls Terraform → waits → generates Ansible inventory from Terraform output → calls Ansible playbooks in sequence\n• Single entry point for entire platform provisioning\n\nTerraform Layer (6 EC2 instances):\n• jenkinsserver — CI/CD platform (IAM role attached for S3 access)\n• sonarqubeserver — SAST/code quality\n• elkserver — centralized logging (Elasticsearch + Logstash + Kibana)\n• k8smaster — Kubernetes control plane\n• k8sworker1 — worker node\n• k8sworker2 — worker node\n• Security Group: shared SG for internal communication\n• IAM Role: EC2 → S3 full access (for Trivy reports)\n• Key Pair: generated SSH key uploaded for Ansible connectivity\n\nAnsible Layer:\n• k8s/first.yml — K8s prerequisites on ALL nodes:\n  - Disable swap, load kernel modules (overlay, br_netfilter)\n  - Configure containerd with SystemdCgroup\n  - Install kubelet, kubeadm, kubectl (pinned version 1.23.4)\n• k8s/second.yml — Master setup:\n  - kubeadm init, configure kubectl for ubuntu user\n  - Install Calico CNI (pod networking)\n  - Generate join token, save to local file\n• k8s/third.yml — Workers join cluster:\n  - Copy join command, execute on worker nodes\n• jenkins/jenkins.yml — Full Jenkins installation + plugins\n• sonarqube/sonarqube.yml — SonarQube + PostgreSQL setup\n• sonarqube/sonarqube_scanner.yml — Sonar Scanner installation\n• trivy/trivy.yml — Trivy vulnerability scanner\n• elk_stack/ — Elasticsearch + Logstash + Kibana\n• k8s/prometheus_stack.yml — Deploys full monitoring to K8s cluster\n\nKubernetes Monitoring Stack (cm_k8s/):\n• Prometheus — ClusterRole + ConfigMap (scrape configs) + Deployment + Service\n• Grafana — Datasource ConfigMap (auto-configured Prometheus) + Deployment + Service\n• AlertManager — ConfigMap (routes, receivers) + Alert Templates + Deployment + Service\n• kube-state-metrics — full RBAC (ClusterRole + Binding + SA) + Deployment + Service\n• node-exporter — DaemonSet (one per node) + Service\n• Namespace: monitoring (isolated)\n\nDynamic Inventory:\n• Terraform provisions → Python extracts public IPs → generates Ansible inventory with correct IPs\n• No manual IP entry — fully automated handoff between Terraform and Ansible\n\nKey Design Decisions:\n• Python orchestrator as glue — handles dependency checks, sequencing, error handling between tools\n• Two modes (k8s_cluster vs one_vm) — flexibility for dev/learning vs production-like\n• Pinned K8s version — reproducible cluster builds\n• Calico CNI — production-grade network policies support\n• Full monitoring from day one — not an afterthought\n• IAM role on Jenkins EC2 — no static keys for S3 access\n\n---\nIMPROVEMENTS — What I would add:\n\n1. Use Terraform modules instead of repeated resource blocks:\n• Current: 6 separate aws_instance blocks with duplicated config\n• Fix: Single module with for_each over instance map (name, type, iam_profile)\n• Result: DRY, maintainable, easily scale to 20 nodes\n\n2. Replace provisioners with Ansible-only approach:\n• Current: Terraform provisioner copies SSH key\n• Fix: Terraform outputs IPs → Ansible handles all config including key distribution\n• Result: Cleaner separation of concerns, no provisioner fragility\n\n3. Use EKS instead of kubeadm for production:\n• Current: Self-managed kubeadm cluster (good for learning, risky for prod)\n• Fix: aws_eks_cluster + managed node groups via Terraform\n• Result: Managed control plane, automatic upgrades, AWS integration (IRSA, ALB)\n\n4. Remote state + locking:\n• Current: Local state file\n• Fix: S3 backend + DynamoDB locking\n• Result: Team-safe, recoverable, encrypted state\n\n5. Replace Python orchestrator with Makefile or Terragrunt:\n• Current: Custom Python script manages sequencing\n• Fix: Makefile (make infra → make configure → make deploy) or Terragrunt dependency chain\n• Result: Standard tooling, easier for team to understand\n\n6. Add Helm for monitoring stack:\n• Current: Raw K8s manifests for Prometheus/Grafana\n• Fix: kube-prometheus-stack Helm chart — includes everything + ServiceMonitors + pre-built dashboards\n• Result: One helm install, maintained by community, upgradeable\n\n7. Add VPC with proper subnet design:\n• Current: Default VPC, flat network\n• Fix: Custom VPC with public/private subnets, NAT Gateway, proper route tables\n• Result: Production-ready network isolation\n\n8. GitOps with ArgoCD:\n• Fix: Deploy ArgoCD to cluster, manage monitoring manifests via Git\n• Result: Declarative cluster state, drift detection, self-healing\n\nInterview Summary:\nBuilt a single-command platform provisioning system that creates an entire DevOps environment from scratch — Python orchestrator calls Terraform to provision 6 AWS EC2 instances (Jenkins, SonarQube, ELK, K8s master + 2 workers), then Ansible configures everything: bootstraps Kubernetes cluster with kubeadm + Calico CNI, installs CI/CD tools (Jenkins, SonarQube, Trivy), ELK logging, and deploys full Prometheus monitoring stack (Prometheus + Grafana + AlertManager + kube-state-metrics + node-exporter). Dynamic inventory generation ensures zero manual intervention between Terraform and Ansible.\n\nWhy this matters at 12 YOE:\n• End-to-end platform ownership — infra + config + cluster + monitoring in one repo\n• Multi-tool orchestration — Python + Terraform + Ansible + K8s working together\n• Kubernetes from scratch — shows deep understanding (not just kubectl apply)\n• Full observability stack — monitoring is part of platform, not an afterthought\n• Two deployment modes — shows flexibility (prod-like vs lightweight)\n• IAM + Security Groups — proper AWS security patterns\n\n---\nVM-BASED VARIANT (cicd_java):\nGitLab Repo: https://gitlab.com/patelsiddharthnids993/cicd_java\n\nLightweight version for environments without Kubernetes — same tools deployed as systemd services on VMs.\n\nTerraform: 2 EC2 instances (jenkinsserver + sonarqubeserver)\n\nAnsible Playbooks:\n• jenkins/jenkins.yml — Jenkins install + Nginx reverse proxy (jenkinsnginx_nginx.conf)\n• sonarqube/sonarqube.yml — SonarQube + PostgreSQL + Nginx proxy + sonar.service (systemd)\n• elk_stack/elkserver.yml — Elasticsearch + Logstash + Kibana + Filebeat (full ELK pipeline)\n  - Configs: elasticsearch.yml, kibana.yml, filebeat.yml, logstash init script, jvm.options\n• prometheus_stack/pgaserver.yml — VM-based monitoring:\n  - Prometheus (prometheus.service systemd unit)\n  - Grafana\n  - AlertManager (alertmanager.service + alertmanager.yml routing config)\n  - Node Exporter (node_exporter.service on all targets)\n  - Alert rules (node-rules.yml — CPU, memory, disk thresholds)\n  - prometheus.yml scrape config (targets auto-populated)\n• webserver/apache.yml — Apache + mod_wsgi for Java/Django web apps\n• webserver/django.yml — Gunicorn + Nginx reverse proxy (gunicorn.socket + gunicorn.service systemd units)\n\nKey difference from K8s mode:\n• Monitoring as systemd services (not K8s Deployments)\n• Nginx reverse proxy for each tool (not Ingress)\n• Filebeat ships logs to Logstash (not Fluent Bit to Loki)\n• Suitable for legacy/regulated environments where K8s isn't available\n\nSame Python orchestrator pattern (sidd.py): prerequisite check → Terraform → dynamic inventory → Ansible\n\nInterview angle: 'Platform has two modes — K8s-based for production, VM-based with systemd for environments where K8s isn't available. Same tooling, different deployment targets. Shows flexibility to operate in both worlds.'\n\n---\nK8s-NATIVE LOGGING (EFK Stack):\nGitLab Repo: https://gitlab.com/patelsiddharthnids993/efk\n\nCentralized logging deployed natively on Kubernetes (complements VM-based ELK above).\n\nComponents:\n• Elasticsearch — StatefulSet (1 replica), headless Service (clusterIP: None), PVC via volumeClaimTemplates (1Gi ReadWriteMany)\n  - Init containers: fix-permissions (chown), increase-vm-max-map (sysctl 262144), increase-fd-ulimit (65536)\n  - ES_JAVA_OPTS: -Xms512m -Xmx512m\n• Fluentd — DaemonSet (one per node, collects all pod logs)\n  - RBAC: ServiceAccount + Role + RoleBinding\n  - Mounts: /var/log/pods + /var/lib/docker/containers (read-only)\n  - Custom kubernetes.conf via ConfigMap (log parsing, metadata enrichment)\n  - Ships to elasticsearch.efk.svc.cluster.local:9200\n• Kibana — Deployment + NodePort Service, auto-connected to Elasticsearch\n• PersistentVolume — hostPath for ES data\n• Namespace: efk (isolated)\n\nPython orchestrator (script.py) — deploys in correct order:\nPV → Namespace → ES StatefulSet (wait 50s for readiness) → ES Service → Kibana Deployment → Kibana Service → Fluentd RBAC → Fluentd DaemonSet\n\nKey K8s patterns used:\n• StatefulSet for Elasticsearch (stable identity, ordered startup, PVC per pod)\n• DaemonSet for Fluentd (one collector per node, auto-deploys on new nodes)\n• Headless Service (pod-to-pod discovery for ES cluster)\n• Init containers (kernel tuning required by ES)\n• ConfigMap for Fluentd config (kubernetes.conf)\n\nVM-based ELK vs K8s-native EFK:\n• VM: Filebeat → Logstash → Elasticsearch → Kibana (systemd services)\n• K8s: Fluentd DaemonSet → Elasticsearch StatefulSet → Kibana Deployment\n• K8s version is self-healing, auto-scales with cluster, collects all pod logs automatically"}

// Populate session dropdown
function populateSessionDropdown(category) {
    const select = document.getElementById('sessionSelect');
    select.innerHTML = '<option value="all">All Sessions</option>';
    const filtered = category === 'all' ? sessions : sessions.filter(s => s.category === category);
    filtered.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.title;
        select.appendChild(opt);
    });
}

// Count totals
let totalQ = 0;
sessions.forEach(s => totalQ += s.questions.length);
document.getElementById('total-questions').textContent = totalQ;
document.getElementById('total-sessions').textContent = sessions.length;

function formatAnswer(text) {
    return text.replace(/\n/g, '<br>').replace(/• /g, '&bull; ');
}

function renderQuestions() {
    const category = document.getElementById('categorySelect').value;
    const sessionId = document.getElementById('sessionSelect').value;
    const container = document.getElementById('qaContainer');
    const sessionInfo = document.getElementById('sessionInfo');

    let filteredSessions = sessions;
    if (category !== 'all') filteredSessions = filteredSessions.filter(s => s.category === category);
    if (sessionId !== 'all') filteredSessions = filteredSessions.filter(s => s.id === sessionId);

    if (filteredSessions.length === 0) {
        sessionInfo.classList.remove('active');
        container.innerHTML = '<div class="empty-state"><h2>No sessions found</h2><p>Select a different category</p></div>';
        return;
    }

    // If single session selected, show session info
    if (filteredSessions.length === 1) {
        const s = filteredSessions[0];
        sessionInfo.classList.add('active');
        document.getElementById('sessionTitle').textContent = s.title;
        document.getElementById('sessionDate').textContent = s.date;
        document.getElementById('sessionCount').textContent = s.questions.length;
        document.getElementById('sessionScore').textContent = s.avgScore;
    } else {
        sessionInfo.classList.remove('active');
    }

    let html = '';
    filteredSessions.forEach(session => {
        if (filteredSessions.length > 1) {
            html += `<h2 style="color:#38bdf8;margin:20px 0 10px;font-size:1.3rem;border-bottom:1px solid #334155;padding-bottom:10px;">${session.title} <span style="font-size:0.8rem;color:#94a3b8;">(${session.date})</span></h2>`;
        }
        session.questions.forEach(item => {
            const editKey = `${session.id}-q${item.num}`;
            const savedAnswer = localStorage.getItem(editKey);
            const displayAnswer = savedAnswer || item.a;
            const isEdited = savedAnswer ? '<span class="edited-badge">EDITED</span>' : '';
            html += `
            <div class="qa-card" data-key="${editKey}" data-original="${encodeURIComponent(item.a)}">
                <div class="qa-question" onclick="toggleCard(this)">
                    <div class="qa-number">${item.num}</div>
                    <div class="qa-question-text">
                        ${item.q}
                        <span class="score-badge ${item.scoreClass}">${item.score}</span>${isEdited}
                    </div>
                    <div class="qa-toggle">▼</div>
                </div>
                <div class="qa-answer">
                    <div class="answer-content">${formatAnswer(displayAnswer)}</div>
                    <button class="edit-btn" onclick="editAnswer(this, event)">✏️ Edit</button>
                </div>
            </div>`;
        });
    });
    container.innerHTML = html;
}

function toggleCard(el) { el.closest('.qa-card').classList.toggle('open'); }

function editAnswer(btn, event) {
    event.stopPropagation();
    const card = btn.closest('.qa-card');
    const answerDiv = card.querySelector('.qa-answer');
    const contentDiv = card.querySelector('.answer-content');
    const editKey = card.dataset.key;
    const originalAnswer = decodeURIComponent(card.dataset.original);
    const currentAnswer = localStorage.getItem(editKey) || originalAnswer;

    // Replace content with textarea
    contentDiv.style.display = 'none';
    btn.style.display = 'none';

    const editArea = document.createElement('div');
    editArea.className = 'edit-area';
    editArea.innerHTML = `
        <textarea class="edit-textarea">${currentAnswer}</textarea>
        <div class="edit-actions">
            <button class="btn-reset" onclick="resetAnswer(this)">↺ Reset to Original</button>
            <button class="btn-cancel" onclick="cancelEdit(this)">Cancel</button>
            <button class="btn-save" onclick="saveAnswer(this)">💾 Save</button>
        </div>
    `;
    answerDiv.appendChild(editArea);
    editArea.querySelector('textarea').focus();
}

function saveAnswer(btn) {
    const card = btn.closest('.qa-card');
    const editKey = card.dataset.key;
    const textarea = card.querySelector('.edit-textarea');
    const newAnswer = textarea.value.trim();

    // Save to localStorage
    localStorage.setItem(editKey, newAnswer);

    // Re-render
    renderQuestions();

    // Show save confirmation
    showToast('✅ Answer saved successfully!');
}

function cancelEdit(btn) {
    const card = btn.closest('.qa-card');
    const contentDiv = card.querySelector('.answer-content');
    const editBtn = card.querySelector('.edit-btn');
    const editArea = card.querySelector('.edit-area');

    editArea.remove();
    contentDiv.style.display = '';
    editBtn.style.display = '';
}

function resetAnswer(btn) {
    const card = btn.closest('.qa-card');
    const editKey = card.dataset.key;

    if (confirm('Reset to original answer? Your edits will be lost.')) {
        localStorage.removeItem(editKey);
        renderQuestions();
        showToast('↺ Reset to original answer');
    }
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#065f46;color:#34d399;padding:12px 20px;border-radius:8px;font-size:0.9rem;z-index:1000;animation:fadeIn 0.3s;';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

let allExpanded = false;
document.getElementById('expandAllBtn').addEventListener('click', function() {
    allExpanded = !allExpanded;
    document.querySelectorAll('.qa-card').forEach(c => {
        allExpanded ? c.classList.add('open') : c.classList.remove('open');
    });
    this.textContent = allExpanded ? 'Collapse All' : 'Expand All';
});

document.getElementById('categorySelect').addEventListener('change', function() {
    populateSessionDropdown(this.value);
    document.getElementById('sessionSelect').value = 'all';
    renderQuestions();
});

document.getElementById('sessionSelect').addEventListener('change', renderQuestions);

// Initial
populateSessionDropdown('all');
renderQuestions();
    </script>
</body>
</html>
