{
  id: "intro-1",

  title: "Introduction & Experience — Session 1",
  date: "July 17, 2026",
  targetRole: "Staff/Principal DevOps Engineer (12 YOE)",
  avgScore: "5/10 → Enhanced to 12 YOE standard",
  questions: [
    {num:1,q:"Tell me about yourself. Walk me through your experience.",score:"5/10 → Enhanced",scoreClass:"score-mid",a:"Original Answer (5/10):\nMy name is Siddharth Patel. I'm having 12 year of experience in DevOps and Cloud. My job is to setup CI/CD pipeline for applications with security in mind. I usually deploy the application on K8s and Openshift using Ansible on AWS. I set continuous monitoring and continuous logging of the application. We usually architect the AWS infrastructure for our application and even create using Terraform.\n\n---\nWhy it scores 5/10 at 12 YOE bar:\n• No scale or scope (how many apps, clusters, teams?)\n• No complexity or challenges solved\n• No architecture decisions or trade-offs owned\n• No business impact (cost savings, MTTR reduction, deployment frequency)\n• Reads like a job description, not an experience story\n• No leadership, mentoring, or cross-team influence\n• Technologies listed but not contextualized (why Ansible? why that stack?)\n\n---\nEnhanced Answer (12 YOE standard):\nMy name is Siddharth Patel and I have 12 years of experience in DevOps and Cloud Engineering, primarily in large-scale enterprise and product environments.\n\nOver the years I have owned end-to-end platform engineering responsibilities — from designing AWS infrastructure using Terraform, to running production Kubernetes and OpenShift clusters serving hundreds of microservices. I have built and maintained CI/CD pipelines using Jenkins and GitHub Actions with security gates integrated at every stage — SAST, container scanning with Trivy, secrets detection, and policy enforcement using OPA.\n\nOn the infrastructure side, I have architected multi-account AWS environments with proper landing zone patterns — VPC design, Transit Gateway, IAM boundaries, and cost governance. I have used Ansible extensively for configuration management and application deployment automation across both bare-metal and cloud environments.\n\nFor observability, I have implemented full monitoring stacks — Prometheus and Grafana for metrics, ELK/EFK for centralized logging, and distributed tracing for microservices. I have also set up alerting and on-call runbooks that reduced MTTR significantly.\n\nIn recent years I have moved more into platform engineering — standardizing how development teams deploy, building golden paths, and reducing the cognitive load on developers so they can ship faster without worrying about infrastructure.\n\nI have also mentored junior and mid-level engineers, contributed to architecture decisions, and led incident response for critical production outages.\n\n---\nKey additions for 12 YOE level:\n• Scale and scope — shows enterprise-level operation\n• Security integration specifics — shows DevSecOps maturity\n• Multi-account AWS — shows architectural ownership\n• MTTR improvement — converts work into business impact\n• Platform engineering angle — shows evolution from engineer to platform owner\n• Mentoring and leadership — 12 YOE must have influenced others\n• Golden paths — shows thinking beyond individual work"},
    {num:2,q:"Introduce yourself, your projects, and your educational background.",score:"Passed",scoreClass:"score-pass",a:"My name is Siddharth Patel. I have 12 years of experience in DevOps and Cloud Engineering.\n\nEducation: [Your degree — B.Tech/B.E. in CS/IT from XYZ University]\n\nCurrent role & responsibilities:\nOwn end-to-end platform engineering — infrastructure provisioning to production observability. Design and maintain AWS infrastructure using Terraform, run production Kubernetes and OpenShift clusters, build CI/CD pipelines with security at every stage.\n\nKey projects:\n\n1. Platform Migration to Kubernetes — Migrated 30+ microservices from EC2 to EKS. GitOps with ArgoCD, reduced deployment time from 45min to 8min, zero-downtime releases via canary deployments.\n\n2. Multi-Account AWS Landing Zone — Architected 15+ account structure with Terraform. SCPs, centralized logging, GuardDuty, OIDC-based CI/CD. Reduced security findings by 70%.\n\n3. Observability Stack — Prometheus, Grafana, Loki, distributed tracing. Reduced MTTR from 2hrs to 20min. Defined SLOs for all critical services.\n\n4. DevSecOps Pipeline — SAST, SCA, container scanning, image signing in CI/CD. SOC2 compliance with automated evidence generation.\n\nTech stack: AWS, Terraform, Kubernetes, OpenShift, Ansible, Jenkins, GitHub Actions, ArgoCD, Prometheus/Grafana, ELK, Docker, Python\n\nWhat drives me: Building self-service platforms that let developers ship fast and safely without worrying about infrastructure.\n\n[Customize with real degree, company names, and actual numbers]"}
  ]
},
{
  id: "system-design-1",
  category: "system-design",
  title: "System Design & Architecture — Session 1",
  date: "July 17, 2026",
  targetRole: "Staff/Principal DevOps Engineer (12 YOE)",
  avgScore: "All Passed (Model Answers)",
  questions: [
    {num:1,q:"What is a distributed system?",score:"Passed",scoreClass:"score-pass",a:"System where components run on multiple machines communicating over a network, appearing as a single system to users. No shared memory — nodes coordinate via network messages (APIs, queues, RPCs).\n\nWhy use:\n• Scalability — add nodes, not upgrade one machine\n• Availability — one node fails, others continue\n• Geographic distribution — serve from nearest region\n• Fault tolerance — no single point of failure\n\nChallenges (CAP theorem):\n• Consistency — all nodes see same data\n• Availability — every request gets response\n• Partition tolerance — works despite network failures\n• Pick 2 of 3 (in practice: CP or AP during partition)\n\nCommon problems:\n• Network failures, latency, partial failures\n• Data consistency (eventual vs strong)\n• Split brain, clock skew\n• Service discovery, load balancing\n\nExamples in DevOps:\n• K8s cluster (etcd = distributed KV store, pods across nodes)\n• Microservices (20 services via APIs/queues)\n• Kafka (distributed log across brokers)\n• DynamoDB (multi-AZ, eventual consistency)\n\nPatterns: Retries with backoff, circuit breakers, idempotency, event-driven (eventual consistency), saga pattern, service mesh (mTLS, observability)."},
    {num:2,q:"Have you done any migration from monolithic to microservices?",score:"Passed",scoreClass:"score-pass",a:"Yes. Used Strangler Fig Pattern — incremental, not big bang. Monolith and microservices coexist during transition.\n\nSteps:\n1. Identify boundaries — domain-driven design. Find loosely-coupled modules (auth, payments, orders, notifications)\n2. Start with easiest — extract non-critical service first (e.g., notifications). Low risk, build confidence\n3. API Gateway — single entry point. Routes /api/notifications to new service, rest to monolith\n4. Database split — hardest part. Start with read replica, then migrate to own DB. Avoid shared DB between services\n5. Event-driven decoupling — SQS/Kafka for communication. Async where possible\n6. Containerize — each microservice in own Docker image, deployed independently on K8s\n7. CI/CD per service — independent pipelines, independent deployability\n8. Observability — distributed tracing (essential), centralized logging, per-service dashboards\n\nChallenges:\n• Data consistency across services (saga pattern, eventual consistency)\n• Network latency (one in-process call → multiple network hops)\n• Debugging harder (tracing essential)\n• Team restructuring (service ownership)\n\nKey principle: Incremental migration. Extract one service at a time, validate, repeat."}
  ]
},
{
  id: "docker-1",
  category: "docker",
  title: "Docker — Interview Session 1",
  date: "July 17, 2026",
  targetRole: "Staff/Principal DevOps Engineer (12 YOE)",
  avgScore: "All Passed (Model Answers)",
  questions: [
    {num:1,q:"Define Dockerfile and its role.",score:"Passed",scoreClass:"score-pass",a:"Dockerfile = text file with ordered instructions to build a Docker image. Each instruction creates a layer.\n\nKey instructions:\n• FROM — base image, pin digest, never latest in prod\n• LABEL — metadata (maintainer, version)\n• RUN — execute commands, combine with && to minimize layers\n• COPY — add files, preferred over ADD\n• WORKDIR — sets working directory\n• USER — run as non-root (USER 1001)\n• EXPOSE — documents port, doesn't publish it\n• HEALTHCHECK — defines container health test\n• ENTRYPOINT — fixed executable, hard to override\n• CMD — default args, easily overridden at runtime\n• ENV — environment variables\n\nUse multi-stage builds — build in heavy image, copy only artifact to minimal runtime image.\n\nBuilt with docker build -t name:tag ."},
    {num:2,q:"Scenario: Challenge in securely storing and distributing Docker images.",score:"Passed",scoreClass:"score-pass",a:"Problem: Pulling base images directly from Docker Hub in CI/CD — no scanning, no signing, public registry. CVE found in a base image actively used in production with no visibility into which services were affected.\n\nWhat we did:\n• Migrated to private ECR as single source of truth — blocked all public registry pulls via admission controller\n• Added Trivy scanning in CI — Critical/High = build fails, image never pushed\n• Implemented image signing with Cosign — unsigned images rejected at cluster admission\n• Generated SBOM (Syft) for every image — stored as OCI artifact in ECR alongside the image\n• Set ECR lifecycle policies — untagged images deleted after 7 days, keep last 20 tagged\n• Enforced immutable tags — only git-sha or semver, no latest\n\nResult: Next CVE reported → queried SBOMs across all images in under 2 minutes → identified every affected service → patched and redeployed within SLA."},
    {num:3,q:"How would you secure a Docker image?",score:"Passed",scoreClass:"score-pass",a:"• Base image — use minimal (Alpine, distroless), pin digest (sha256:), never latest\n• Non-root user — USER 1001, set runAsNonRoot: true in K8s\n• Multi-stage builds — build tools never ship to prod, smaller attack surface\n• No secrets in image — layers are extractable; use Secrets Manager / env injection at runtime\n• Read-only filesystem — --read-only flag or readOnlyRootFilesystem: true in K8s\n• Drop capabilities — --cap-drop ALL, add back only what's needed\n• Scan image — Trivy/Grype in CI, fail on Critical/High before push\n• Sign image — Cosign after scan, verify signature at admission (Kyverno/OPA)\n• SBOM — generate with Syft, store alongside image in registry\n• Immutable tags — git-sha or semver only, no latest in prod\n• Private registry — ECR/Harbor, block public registry pulls\n• .dockerignore — exclude .git, .env, node_modules from build context"}
  ]

{
  id: "devsecops-1",
  category: "devsecops",
  title: "DevSecOps — Interview Experience 1",
  date: "July 15, 2026",
  targetRole: "Staff/Principal DevOps Engineer",
  avgScore: "4.3/10 (answered questions)",
  questions: [
    {num:1,q:"What is DevSecOps, and how does it differ from traditional DevOps? Why do organizations adopt it?",score:"5/10",scoreClass:"score-mid",a:"DevSecOps integrates security practices into every phase of the DevOps pipeline — from code commit to production — rather than treating it as a separate phase at the end.\n\nIn traditional DevOps, security was a gate at the end. A security team would audit before release, find 50 vulnerabilities, and send it back — delaying deployment by weeks. This is called 'shift-left' — we move security earlier.\n\nPractically:\n• Code phase: SAST tools (SonarQube, Semgrep) scan during PR\n• Build phase: SCA tools (Snyk, Dependabot) check dependencies for CVEs\n• Container phase: Trivy/Aqua scan images before registry\n• Deploy phase: OPA/Kyverno enforce policies in Kubernetes\n• Runtime: Falco detects anomalous behavior\n\nWhy adopt:\n• Breaches cost $4.5M average\n• Compliance mandates (SOC2, PCI-DSS, HIPAA)\n• Fixing in code = 100x cheaper than in production"},
    {num:2,q:"In a CI/CD pipeline, what specific security tools or checks would you integrate at each stage?",score:"5.5/10",scoreClass:"score-mid",a:"Six stages:\n\n1. Pre-commit: git-secrets, truffleHog — prevent secrets from commit\n\n2. Code stage (PR): SAST (SonarQube, Semgrep, Checkmarx) + SCA (Snyk, Dependabot). Fail on critical/high.\n\n3. Build/Container: Image scanning (Trivy, Grype), Dockerfile linting (Hadolint), Image signing (Cosign), SBOM generation (Syft)\n\n4. IaC: Checkov, tfsec, KICS — catch Terraform/CloudFormation misconfigs\n\n5. Deploy/Admission (K8s): OPA Gatekeeper/Kyverno — enforce policies. Only signed images.\n\n6. Runtime: DAST (OWASP ZAP), Falco (runtime threats), Network policies\n\nGating: Critical=fail, High=warning+approval, Medium/Low=logged"},
    {num:3,q:"Scenario: Critical CVE (CVSS 9.8) in ubuntu:22.04 used by 35 production services. How do you handle it?",score:"Passed",scoreClass:"score-pass",a:"Immediate Assessment (30 min):\n1. Check CVE details — attack vector, remotely exploitable?\n2. Trivy/Grype scan all registries to identify affected images\n3. Identify internet-facing services (priority)\n4. Check if patch available\n\nTriage:\n• Tier 1 (immediate): Internet-facing, sensitive data (8-10 services)\n• Tier 2 (same day): Internal with network exposure\n• Tier 3 (48 hrs): Internal-only, batch jobs\n\nRemediation:\n1. Update base image in golden Dockerfile templates\n2. CI/CD rebuild Tier 1 with patched base\n3. Scan to confirm CVE resolved\n4. Deploy: staging → smoke test → production (canary/rolling)\n\nIf no patch: WAF rules, switch to Alpine/Distroless, Falco rules\n\nPrevention: Renovate/Dependabot for Dockerfiles, 'no image >30 days' policy, weekly rebuilds"},
    {num:4,q:"What is the difference between SAST and DAST? Give real examples where one catches what the other misses.",score:"4.5/10",scoreClass:"score-mid",a:"SAST (Static Application Security Testing): Scans source code WITHOUT running. White-box. Tools: SonarQube, Semgrep, Checkmarx.\n\nDAST (Dynamic Application Security Testing): Tests running app from outside. Black-box. Tools: OWASP ZAP, Burp Suite.\n\nSAST catches, DAST won't:\n• Hardcoded password: db_password='admin123' — SAST sees code, DAST can't\n• SQL injection behind disabled feature flag — SAST scans all paths\n\nDAST catches, SAST won't:\n• Misconfigured server headers (missing CSP) — runtime config not in code\n• Auth bypass from misconfigured Nginx — SAST only sees app code\n• Broken session management — needs live interaction\n\nTradeoffs:\n• SAST: Fast, high false positives, all code paths, language-dependent\n• DAST: Slow, lower false positives, only reachable paths, language-agnostic\n\nBest practice: SAST on every PR, DAST nightly against staging"},
    {num:5,q:"Developer commits AWS Secret Access Key (admin-level) to public GitHub repo. Notified 2 hours later. What do you do?",score:"3/10",scoreClass:"score-low",a:"⚠️ CRITICAL: REVOKE FIRST. Deleting from Git is NOT enough.\n\nImmediate (15 min):\n1. REVOKE the key — IAM console → deactivate/delete. Minute-one priority.\n2. Assess blast radius (admin access = worst case):\n   • CloudTrail: API calls in last 2 hours\n   • Look for: new IAM users, EC2 launched, S3 accessed, Lambda created\n3. If unauthorized activity → SEV1, security team, treat as breach\n4. Issue new credentials, update Secrets Manager/CI-CD\n\nGit cleanup (secondary — key is burned):\n5. BFG Repo Cleaner / git filter-repo\n6. Force push (but public repo = already scraped by bots)\n\nPrevention:\n1. Pre-commit: git-secrets, truffleHog, detect-secrets\n2. CI: Gitleaks on every PR\n3. GitHub Push Protection (blocks known secret patterns)\n4. No long-lived keys — OIDC federation\n5. Least privilege — never admin\n6. Vault/Secrets Manager\n7. GuardDuty alerts"},
    {num:6,q:"How do you enforce security policies in Kubernetes? Prevent root containers and latest tag?",score:"3.5/10",scoreClass:"score-low",a:"Automated enforcement at multiple layers:\n\nLayer 1: Admission Controllers (real-time)\nKyverno:\n• validationFailureAction: Enforce\n• Rule: requires runAsNonRoot: true\n• Rule: rejects image:latest\nOPA Gatekeeper: Rego language, ConstraintTemplate + Constraint\n\nLayer 2: Pod Security Standards (K8s 1.25+)\n• Label namespace: pod-security.kubernetes.io/enforce: restricted\n• Auto-blocks: root, privilege escalation, hostPath\n\nLayer 3: CI/CD (shift-left)\n• Datree, kubesec, Checkov scan manifests\n• Fail pipeline BEFORE reaching cluster\n\nLayer 4: Image Registry Policy\n• Only trusted private registries allowed\n• Cosign signature verification\n\nPrinciple: PREVENT at admission, don't detect after deployment."},
    {num:7,q:"Scenario: Production pod making unusual outbound calls to unknown IP at 3 AM. CPU spiked. No recent deploy. What do you suspect?",score:"Passed",scoreClass:"score-pass",a:"Suspicion: Compromised container — crypto mining or data exfiltration.\n\nImmediate (contain):\n1. DON'T kill pod — need forensic evidence\n2. NetworkPolicy: block all egress (quarantine)\n3. Capture evidence: ps aux, /tmp, kubectl logs, netstat\n\nInvestigation:\n4. Check Falco alerts\n5. Verify image integrity (SHA vs registry)\n6. Entry point: CVE? Exposed service? Permissive RBAC?\n7. External IP: VirusTotal/AbuseIPDB (C2? mining pool?)\n8. Audit logs: lateral movement?\n\nRemediation:\n9. Kill + redeploy from known-good image\n10. Rotate ALL secrets pod accessed\n11. Patch vulnerability\n\nPrevention: Default-deny egress, Falco, readOnlyRootFilesystem, distroless images, Pod Security Standards"},
    {num:8,q:"What is Secrets Management in DevOps? How to ensure secrets never hardcoded and available securely at runtime?",score:"Passed",scoreClass:"score-pass",a:"Layered approach:\n\nLayer 1 — Central Store: Vault, AWS Secrets Manager, Azure Key Vault\n\nLayer 2 — Runtime Injection (never build time):\n• External Secrets Operator (syncs AWS SM → K8s Secret)\n• Vault Agent Sidecar (injects as files)\n\nLayer 3 — CI/CD: OIDC federation (GitHub Actions → AWS, no keys). Never in YAML.\n\nLayer 4 — Rotation: Auto-rotate (SM + Lambda), short-lived tokens, cert-manager\n\nLayer 5 — Audit: Vault logs, CloudTrail, git-secrets pre-commit\n\nPrinciples: Never in code, encrypt at rest (KMS), least privilege per service, short-lived, automated rotation, full audit trail"},
    {num:9,q:"SOC2 Audit: How do you ensure only authorized, scanned, approved container images run in production K8s?",score:"Passed",scoreClass:"score-pass",a:"Chain of trust:\n\n1. Trusted Registry: Only private ECR/GCR/Harbor. Public blocked by admission controller.\n2. Scanning: Trivy/Grype in CI. Critical/High = not pushed. Scheduled rescans.\n3. Image Signing: Cosign signs after scan. Admission verifies. Unsigned = rejected.\n4. SBOM: Syft generates. Stored as OCI artifact. Auditor can verify contents.\n5. Immutable Tags: Git SHA/semver only. No latest.\n6. Audit Trail: CI logs (who built), scan reports (S3), PR approval, K8s audit logs.\n7. Runtime: Falco, K8s audit logging, drift detection.\n\nSummary: Code review → CI scan → Signed → Private registry → Admission verifies → Production. Every step logged."},
    {num:10,q:"What does Shift-Left Security mean? How to balance security enforcement with developer velocity?",score:"Passed",scoreClass:"score-pass",a:"Move security earlier. Cost: IDE=$1, PR=$10, Staging=$100, Prod=$10K, Breach=$1M+\n\nBalance strategy:\n• Pre-commit: Secrets only (<2 sec) — blocks\n• PR/CI: Targeted SAST + SCA critical/high (<5 min) — blocks critical/high\n• Post-merge: Full scan (15-20 min) — report only\n• Nightly: DAST (1-2 hrs) — creates tickets\n\nKey strategies:\n1. Only block on Critical/High\n2. Tune tools — eliminate false positives\n3. Fast in CI, thorough async\n4. Developer-friendly output (what, where, how to fix)\n5. Golden path = secure by default\n6. Security Champions (1 per team)\n\nReal example: SonarQube ALL rules → 300 findings → ignored. Fixed: 40 rules, critical-only blocking, auto-fix, 90sec scan. FP 70%→8%, caught 4x more real vulns."}
  ]
},
{
  id: "devsecops-2",
  category: "devsecops",
  title: "DevSecOps — Interview Experience 2 (Gap Topics)",
  date: "July 16, 2026",
  targetRole: "Staff/Principal DevOps Engineer",
  avgScore: "All Passed (Model Answers)",
  questions: [
    {num:1,q:"Supply chain security — SBOM, Sigstore/Cosign, SLSA framework, dependency confusion attacks?",score:"Passed",scoreClass:"score-pass",a:"Supply chain = ensuring every component (code, deps, build tools, images) isn't tampered.\n\nSBOM (Syft): Bill of materials for every image. New CVE → scan SBOMs → instantly know affected services. Required by US Executive Order.\n\nCosign (Sigstore): Sign images after build. Verify at admission. Keyless signing via OIDC identity. Rekor transparency log.\n\nSLSA levels: L1=documented build, L2=hosted+signed, L3=hardened+non-falsifiable, L4=two-person+hermetic.\n\nDependency confusion: Attacker publishes public package with same name as internal. Prevention: scoped packages, private registry --index-url only.\n\nProtection chain: Signed commits → locked deps → isolated build → sign artifacts → verify at deploy → monitor runtime."},
    {num:2,q:"Container hardening — Distroless, multi-stage builds, rootless, security best practices?",score:"Passed",scoreClass:"score-pass",a:"Distroless: No shell, no package manager, no OS utils. 90% fewer CVEs. Attacker can't exec shell. Sizes: 50MB vs 200MB Ubuntu.\n\nMulti-stage: Build stage (all tools, 1GB) → Production stage (minimal, 20MB). Build deps never ship.\n\nRootless: USER 65534, runAsNonRoot:true, allowPrivilegeEscalation:false, capabilities drop ALL, readOnlyRootFilesystem:true.\n\nPipeline: Build → Trivy scan (fail on HIGH/CRITICAL) → SBOM generate (Syft) → Sign (Cosign) → Push (only if clean).\n\nLinting: Hadolint catches: latest tag, unpinned versions, running as root, missing apt cleanup.\n\nPin images: FROM ubuntu:22.04@sha256:abc... (digest, not just tag)."},
    {num:3,q:"Automate compliance (SOC2/PCI/HIPAA) in CI/CD? Compliance-as-code, evidence generation?",score:"Passed",scoreClass:"score-pass",a:"Philosophy: Rules IN pipeline → automated evidence → always audit-ready. No manual scramble.\n\nEach stage generates evidence: PR approvals (Git log), SBOM (build), scan reports (stored), signed images (deploy), Config rules (runtime).\n\nSOC2 mapped: CC6.1 access → RBAC/SSO. CC7.1 change mgmt → PR+CI. CC8.1 vuln mgmt → Trivy reports. CC9.1 incident → PagerDuty history.\n\nPolicy-as-code (OPA): Terraform must have encryption (SOC2 CC6.6). RDS must be encrypted (PCI 3.4). Fail pipeline if violated.\n\nContinuous monitoring: AWS Config conformance packs (CIS). Auto-remediation via SSM. Weekly evidence collection pipeline → S3 compliance bucket.\n\nAuditor response: Every control = automated evidence. Git history, scan reports, IAM reports, incident logs. All generated automatically."},
    {num:4,q:"Threat modeling for DevOps pipeline? STRIDE framework, attack surface, prioritization?",score:"Passed",scoreClass:"score-pass",a:"STRIDE: Spoofing (stolen keys), Tampering (malicious commit), Repudiation (no audit), Information Disclosure (secrets leak), DoS (resource bomb), Elevation of Privilege (container escape).\n\nAttack surface per stage: Source (compromised laptop, dependency injection) → Build (poisoned cache, exposed secrets) → Registry (image tampering) → Deploy (unverified images, bypass approvals) → Runtime (container escape, lateral movement).\n\nPrioritization: Risk = Likelihood × Impact. HIGH: secrets in Git, no MFA on CI, root containers. MEDIUM: no image signing, no network policies. LOW: unsigned commits, unverified cache.\n\nProcess: Draw data flow → identify trust boundaries → apply STRIDE → rate risk → define mitigations → track in backlog → review on arch changes."},
    {num:5,q:"Vulnerability management at scale? Lifecycle, prioritization with 500 findings, SLA?",score:"Passed",scoreClass:"score-pass",a:"Lifecycle: Discover → Triage → Prioritize → Assign → Fix → Verify → Close → Continuous rescan.\n\nPrioritization (NOT just CVSS): CVSS (30%) + Exploitability/KEV (25%) + Exposure/internet-facing (25%) + Data sensitivity (20%).\n\nSLA: Critical=24h, High=7d, Medium=30d, Low=90d. Auto-page P1, alert team-lead at P2 5-day mark, escalate overdue.\n\nAt-scale: Deduplicate (same CVE in 20 images = 1 fix). Group by root cause (outdated base image = fix base, close 100). Fix at source (golden Dockerfile). Accept risk formally for false positives.\n\nMetrics: MTTR per severity, SLA compliance %, open count trending, new vulns/week, recurrence rate."},
    {num:6,q:"Zero trust networking in K8s/cloud? Micro-segmentation, mTLS, network policies at scale?",score:"Passed",scoreClass:"score-pass",a:"Zero Trust: Nothing trusted by default. Verify every request. Encrypt everything.\n\nLayer 1 — K8s Network Policies: Default deny ALL in namespace. Explicit allow per service (only payment can reach DB on 5432). Include DNS egress.\n\nLayer 2 — Service Mesh mTLS (Istio): PeerAuthentication mode:STRICT. Every service auto-gets certificate. All traffic encrypted. Identity verified.\n\nLayer 3 — Cloud: Private subnets only, VPC endpoints, Security Groups minimal, NACLs for known-bad.\n\nLayer 4 — External: WAF → CloudFront → ALB → Ingress → Pod (already in mTLS mesh).\n\nStrategy: Start default-deny → map dependencies → allow specific → monitor flow logs → tighten. Tools: Cilium (eBPF), Calico, Istio."},
    {num:7,q:"Security breach detected in production. Walk through incident response. What's different from operational incidents?",score:"Passed",scoreClass:"score-pass",a:"Differences: Security = contain + preserve evidence (don't destroy!). Legal/regulatory notification required. Scope unknown (how far did attacker go?).\n\nPhase 1 — Detection: GuardDuty/Falco/CloudTrail alert → confirm real vs false positive → declare incident.\n\nPhase 2 — Containment (1 hour): Isolate (quarantine SG, NetworkPolicy deny), block attacker (WAF/NACL), revoke creds. DON'T terminate instances (forensics). Snapshot volumes.\n\nPhase 3 — Investigation: How in? (initial vector) When started? (CloudTrail timeline) What accessed? Where else? (lateral) Still present? (persistence)\n\nPhase 4 — Eradication: Remove persistence, patch vuln, rotate all creds, rebuild from clean.\n\nPhase 5 — Recovery: Restore from backups, enhanced monitoring 30 days.\n\nPhase 6 — Post: Forensic report, legal notification (GDPR 72h), customer notice if PII, action items.\n\nAutomation: GuardDuty → EventBridge → Lambda (isolate + snapshot + page + ticket)."},
    {num:8,q:"Security monitoring & SIEM for cloud-native? Log aggregation, detection rules, security observability?",score:"Passed",scoreClass:"score-pass",a:"Sources: CloudTrail (API), VPC Flow Logs (network), K8s Audit (API server), WAF logs, GuardDuty, Falco, DNS logs.\n\nDetection rules: Auth anomalies (login without MFA, unusual geo, brute force). IAM changes (new user, admin policy, trust policy modified). Data exfiltration (large S3 download, unusual outbound). K8s threats (exec into container, SA token external use, privileged container).\n\nSIEM options: Security Hub (AWS native), Splunk (enterprise), Elastic SIEM (open source), Datadog Security (SaaS).\n\nSecurity observability: Combine metrics + logs + traces + security events. Alert → trace which service → logs at that time → metrics anomaly → correlate with deployment events.\n\nLog Insights: Query for failed logins, IAM key usage from unusual region, unusual data access patterns."},
    {num:9,q:"API security in microservices? Authentication, authorization, rate limiting, OWASP API Top 10?",score:"Passed",scoreClass:"score-pass",a:"Layers: WAF (bot/DDoS) → API Gateway (rate limit/throttle) → Auth (JWT/OAuth2/API key) → Authorization (RBAC/OPA) → Input validation → Service.\n\nAuth: JWT (stateless, scalable), OAuth2+OIDC (federated, SSO), API keys (service-to-service, rate limiting).\n\nAuthorization: OPA policies per endpoint (GET /orders → viewer role, POST /orders → admin role).\n\nRate limiting: Per-client (premium=1000/min, free=100/min), per-endpoint (POST /login=5/min prevent brute force).\n\nOWASP API Top 10: Broken Object Auth (verify ownership), Broken Auth (MFA, token expiry), Unrestricted Consumption (rate limit), SSRF (validate URLs), Misconfiguration (disable debug, CORS).\n\nInput validation: Pydantic/schemas, reject invalid before processing. Never trust client input."},
    {num:10,q:"IaC security — scanning, policy-as-code for Terraform, drift detection, preventing misconfigurations?",score:"Passed",scoreClass:"score-pass",a:"Common misconfigs (70%+ of IaC repos): Unencrypted S3, open SG (0.0.0.0/0:22), public RDS, admin IAM, no logging.\n\nTools: Checkov (multi-framework, CIS), tfsec (Terraform focused), KICS (broad), Terrascan (OPA-based).\n\nCI integration: checkov -d terraform/ → fail pipeline on findings. Zero misconfigs reach production.\n\nPolicy-as-code (OPA/Conftest): Custom rules — all S3 encrypted, no public SG, RDS not public. terraform plan -json | conftest test.\n\nDrift detection: Scheduled terraform plan (CI cron) → if changes detected → alert. AWS Config continuous monitoring. Driftctl scans for unmanaged resources.\n\nDefense in depth: IDE (pre-commit tfsec) → PR (checkov+conftest) → Plan (human review) → Apply (SCP blocks dangerous actions) → Runtime (Config auto-remediate) → Audit (compliance scan)."}
  ]
},

  questions: [
    {num:1,q:"What are the components of Kubernetes and its high-level architecture?",score:"Passed",scoreClass:"score-pass",a:"Control Plane:\n• API Server — single entry point for all requests (kubectl, SDKs, controllers). Handles authn/authz (RBAC). Stateless, scales horizontally\n• etcd — distributed key-value store. Stores entire cluster state. Only API server talks to etcd directly. Always backup etcd\n• Controller Manager — runs control loops. Reconciles desired vs actual state. Node, Deployment, ReplicaSet controllers etc.\n• Scheduler — watches unscheduled pods, picks best node based on resource requests, affinity/anti-affinity, taints/tolerations, topology spread\n\nWorker Node:\n• kubelet — agent on every node. Receives PodSpec from API server, ensures containers running and healthy. Reports status back to control plane\n• kube-proxy — manages network rules (iptables/ipvs). Enables Service abstraction, routes traffic to correct pod IPs. One per node\n• Container Runtime — runs containers (containerd, CRI-O). Implements CRI. Docker not supported as runtime from K8s 1.24+\n\nAdd-ons:\n• CoreDNS — cluster DNS, resolves service names to ClusterIPs\n• CNI plugin — handles pod networking (Calico, Flannel, Cilium, AWS VPC CNI)\n\nFlow: kubectl apply → API Server (authn/authz) → etcd (store desired state) → Controller Manager (creates objects) → Scheduler (assigns node) → kubelet (pulls image, starts container via runtime)"},
    {num:2,q:"Why use Helm package manager instead of simple manifest files?",score:"Passed",scoreClass:"score-pass",a:"Plain manifests work for: single app, few files, one environment.\n\nHelm needed when:\n• Templating — same app to dev/staging/prod with different values. One chart, multiple values.yaml\n• Packaging — bundle 10-15 related manifests (deployment, service, ingress, configmap, HPA, PDB, SA) into one versioned unit\n• Dependency management — chart depends on Redis, PostgreSQL sub-charts. Helm resolves automatically\n• Versioned releases — helm history shows every version. helm rollback to any revision in seconds\n• Upgrade/rollback — atomic upgrades with rollback on failure. Tracks release state\n• Reusability — one chart for 50 microservices, each with own values file\n• Ecosystem — thousands of community charts (Prometheus, Nginx, cert-manager). Install complex apps in one command\n• Hooks — pre-install DB migration, post-upgrade health check\n• Chart repos — distribute internal apps via private registry (OCI-based)\n\nWhen NOT Helm:\n• Very simple deployments (Kustomize overlays simpler)\n• Team uncomfortable with Go templating\n• GitOps-only (some prefer Kustomize + ArgoCD)\n\nIn practice: Helm for third-party apps + complex internal services. Kustomize for simple apps with env overlays. Both together also valid (Helm template → Kustomize patches)."},
    {num:3,q:"Which environments do you deploy the application to?",score:"Passed",scoreClass:"score-pass",a:"• Dev — auto-deployed on feature branch merge. Unstable, frequent resets. Minimal resources (spot, scaled down)\n• QA/Test — QA runs functional/regression tests. Auto-deployed on PR merge to develop\n• Staging — mirror of production (same infra, same config, scaled down). DAST, performance tests, integration tests. Must pass all gates to proceed\n• Production — live traffic. Canary/rolling via ArgoCD. Requires approval gate, change ticket, no Friday deploys\n\nOptional:\n• Sandbox — developer experimentation, ephemeral, auto-destroyed 24-48hrs\n• Performance/Load — dedicated for load testing (isolated from staging)\n• DR — disaster recovery region, warm standby or pilot light\n\nHow we manage:\n• Same Helm chart, different values-{env}.yaml per environment\n• ArgoCD ApplicationSets — one definition, auto-generates per environment\n• Terraform separate directories per env\n• Promote same image through envs (build once, deploy many) — never rebuild per env\n• Secrets per env via External Secrets Operator pointing to env-specific AWS Secrets Manager paths\n\nKey principle: Staging must match production in config/architecture. Differences = production surprises."},
    {num:4,q:"How do you expose an application deployed in Kubernetes to external users?",score:"Passed",scoreClass:"score-pass",a:"Options (simple → production-ready):\n\n1. NodePort (dev/test only):\n• Exposes on every node's IP at static port (30000-32767)\n• Not production — no TLS, no routing, exposes node IPs\n\n2. LoadBalancer Service:\n• Provisions cloud LB (AWS NLB/CLB) per service\n• One external IP per service — expensive at scale\n• Good for single service or L4 (TCP/UDP) workloads\n\n3. Ingress (production standard):\n• Single LB → Ingress Controller → routes to many services\n• L7 routing: path-based (/api → api-svc, /web → web-svc), host-based (api.example.com vs app.example.com)\n• TLS termination (cert-manager + Let's Encrypt auto-provisions certs)\n• One LB for all services = cost-effective\n• Controllers: Nginx (common), AWS ALB (native WAF), Traefik, Istio Gateway\n\n4. Service Mesh Gateway (Istio/Gateway API):\n• Advanced traffic management (canary %, header-based routing, mTLS)\n• Gateway API (K8s native, replacing Ingress long-term)\n\nProduction setup: Internet → CloudFront/WAF → ALB → Ingress Controller → Service → Pods\n• WAF for security, cert-manager for auto TLS, External-DNS for auto Route53 records, HPA on ingress controller\n\nKey principle: Ingress for HTTP/HTTPS (most cases). LoadBalancer for TCP/gRPC. Never NodePort in production."}
  ]
},

  questions: [
    {num:1,q:"Design Kubernetes architecture for microservices-based banking app ensuring HA and efficient resource utilization.",score:"Reference",scoreClass:"score-pass",a:"Multi-AZ EKS (3 AZs). Managed node groups across AZs (m5.xlarge + r5).\n\nMicroservices: 3+ replicas per Deployment, PDB minAvailable:2, anti-affinity across nodes/AZs, Guaranteed QoS for critical (requests=limits).\n\nNamespaces by domain (payments, accounts, auth). Resource quotas per namespace. Network policies for microsegmentation. Istio mTLS for all internal traffic.\n\nStateful: Prefer managed (RDS/DynamoDB). If in-cluster: StatefulSets + EBS gp3.\n\nScaling: HPA on CPU + custom metrics, Karpenter for nodes.\n\nDeployment: Helm + ArgoCD GitOps."},
    {num:2,q:"Implement Canary deployments for critical banking application. How to monitor and roll back?",score:"Reference",scoreClass:"score-pass",a:"Argo Rollouts (not native rolling update).\n\nStrategy: 5% → pause 5min → 25% → 50% → 100%\n\nAnalysis between steps: AnalysisTemplates query Prometheus. Error rate, P99 latency, transaction success. If error >0.1% OR latency doubles → auto-abort.\n\nMonitoring: Prometheus + ServiceMonitors, Grafana canary vs stable dashboards, Alertmanager.\n\nRollback: Automated (analysis fails) or manual (kubectl argo rollouts abort). Both versions run simultaneously — rollback = stop traffic to canary (seconds).\n\nCritical: DB migrations must be backward-compatible (expand-and-contract pattern)."},
    {num:3,q:"Application has security vulnerability. Steps to patch and secure the Kubernetes cluster?",score:"Reference",scoreClass:"score-pass",a:"Contain → Remediate → Harden → Prevent\n\nContain: Assess blast radius (app code? image? K8s component?). Network Policies: default-deny. Scale to zero if non-critical.\n\nPatch: Image CVE → rebuild + Trivy scan + rolling update. K8s CVE → control plane upgrade + node rolling update. Test in staging first.\n\nHarden: kube-bench (CIS benchmark), review RBAC, Pod Security Standards (runAsNonRoot, readOnlyRootFilesystem, no privilege escalation, drop capabilities).\n\nPrevent: OPA/Kyverno admission policies, Trivy in CI/CD, Falco runtime, Vault for secrets, postmortem + update checks."},
    {num:4,q:"Kubernetes cluster version upgrade. Steps for safe and seamless upgrade?",score:"Reference",scoreClass:"score-pass",a:"Pre-upgrade: Review release notes (deprecations), test in staging, check compatibility (CNI, CSI, CRDs), backup etcd/config, verify PDBs set, notify teams.\n\nUpgrade (EKS):\n1. Control plane first (managed, zero-downtime)\n2. Update add-ons: CoreDNS, kube-proxy, VPC CNI\n3. Worker nodes: rolling update node groups (cordon → drain → terminate → new nodes)\n4. One minor version at a time only\n\nValidation: kubectl get nodes, smoke tests, DaemonSets, HPA/ingress/cert-manager working, monitor 30 min.\n\nRollback: Workers can revert launch template. Control plane not easily reversible. Staging test is critical.\n\nBest Practice: Upgrade regularly — don't fall 3+ versions behind."},
    {num:5,q:"Pod in CrashLoopBackOff. How would you troubleshoot?",score:"Reference",scoreClass:"score-pass",a:"Step 1: kubectl describe pod — check Events (OOMKilled, ImagePull, probe fail, permission)\n\nStep 2: kubectl logs <pod> --previous (crashed container logs)\n\nStep 3: Common causes:\n• OOMKilled → increase memory limit or fix leak\n• App crash → check logs for stack trace, missing env/config/DB\n• Liveness probe failing → increase initialDelaySeconds\n• Permission issues → SecurityContext too restrictive\n• Missing ConfigMap/Secret\n\nStep 4: Debug:\n• kubectl run debug --image=busybox -it (test network/DNS)\n• kubectl debug <pod> -it --image=ubuntu (ephemeral container)\n\nStep 5: kubectl top pod (resource usage), describe node (pressure)"},
    {num:6,q:"Design multi-tenant Kubernetes cluster for different teams with isolation and resource management.",score:"Reference",scoreClass:"score-pass",a:"1. Namespace per team/env (clear naming)\n2. RBAC: Role scoped to namespace, no ClusterRole unless needed\n3. Resources: ResourceQuota + LimitRange per namespace\n4. Network: Default-deny NetworkPolicy, explicit allow rules\n5. Pod Security: restricted PSS, Kyverno policies, no privileged\n6. Cost: Labels for team/project, Kubecost per-namespace\n7. Observability: Per-namespace dashboards, Loki namespace filtering\n8. Images: Team-specific registry path restriction\n\nIf extreme isolation needed: separate clusters + federation."}
  ]
},
{
  id: "kubernetes-2",
  category: "kubernetes",
  title: "Kubernetes — Interview Experience 2",
  date: "July 15, 2026",
  targetRole: "Staff/Principal DevOps Engineer",
  avgScore: "All Passed (Model Answers)",
  questions: [
    {num:1,q:"What is Kubernetes and why do we need it? If I already have Docker, why can't I just run containers without K8s?",score:"Passed",scoreClass:"score-pass",a:"Docker = build/run on ONE host. K8s = orchestrate across MANY.\n\nDocker alone can't answer: What if container crashes at 3AM? How to run 50 copies across 20 servers? How to update without downtime? How does traffic reach the right container? How to auto-scale?\n\nK8s capabilities: Self-healing (restarts crashed pods, reschedules on node failure), Scaling (HPA on CPU/memory/custom), Service discovery (DNS-based automatic), Rolling updates (zero-downtime + rollback), Resource management (requests/limits), Declarative (state 'I want 3 replicas', K8s maintains it).\n\nWhen NOT needed: Single app on 1-2 servers, team <3 engineers, simple batch jobs, serverless fits better."},
    {num:2,q:"Explain Deployment vs StatefulSet vs DaemonSet. When to use each? Production example?",score:"Passed",scoreClass:"score-pass",a:"Deployment (stateless): Pods interchangeable, random names, scale freely, rolling updates. Example: web servers, APIs, microservices.\n\nStatefulSet (stateful): Stable unique identities (mysql-0,1,2), ordered create/delete, own PersistentVolume per pod, stable DNS via headless service. Example: PostgreSQL, Kafka, Elasticsearch.\n\nDaemonSet (one per node): Exactly one pod on every node, auto-deploys on new nodes. Example: Fluent Bit, Datadog agent, Node Exporter, CNI plugins.\n\nDecision: Interchangeable? → Deployment. Need identity + storage + order? → StatefulSet. One per node? → DaemonSet.\n\nCommon mistake: Running DBs as Deployments (loses PVC on restart). Use StatefulSet."},
    {num:3,q:"How does K8s networking work? Pod A in namespace 'payments' wants to talk to Pod B in namespace 'orders' — how does traffic flow?",score:"Passed",scoreClass:"score-pass",a:"Flat network: every pod gets unique IP, can reach any pod without NAT.\n\nFlow: Pod A → calls order-service.orders.svc.cluster.local:8080 → CoreDNS resolves to ClusterIP → kube-proxy/iptables load-balances → one of Pod B replicas.\n\nService provides: Stable DNS name, stable ClusterIP, load balancing, service discovery.\n\nTypes: ClusterIP (internal, default), NodePort (dev/test), LoadBalancer (prod external), ExternalName (CNAME to external).\n\nDNS: <service>.<namespace>.svc.cluster.local (full) or <service>.<namespace> (short cross-namespace).\n\nNetwork Policies: Default all-open. Add policies for microsegmentation (only payments namespace can reach orders on port 8080).\n\nCNI: AWS VPC CNI (real IPs), Calico (policies), Cilium (eBPF, best perf), Flannel (simple)."},
    {num:4,q:"Scenario: 10 pods, users report intermittent 504 Gateway Timeout. App logs clean. CPU/memory fine. How to troubleshoot?",score:"Passed",scoreClass:"score-pass",a:"504 + no app errors + normal resources = networking/connectivity issue, not app.\n\nPath: User → Ingress → Service → Pod. Where is timeout?\n\n1. Ingress controller logs (grep 504, find which pod IP)\n2. Check endpoints (all 10 in list? pod Running but unresponsive?)\n3. Readiness probes (too lenient? pod in endpoints but can't serve)\n4. Connection limits (netstat ESTABLISHED count, CLOSE_WAIT stuck)\n5. Test specific pods (port-forward, bypass service)\n6. DNS (CoreDNS overloaded?)\n7. Network Policies (new policy blocking?)\n8. Node issues (conntrack table full = packets dropped)\n9. Downstream deps (app waiting on slow DB/API, ingress times out first)\n\nTop causes: Unhealthy pod passing liveness (fix probe), downstream slow (circuit breaker), conntrack full (increase max), connection pool exhausted, ingress timeout too low."},
    {num:5,q:"What are Resource Requests and Limits? What happens without them? Memory exceed vs CPU exceed?",score:"Passed",scoreClass:"score-pass",a:"Requests = guaranteed minimum (scheduling). Limits = maximum (runtime enforcement).\n\nWithout: No requests → overcommitted nodes. No limits → one pod eats everything. Neither → BestEffort QoS (first evicted).\n\nCPU exceeds limit → THROTTLED (slowed, not killed). Kernel CFS throttles cycles. App slow but alive.\n\nMemory exceeds limit → OOMKilled (killed immediately). SIGKILL, no graceful shutdown. CrashLoopBackOff.\n\nCPU = compressible (throttle). Memory = incompressible (kill).\n\nQoS: Guaranteed (req=limit, last evicted), Burstable (req<limit, middle), BestEffort (nothing set, first evicted).\n\nBest practice: CPU limits controversial (consider not setting — let burst). Memory limits always set (1.5-2x normal). Use VPA recommend mode to find correct values."},
    {num:6,q:"Scenario: Run Redis cluster (1 master, 2 replicas) with persistent data. Design this on K8s.",score:"Passed",scoreClass:"score-pass",a:"StatefulSet (not Deployment) — needs stable identity, storage, ordered startup.\n\nObjects: StatefulSet, Headless Service (DNS per pod), PVCs (one per pod), ConfigMap (master.conf + replica.conf), ClusterIP Service (clients), PDB.\n\nHeadless Service: clusterIP: None → gives redis-0.redis.default.svc.cluster.local\n\nInit container: if hostname == redis-0 → master.conf, else → replica.conf (replicaof redis-0).\n\nvolumeClaimTemplates: 100Gi per pod, survives restarts.\n\nProbes: redis-cli ping for readiness + liveness.\n\nPDB: minAvailable: 2 (maintenance safety).\n\nProduction: Consider Redis Sentinel/Cluster mode, operators (redis-operator), or managed (ElastiCache). Monitor memory, clients, replication lag. Backup RDB to S3."},
    {num:7,q:"What are ServiceAccounts? Why is default SA dangerous? How to implement least-privilege for pods?",score:"Passed",scoreClass:"score-pass",a:"SA = identity pod uses to auth with K8s API. Default SA shared by all pods, token auto-mounted, enables lateral movement.\n\nAttack: Exploit app → read token at /var/run/secrets/... → curl K8s API → list secrets → game over.\n\nFix:\n1. Disable auto-mount on default SA (automountServiceAccountToken: false)\n2. One SA per application\n3. RBAC: Role with only needed permissions (get configmaps, not admin)\n4. RoleBinding to specific SA\n5. Most pods: automountServiceAccountToken: false (don't need K8s API)\n6. AWS: IRSA (SA → IAM Role via OIDC, no static keys)\n\nAudit: kubectl auth can-i --list --as=system:serviceaccount:ns:sa-name"},
    {num:8,q:"Scenario: E-commerce 10x traffic spike during flash sale (9AM, 2hrs). Normally 5 pods, need 50. Design auto-scaling.",score:"Passed",scoreClass:"score-pass",a:"Combination: Scheduled pre-scale + HPA reactive + node capacity.\n\nLayer 1 — HPA: min:5, max:60, CPU 60% + custom RPS metric. ScaleUp aggressive (100% per 30s). ScaleDown slow (10% per 60s, 5min stabilization).\n\nLayer 2 — KEDA CronScaler: At 8:50AM set desiredReplicas:50. At 11:15AM revert. Pre-scale BEFORE traffic hits.\n\nLayer 3 — Karpenter: Provisions exact nodes in ~60s. On-demand (not spot) for reliability. ttlSecondsAfterEmpty: 300.\n\nLayer 4 — Pre-warm nodes: Increase ASG min before event.\n\nTimeline: 8:30 nodes ready → 8:50 pods scaled → 9:00 sale starts → HPA fine-tunes → 11:00 ends → gradual scale-down → 11:35 back to normal.\n\nTest before: Load test 10x, verify HPA/nodes/DB can handle. Monitor during: pod count, latency, errors. Engineer on standby."},
    {num:9,q:"What is PV, PVC, StorageClass? How does dynamic provisioning work?",score:"Passed",scoreClass:"score-pass",a:"PV = actual storage (EBS volume). PVC = request for storage. StorageClass = template for auto-creating storage.\n\nAnalogy: StorageClass=Menu, PVC=Order, PV=Dish served.\n\nDynamic flow: Dev creates PVC → StorageClass controller → WaitForFirstConsumer (waits for pod schedule) → Provisioner creates EBS in same AZ → PV auto-created → bound to PVC → mounted to pod.\n\nStorageClass params: provisioner (ebs.csi.aws.com), type (gp3), iops, encrypted, reclaimPolicy (Retain for prod), volumeBindingMode (WaitForFirstConsumer critical — prevents AZ mismatch), allowVolumeExpansion.\n\nAccess modes: RWO (one node, DBs), ROX (many read, configs), RWX (many R/W, EFS/NFS).\n\nReclaim: Retain (keep data) vs Delete (cleanup). Volume expansion: patch PVC size, resizes online.\n\nBest practices: WaitForFirstConsumer always, Retain for prod, encryption, expansion enabled, CSI drivers, monitor usage, backup via VolumeSnapshots/Velero."},
    {num:10,q:"Design K8s platform for 5 teams, 30 microservices, dev/staging/prod. Structure clusters, namespaces, access control.",score:"Passed",scoreClass:"score-pass",a:"2 clusters: prod-cluster (strict, HA, on-demand) + non-prod-cluster (dev+staging, spot instances).\n\nNamespaces: team-payments, team-orders, team-users, etc in prod. team-payments-dev, team-payments-staging in non-prod. Plus platform-system, observability, security.\n\nRBAC: OIDC groups. Dev/staging = full admin own namespace. Prod = read-only for devs, deploy only via CI/CD. No human deploys to prod (ArgoCD only).\n\nResources: ResourceQuota per namespace (CPU, memory, pod limits). LimitRange for defaults.\n\nNetwork: Default-deny per namespace + explicit allow rules.\n\nPolicies (Kyverno): No root, no latest, must have requests/limits + probes, private registry only, required labels.\n\nGitOps (ArgoCD): infra-config repo (namespaces, RBAC, policies) + team repos (base + overlays per env) + platform-apps repo. Auto-sync dev, manual prod.\n\nObservability: Prometheus + Grafana (per-namespace), Loki, Tempo, Kubecost (chargeback).\n\nSecrets: External Secrets Operator + AWS SM."}
  ]
},

  questions: [
    {num:1,q:"What is Ingress? How differs from LoadBalancer Service? Path-based routing, TLS termination, which controller to use?",score:"Passed",scoreClass:"score-pass",a:"Ingress = L7 routing (HTTP/HTTPS) with single external IP. LoadBalancer = L4, one LB per service ($$$). Ingress = one LB for all services with path/host routing.\n\nArchitecture: Internet → Cloud LB → Ingress Controller Pod → routes to services by path/host.\n\nFeatures: Path routing (/api→api-svc, /web→web-svc), host routing (api.example.com vs www.example.com), TLS termination (cert-manager auto-provisions Let's Encrypt certs), annotations (rate-limit, body-size, redirects).\n\nControllers: Nginx (general, popular), AWS ALB (provisions real ALB+WAF), Traefik (auto-discovery), Istio Gateway (service mesh), Kong (API gateway).\n\nChoose: Small/medium → Nginx. AWS+WAF → ALB. Service mesh → Istio. API-first → Kong."},
    {num:2,q:"Explain Helm chart structure, values override hierarchy, hooks, rollback. Helm vs Kustomize?",score:"Passed",scoreClass:"score-pass",a:"Structure: Chart.yaml (metadata) + values.yaml (defaults) + templates/ (templated manifests) + charts/ (dependencies).\n\nValues hierarchy (low→high): sub-chart values → parent values.yaml → -f custom-values.yaml → --set key=value.\n\nHooks: pre-install, pre-upgrade, post-upgrade, pre-rollback. Use: DB migration before upgrade (pre-upgrade hook Job).\n\nRollback: helm history → helm rollback my-app <revision>. Re-deploys that revision's manifests.\n\nHelm vs Kustomize: Helm = Go templates, packaging, chart repos, rollback. Kustomize = overlays/patches, no templates, built into kubectl, GitOps-native.\n\nUse Helm: third-party apps, complex permutations, distribution. Use Kustomize: simple apps, env overlays. Both together: Helm template | kubectl apply -k overlay/."},
    {num:3,q:"Explain node affinity, pod affinity/anti-affinity, taints & tolerations, topology spread constraints with production examples.",score:"Passed",scoreClass:"score-pass",a:"Node Affinity: Schedule on specific nodes (required=hard, preferred=soft). Example: 'only SSD nodes' or 'prefer us-east-1a'.\n\nPod Anti-Affinity: Spread replicas. topologyKey=hostname (across nodes) or zone (across AZs). Example: 'don't put 2 payment pods on same node'.\n\nPod Affinity: Co-locate. Example: 'put cache on same node as app for low latency'.\n\nTaints & Tolerations: Repel pods from nodes. Taint node (gpu=true:NoSchedule) → only pods with matching toleration schedule there. Use: GPU nodes, spot instances, dedicated team nodes.\n\nEffects: NoSchedule (block new), PreferNoSchedule (soft), NoExecute (evict existing).\n\nTopology Spread: Even distribution. maxSkew:1 + topologyKey:zone = perfectly spread across AZs."},
    {num:4,q:"Explain liveness, readiness, startup probes. What happens when each fails? Common misconfigurations?",score:"Passed",scoreClass:"score-pass",a:"Liveness: 'Is container alive?' Failure → RESTART container.\nReadiness: 'Can it serve traffic?' Failure → removed from Service endpoints (no traffic).\nStartup: 'Done initializing?' Blocks liveness/readiness until passes.\n\nFlow: Pod starts → startup probe → once passes → liveness+readiness active → readiness passes → gets traffic.\n\nMisconfigurations:\n• Liveness checks dependency (DB) → DB down = ALL pods restart (cascade!) Fix: liveness=self-only\n• initialDelaySeconds too short → killed during startup. Fix: use startupProbe\n• No readiness → traffic to unready pod. Fix: always set readiness\n• Same endpoint for both → no distinction alive vs busy. Fix: separate /healthz and /ready\n\nRule: Liveness = self only (am I deadlocked?). Readiness = dependencies (can I serve?)."},
    {num:5,q:"What is GitOps? How does ArgoCD work? App of Apps pattern, sync policies, multi-cluster?",score:"Passed",scoreClass:"score-pass",a:"GitOps: Git = single source of truth. Declarative desired state. Automated reconciliation. Drift detection.\n\nArgoCD: Compares Git (desired) vs cluster (actual). If different → sync (apply). Watches Git for changes.\n\nApplication CR: source (repo+path+revision) + destination (cluster+namespace) + syncPolicy (auto/manual, prune, selfHeal).\n\nSync waves: Order resources (wave 0: namespace → wave 1: secrets → wave 2: deployment).\n\nApp of Apps: Root Application manages directory of Application CRs. Add service = add one YAML → ArgoCD auto-creates it.\n\nAppProject: RBAC per team (restrict source repos + destination namespaces).\n\nMulti-cluster: Register external clusters. Application destination points to remote cluster.\n\nWorkflow: Merge PR → ArgoCD detects → compares → auto-sync → health check → alerts if degraded."},
    {num:6,q:"How to monitor K8s cluster and apps? Prometheus ServiceMonitor, kube-state-metrics, alerting strategy?",score:"Passed",scoreClass:"score-pass",a:"Layers: Infrastructure (node_exporter), Cluster (kube-state-metrics), Application (app metrics), Autoscaling (metrics-server).\n\nmetrics-server: Lightweight, CPU/memory only, for HPA + kubectl top. NOT for alerting.\nPrometheus: Full monitoring, custom metrics, alerting, storage.\nkube-state-metrics: Cluster-level (pod phase, deployment replicas, restarts, node conditions).\n\nServiceMonitor: CRD that auto-configures Prometheus scraping by matching Service labels. No manual prometheus.yml editing.\n\nAlerts: P1 (page): service down, node NotReady, error>5%. P2 (hours): high latency, disk>80%. P3 (ticket): pod restarts, memory trending.\n\nDashboards: Cluster overview, namespace view, application RED (Rate/Errors/Duration), node resources, HPA status."},
    {num:7,q:"What are init containers? How do sidecars work? Production use cases for each?",score:"Passed",scoreClass:"score-pass",a:"Init containers: Run BEFORE main container. Must complete. Sequential. If fails → pod restarts.\n\nUse cases: Wait for dependency (nc -z db 5432), run DB migration, download config from Vault, git clone, permission setup.\n\nProperties: Different image/permissions from main, share volumes with main, run in order.\n\nSidecars: Run ALONGSIDE main container. Same pod = share localhost + volumes.\n\nUse cases: Envoy/Istio proxy (mTLS), Fluent Bit (logs), Vault Agent (secrets), CloudSQL Proxy (GCP DB), OAuth2 Proxy (auth), Prometheus exporter.\n\nNative sidecars (K8s 1.28+): initContainers with restartPolicy:Always. Starts before main, stays running, shuts down after main exits."},
    {num:8,q:"How do Jobs and CronJobs work? Completions, parallelism, failure handling, production patterns?",score:"Passed",scoreClass:"score-pass",a:"Job: Run-to-completion workload. completions (how many successes), parallelism (concurrent pods), backoffLimit (retries), activeDeadlineSeconds (max time), ttlSecondsAfterFinished (cleanup).\n\nParallel Job: completions:100, parallelism:10, completionMode:Indexed → each pod gets JOB_COMPLETION_INDEX.\n\nCronJob: schedule (cron syntax), concurrencyPolicy (Allow/Forbid/Replace), history limits, startingDeadlineSeconds.\n\nrestartPolicy: Never (new pod on fail) vs OnFailure (restart container in same pod).\n\nPatterns: DB backup (every 6h, Forbid), log cleanup (weekly), report generation (weekday 8:30AM), cert renewal check (daily).\n\nMonitoring: Alert if cronjob hasn't run (last_schedule_time), alert on failed jobs."},
    {num:9,q:"Explain pod states: ImagePullBackOff, Pending, Evicted, OOMKilled, CreateContainerConfigError. How to debug each?",score:"Passed",scoreClass:"score-pass",a:"ImagePullBackOff: Can't pull image. Causes: typo, private registry (no imagePullSecret), DockerHub rate limit, network issue. Fix: check image exists, add secret, use mirror.\n\nPending: Can't schedule. Causes: insufficient resources, no matching node selector/affinity, taint without toleration, PVC can't bind. Fix: scale nodes, fix selectors, add toleration, check StorageClass.\n\nEvicted: Kubelet kicked pod (resource pressure). Causes: disk pressure, memory pressure, ephemeral storage exceeded. Fix: clean images, fix leaks, increase disk, set requests (avoid BestEffort QoS).\n\nOOMKilled: Exceeded memory limit. Fix: increase limit, fix memory leak, set -Xmx for JVM, scale out with HPA.\n\nCreateContainerConfigError: Missing ConfigMap or Secret referenced by pod. Fix: create the missing resource in same namespace.\n\nDebug tree: Pending→events, ImagePull→describe, CrashLoop→logs --previous, OOM→top+increase, Evicted→node conditions."},
    {num:10,q:"EKS-specific: Managed node groups vs Fargate, IRSA, VPC CNI, add-ons, best practices?",score:"Passed",scoreClass:"score-pass",a:"Managed Nodes: EC2, DaemonSets, GPU, EBS, SSH, cheaper at scale. Fargate: serverless per-pod, no DaemonSets, no EBS (EFS only), no SSH, zero maintenance. Use both: nodes for core, Fargate for batch/isolation.\n\nIRSA: Map K8s ServiceAccount → IAM Role via OIDC. No access keys, temporary creds, per-pod granularity, CloudTrail audit. Annotate SA with eks.amazonaws.com/role-arn.\n\nVPC CNI: Pods get real VPC IPs (no overlay). Fast but IP exhaustion risk. Fix: prefix delegation (ENABLE_PREFIX_DELEGATION). ENI limits determine max pods per node.\n\nAdd-ons (managed): vpc-cni, coredns, kube-proxy, ebs-csi-driver. Auto-update with cluster. Don't install manually.\n\nBest practices: Private cluster (no public API), IRSA everywhere, Karpenter for scaling, Bottlerocket OS, GP3 StorageClass, topology spread, Spot for non-critical, one minor version upgrade at a time."}
  ]
},
{
  id: "terraform-0",
  category: "terraform",
  title: "Terraform — Fundamentals",
  date: "July 17, 2026",
  targetRole: "Staff/Principal DevOps Engineer (12 YOE)",
  avgScore: "All Passed (Model Answers)",
  questions: [
    {num:1,q:"Explain the role of CloudFormation in automating deployments.",score:"Passed",scoreClass:"score-pass",a:"• IaC tool — define AWS infrastructure in YAML/JSON templates, version-controlled like code\n• Declarative — describe desired state, CloudFormation figures out how to achieve it\n• Stacks — single unit of deployment. Create/update/delete all resources together\n• Change Sets — preview what will change before applying. Critical for prod safety\n• Drift detection — identifies resources manually changed outside CloudFormation\n• Stack outputs — export values (VPC ID, subnet IDs) consumed by other stacks via Fn::ImportValue\n• Nested stacks — break large templates into reusable modules (VPC stack, EKS stack, RDS stack)\n• StackSets — deploy same stack across multiple accounts and regions in one operation\n• Rollback — automatic rollback on failure, preserves last known good state\n• Integration — native with CodePipeline for automated infra deployments in CI/CD\n\nvs Terraform: CloudFormation is AWS-only, no state file to manage, free. Terraform is multi-cloud, more flexible, but requires state management."},
    {num:2,q:"Scenario: Integrating Terraform and CloudFormation for infrastructure provisioning.",score:"Passed",scoreClass:"score-pass",a:"Multi-cloud environment — AWS-native services alongside non-AWS resources (GCP, on-prem, third-party).\n\nSplit responsibilities:\n• CloudFormation — AWS-native resources that benefit from tight AWS integration (Service Catalog, StackSets across accounts, Config rules, Control Tower customizations)\n• Terraform — everything non-AWS (GCP buckets, Datadog monitors, PagerDuty schedules, Cloudflare DNS, on-prem VMware) + AWS resources needing multi-cloud consistency\n\nIntegration:\n• Terraform reads CF stack outputs via aws_cloudformation_stack data source — consumes VPC IDs, subnet IDs provisioned by CF without duplication\n• CF reads Terraform-provisioned resources via SSM Parameter Store — Terraform writes outputs to SSM, CF reads via {{resolve:ssm:/infra/eks-sg-id}}\n\nKey principle: CloudFormation for AWS-native deep integrations, Terraform for everything else and cross-cloud consistency. One tool owns each resource — no overlap."},
    {num:3,q:"What do you understand by 'state' in Terraform?",score:"Passed",scoreClass:"score-pass",a:"• State file (terraform.tfstate) — records what infrastructure Terraform currently manages. Maps config to real-world resources\n• Purpose — tracks resource IDs, metadata, dependencies. Without it Terraform can't know what exists vs what to create/update/destroy\n• Desired vs actual — terraform plan compares state (actual) vs config (desired), shows diff\n• Remote state — store in S3 + DynamoDB locking for teams. Never commit state to Git (contains sensitive values in plain text)\n• State locking — DynamoDB prevents two engineers running apply simultaneously, avoids corruption\n• State commands:\n  - terraform state list — show all managed resources\n  - terraform state show — inspect a resource\n  - terraform state mv — rename/move resource without destroying\n  - terraform state rm — remove from state without destroying real resource\n  - terraform import — bring existing resource under Terraform management\n• Sensitive data — state stores all values including secrets. Encrypt S3 bucket with KMS, restrict IAM access\n• Drift — if someone changes infra manually outside Terraform, state diverges. terraform plan shows drift. Fix: terraform apply to reconcile"},
    {num:4,q:"What happens when you change a configuration manually instead of via Terraform?",score:"Passed",scoreClass:"score-pass",a:"Drift — state file no longer matches real-world infrastructure.\n\n• terraform plan — detects drift, shows diff between state and actual. Will attempt to revert manual change on next apply\n• Risk — next terraform apply silently reverts manual change. Can cause outages if team is unaware\n\nHow to handle:\n• Accept drift — update Terraform config to match manual change, then apply (clean state)\n• Revert drift — run terraform apply to restore config-defined state\n• Ignore drift — use lifecycle { ignore_changes = [...] } for values managed externally (e.g. ASG desired capacity changed by autoscaler)\n• Import — if resource created manually, terraform import to bring it under management\n\nPrevention:\n• CI/CD only path to apply — no manual console changes to Terraform-managed resources\n• Scheduled terraform plan in CI — alerts on drift daily\n• AWS Config + CloudTrail — detect and alert on out-of-band changes\n• SCPs — restrict direct resource changes in prod account\n\nKey point: Terraform always wins on next apply unless drift is explicitly handled in config."},
    {num:5,q:"Why have you integrated Terraform into your CI/CD pipeline rather than having a separate pipeline for infrastructure?",score:"Passed",scoreClass:"score-pass",a:"We keep Terraform in its own dedicated pipeline — but integrated with the app CI/CD workflow.\n\nWhy a dedicated infra pipeline (not inside app pipeline):\n• Different lifecycle — infra changes rarely, app deploys daily. Don't run terraform plan on every app PR\n• Blast radius — infra mistake affects all services. Needs separate approval, slower cadence\n• Different permissions — infra pipeline needs admin IAM. App pipeline only deploy access. Least privilege\n• Different reviewers — platform team reviews infra, dev teams review app\n• State locking — concurrent app deploys shouldn't block each other via Terraform state lock\n\nBut integrated into workflow:\n• Triggered by infra repo changes — PR → auto terraform plan → comment on PR → review → merge → apply\n• Shared tooling — same CI platform (GitHub Actions), same secrets (OIDC), same approval gates\n• Cross-reference — app pipeline reads Terraform outputs (via SSM/remote state) for endpoints, SG IDs, cluster names\n\nWhen Terraform IS in app pipeline:\n• App-specific infra (SQS queue, S3 bucket owned by one service) — deploy together makes sense\n• Feature-branch environments (spin up whole stack per PR, destroy on merge)\n\nKey principle: Shared infra = separate pipeline (different lifecycle, blast radius, permissions). App-specific infra = can live with app pipeline."},
    {num:6,q:"How do you replicate infrastructure configuration from one environment (e.g., Dev) to another (e.g., UAT) in a different account?",score:"Passed",scoreClass:"score-pass",a:"Approach: Same code, different variables, different state, different account.\n\nStructure:\nterraform/\n├── modules/ (reusable — VPC, EKS, RDS)\n├── environments/\n│   ├── dev/ (dev account: main.tf, backend.tf, terraform.tfvars)\n│   └── uat/ (uat account: same modules, different values)\n\nKey principles:\n• Modules are identical — same VPC module, same EKS module in both envs\n• Variables differ — instance sizes, replica counts, CIDR ranges, domain names\n• Separate state — each env has own S3 backend in its own account\n• Separate AWS account — provider assumes role into target account\n• Separate pipelines — dev auto-applies on merge, UAT requires approval\n\nCross-account access:\n• CI/CD in shared-services account\n• Each env account has terraform-deploy-role trusting CI/CD account\n• Pipeline assumes role: provider { assume_role { role_arn = 'arn:aws:iam::UAT_ACCOUNT:role/terraform' } }\n\nTerragrunt (DRY alternative):\n• Single module source, terragrunt.hcl per env with env-specific inputs\n• Eliminates duplicated main.tf across environments\n\nWhat differs between envs:\n• Instance sizes (t3.medium dev vs m5.xlarge prod)\n• Replica counts (1 dev vs 3 prod)\n• Multi-AZ (disabled dev, enabled prod)\n• Backup retention, monitoring thresholds, domain names\n\nKey principle: Modules = same. Config = different. State = isolated. Account = separate. One code change propagates through all envs via promotion."}
  ]
},
{

    {num:1,q:"Structure Terraform config to provision infrastructure in multiple AWS regions efficiently?",score:"Reference",scoreClass:"score-pass",a:"Provider aliases + reusable modules.\n\nProviders: default us-east-1, alias eu-west-1.\n\nStructure: modules/ (vpc, ec2, rds) + regions/us-east-1/ and regions/eu-west-1/ calling shared modules with region-specific vars.\n\nEach region: own backend state (limited blast radius), own .tfvars.\n\nSimple resources: for_each over var.regions. Complex stacks: separate module calls.\n\nCross-region: terraform_remote_state data sources.\n\nBanking compliance: tagging baked into modules, encrypt=true, KMS per region, mandatory tags."},
    {num:2,q:"Manage Terraform state files in collaborative environment with multiple engineers?",score:"Reference",scoreClass:"score-pass",a:"S3 backend + DynamoDB locking.\n\nState splitting: Never one giant file. Split by boundary (networking, compute, databases). Parallel work on different layers.\n\nAccess: IAM policies on S3, versioning enabled (rollback), KMS encryption.\n\nWorkflow: Nobody applies locally to prod. CI/CD pipeline: branch → PR → plan (comment on PR) → review → approve → apply.\n\nEnvironments: Separate directories/backend keys (not workspaces). Each env own state, own path, ideally own AWS account."},
    {num:3,q:"Design Terraform for multi-cloud (AWS + Azure) deployments?",score:"Reference",scoreClass:"score-pass",a:"Cloud-specific modules at bottom (modules/aws/, modules/azure/). Abstraction layer on top.\n\nProviders: explicit, separate auth (IAM roles vs service principals).\n\nStructure: modules/{aws,azure,common}/ + environments/{prod-aws,prod-azure}/ + global/\n\nState: Separate per cloud per env. Naming/tagging consistent across clouds.\n\nChallenges: Feature parity gaps, different IAM models, cross-cloud networking, operational complexity."},
    {num:4,q:"Handle Terraform state corruption or drift in production?",score:"Reference",scoreClass:"score-pass",a:"Drift Detection: Scheduled terraform plan in CI. Diff = drift. Alert + investigate.\n\nCorruption Recovery:\n1. S3 versioning (restore previous version)\n2. State commands: terraform state list/show/rm/import\n3. Complete loss: restore from version or terraformer to auto-import\n\nPrevention: S3 versioning, DynamoDB locking, CI/CD only path, scheduled plan, lifecycle prevent_destroy.\n\nDrift fix: If intentional → import/update config. If accidental → terraform apply to restore."}
  ]
},
{
  id: "terraform-2",

  title: "Terraform — Interview Experience 2 (Gap Topics)",
  date: "July 16, 2026",

  avgScore: "All Passed (Model Answers)",
  questions: [
    {num:1,q:"How to write reusable Terraform modules? Module composition, versioning, input validation, registry?",score:"Passed",scoreClass:"score-pass",a:"Structure: main.tf + variables.tf (with validation) + outputs.tf + versions.tf + README + examples/.\n\nVersioning: Pin in production (git ref=v2.1.0), semver for registry, ~> for patch acceptance.\n\nComposition: Root calls child modules, passing outputs between them (vpc.vpc_id → eks module).\n\nValidation: can(cidrhost()), contains(), regex on all variables.\n\nBest practices: One module = one logical unit, pin versions, document with examples, test with Terratest, publish to private registry."},
    {num:2,q:"Terraform in CI/CD safely? Plan/apply workflow, PR automation, Atlantis, cost estimation, policy checks?",score:"Passed",scoreClass:"score-pass",a:"Workflow: Branch → PR → auto plan → review → merge → auto apply.\n\nGitHub Actions: Plan on PR (comment output), apply on main merge. Separate IAM roles (plan=read, apply=write). Infracost for cost estimation. OPA/Conftest for policy checks.\n\nAtlantis: Self-hosted PR automation. Auto-plans on PR, apply via comment 'atlantis apply'. Locking prevents concurrent applies.\n\nSafety: Plan on PR (never auto-apply on PR), separate roles, lock state, cost estimation, policy-as-code, environment approval gates."},
    {num:3,q:"Import existing resources into Terraform? Refactor without destroying? moved blocks, terraform import?",score:"Passed",scoreClass:"score-pass",a:"terraform import: import <address> <id>. Write skeleton → import → plan (shows drift) → update code → plan clean.\n\nImport block (1.5+): Declarative import in code. terraform plan -generate-config-out=generated.tf auto-creates config.\n\nMoved blocks: Rename/reorganize without destroy. from=old_address, to=new_address. State updated, zero recreation.\n\nterraform state mv: Manual state surgery. Move between addresses or state files.\n\nterraform state rm: Remove from management without destroying (handoff between projects).\n\nRefactoring: Monolith→modules via moved blocks. Plan shows 0 changes (moved not recreated). Zero downtime."},
    {num:4,q:"Lifecycle meta-arguments (prevent_destroy, create_before_destroy, ignore_changes)? When to use provisioners?",score:"Passed",scoreClass:"score-pass",a:"prevent_destroy: Safety net for critical resources (RDS, S3). Terraform errors instead of destroying.\n\ncreate_before_destroy: Zero-downtime replacement. New created → switch → old destroyed. For: instances behind LB, certificates.\n\nignore_changes: Don't overwrite externally-managed values (ASG desired_capacity changed by autoscaler, ECS task_definition updated by CI/CD).\n\nreplace_triggered_by: Force replacement when dependency changes.\n\nProvisioners (last resort): Not declarative, not in state, not idempotent. Better: user_data, AMI baking (Packer), Ansible separately. Only OK for bootstrap (agent install on creation)."},
    {num:5,q:"Complex variable types, validation, locals vs variables, dynamic blocks — when to use each?",score:"Passed",scoreClass:"score-pass",a:"Complex types: object({...}), map(object({...})), list(object({...})). Use with for_each for multi-resource creation.\n\nValidation: contains(), can(regex()), can(cidrhost()) — fail early with clear messages.\n\nLocals vs variables: Variables = external input (users provide). Locals = internal computation (DRY, derived values). Users can't override locals.\n\nDynamic blocks: Generate repeated nested blocks from variable (security group rules, IAM statements). Use when variable number of blocks. Don't use for <3 static blocks (readability)."},
    {num:6,q:"Workspaces vs separate directories for managing environments? What's recommended?",score:"Passed",scoreClass:"score-pass",a:"Workspaces: Same code, different state key. Problems: easy to apply wrong env, no isolation, can't have different resources per env.\n\nSeparate directories (recommended): environments/{dev,staging,prod}/ each with own main.tf + backend.tf + tfvars. Own state, own account, clear context.\n\nTerragrunt: DRY + directory approach. Minimal terragrunt.hcl per env pointing to shared modules with env-specific inputs.\n\nRecommendation: 1-3 engineers=workspaces OK. 3-10=directories. 10+=Terragrunt or Terraform Cloud.\n\nProduction standard: Separate directories + separate AWS accounts + separate state files."},
    {num:7,q:"How to test Terraform code? validate, plan testing, Terratest, policy testing, native terraform test?",score:"Passed",scoreClass:"score-pass",a:"Pyramid: Static (validate, fmt, tflint, checkov) → Plan testing (plan JSON + OPA/conftest assertions) → Integration (Terratest — deploy real infra).\n\nStatic: terraform validate + fmt -check + tflint + checkov/tfsec. Every PR, fast.\n\nPlan testing: terraform plan → show -json → conftest/OPA policies (deny public S3, require encryption).\n\nTerratest (Go): InitAndApply → assert outputs → Destroy. Real infra test. Slow but thorough.\n\nNative (1.6+): .tftest.hcl files. run blocks with assert conditions. Built-in, no external tools.\n\nCI: static (every commit) → plan test (every PR) → integration (PR only, expensive)."},
    {num:8,q:"Data sources and dependencies? Implicit vs explicit depends_on? When is depends_on needed?",score:"Passed",scoreClass:"score-pass",a:"Data sources: Read existing resources NOT managed by this Terraform (existing VPC, latest AMI, remote state, caller identity, SSM parameter).\n\nImplicit dependency: Terraform detects via references (subnet uses vpc.id → VPC created first). Automatic, preferred.\n\nExplicit depends_on: When no reference exists but order matters (IAM policy must be attached before instance uses it). Required for provisioners, some IAM timing.\n\nWhen NOT: If reference exists (implicit sufficient). As 'just in case' (adds unnecessary serialization, slower apply)."},
    {num:9,q:"How to handle secrets in Terraform? Sensitive variables, state security, preventing secrets in plan?",score:"Passed",scoreClass:"score-pass",a:"Problem: State contains ALL values in plain text (including secrets).\n\nsensitive=true: Hides from plan/output. But still in state!\n\nDon't put secrets in tfvars: Use TF_VAR_ env vars, or data source (aws_ssm_parameter, aws_secretsmanager_secret_version) to read at runtime.\n\nState security: S3 backend with KMS encryption, versioning, block public access, IAM restrict read access, DynamoDB locking.\n\nCI/CD: Secrets from GitHub secrets → env vars, or better: let Terraform read from AWS at runtime (no secrets in CI at all).\n\nBest: External secret store (SSM/Secrets Manager) + data source. Secret exists in vault, Terraform reads at apply time, state is encrypted."},
    {num:10,q:"for_each vs count? Conditional resources? Common gotcha with for_each and dynamic data?",score:"Passed",scoreClass:"score-pass",a:"count: Numeric index. Remove middle item → all subsequent RECREATED (index shift). Bad for production.\n\nfor_each: Key-based. Remove one item → only that destroyed. Others untouched. Preferred.\n\nConditional: count = var.enabled ? 1 : 0. Or for_each with conditional map (only create in prod).\n\nGotcha: for_each can't use values unknown until apply (computed attributes). Must use values known at plan time (variables, data sources).\n\nfor expressions: Transform data (filter, map). locals { prod_services = {for k,v in var.services : k => v if v.env == 'prod'} }.\n\nRule: Use for_each for resources you might add/remove individually. count only for truly numeric scaling (3 identical instances)."}
  ]
},
