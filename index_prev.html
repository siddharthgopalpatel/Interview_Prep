    {num:1,q:"Tell me about CloudFront and where have you used it.",score:"Passed",scoreClass:"score-pass",a:"CDN — 400+ edge locations globally. Caches content close to users, reduces latency and origin load.\n\n• Origins — S3 (static assets), ALB (dynamic), API Gateway, custom HTTP\n• Cache behaviors — path-based: /static/* → S3 (long TTL), /api/* → ALB (no cache)\n• OAC (Origin Access Control) — only CloudFront can access S3, bucket stays private\n• Signed URLs/Cookies — restrict access to premium/private content\n• WAF integration — rate limiting, geo-blocking, SQL injection, XSS protection at edge\n• Shield Standard — free DDoS protection on all distributions\n• Origin failover — Origin Group with primary + secondary. 5xx → retries secondary automatically\n• Invalidation — aws cloudfront create-invalidation. Best practice: version filenames instead (app.v2.js)\n• HTTPS — free SSL via ACM, enforce HTTPS-only, TLS 1.2+\n• Real-time logs — stream access logs to Kinesis for analysis\n\nWhere used:\n• Fronting S3 static websites (React/Angular SPAs) — global low latency, S3 kept private via OAC\n• API acceleration — caching GET responses at edge, reducing origin hits by 60%+\n• WAF + CloudFront — blocking bad bots and rate limiting before traffic hits ALB"},
    {num:2,q:"What is the importance of subnets and security groups?",score:"Passed",scoreClass:"score-pass",a:"Subnets:\n• Logical partition of a VPC's IP range within a single AZ\n• Public subnet — has route to Internet Gateway. For ALB, NAT Gateway, bastion\n• Private subnet — no direct internet route. For app servers, EKS nodes, RDS. Outbound via NAT Gateway\n• Data subnet — isolated tier for RDS, ElastiCache. No outbound internet at all\n• Why important — network-level isolation. Defence in depth even if SG misconfigured\n• Route table — controls traffic leaving subnet. Public = 0.0.0.0/0 → IGW, Private = 0.0.0.0/0 → NAT GW\n\nSecurity Groups:\n• Virtual firewall at instance/ENI level\n• Stateful — allow inbound → response automatically allowed outbound\n• Allow-only — no explicit deny (use NACLs for deny)\n• Reference other SGs — ALB-SG allows 443 from internet → App-SG allows 8080 from ALB-SG only → DB-SG allows 5432 from App-SG only. Never open to 0.0.0.0/0\n• Least privilege — only required port, only required source\n\nSG vs NACL:\n• SG = instance level, stateful, allow only\n• NACL = subnet level, stateless (allow both directions), allow + deny. Use for broad IP blocking\n\nTogether: Subnet = which network tier. SG = which traffic allowed per resource. Both required for defence in depth."},
    {num:3,q:"What do you understand by VPN?",score:"Passed",scoreClass:"score-pass",a:"Encrypted tunnel over public internet between two networks — makes them behave as one private network.\n\nAWS Site-to-Site VPN:\n• Connects on-prem datacenter to AWS VPC via IPSec tunnel\n• Two tunnels per connection for HA\n• Components: Customer Gateway (on-prem router) + Virtual Private Gateway (AWS side) + IPSec tunnels\n• Bandwidth — up to 1.25 Gbps per tunnel. Aggregate with multiple tunnels via Transit Gateway\n• Latency — variable (over internet). Not suitable for latency-sensitive workloads\n• Encrypted by default — IPSec\n\nAWS Client VPN:\n• Remote users → AWS VPC. For engineers accessing private resources\n• OpenVPN-based, integrates with AD/SAML for auth\n\nVPN vs Direct Connect:\n• VPN — quick setup (minutes), cheap, encrypted, variable latency, over internet\n• Direct Connect — weeks setup, expensive, consistent low latency, dedicated fiber, NOT encrypted by default\n\nWhen used:\n• Quick secure connectivity to AWS (before DX is ready)\n• Backup path when Direct Connect fails\n• Dev/engineer access to private subnets\n• Multi-region connectivity via Transit Gateway + VPN\n\nBest practice: DX primary + VPN backup for production. VPN-only acceptable for non-latency-sensitive workloads."},
    {num:4,q:"If you have multiple VPNs, how do you establish interconnectivity between them?",score:"Passed",scoreClass:"score-pass",a:"Transit Gateway (TGW) — hub-and-spoke model. All VPCs and VPNs connect to one central hub. Any-to-any connectivity without mesh complexity.\n\n• Without TGW — need N×N peering (messy). 10 VPCs = 45 peering connections\n• With TGW — 10 VPCs = 10 attachments. Add new VPC = 1 attachment, instantly connected to all\n\nArchitecture:\n• On-prem sites → Site-to-Site VPN → TGW\n• Multiple VPCs → TGW attachments\n• TGW route tables control which networks can talk to each other\n\nTGW features:\n• Route tables — segment traffic (prod VPCs can't reach dev even on same TGW)\n• Multi-region — TGW peering across regions\n• ECMP — aggregate multiple VPN tunnels for higher throughput (multiple × 1.25 Gbps)\n• Centralized egress — all VPCs route outbound through shared NAT in one VPC\n\nOther options:\n• VPC Peering — direct, 1-to-1, non-transitive. Fine for 2-3 VPCs, doesn't scale\n• CloudWAN — global network manager for large enterprises, multi-region TGW orchestration\n• Direct Connect Gateway — connect DX to multiple VPCs across regions\n\nBest practice: Transit Gateway for anything beyond 3 VPCs/VPNs. Route table segmentation for isolation. ECMP for bandwidth."},
    {num:5,q:"EKS app in one VPC needs access to a resource in a different AWS account — access denied. Troubleshooting approach?",score:"Passed",scoreClass:"score-pass",a:"Request path: Pod → ServiceAccount → IRSA (IAM Role) → STS AssumeRole → Target Account Role → Resource\n\n1. Verify IRSA setup (source account):\n• Pod has correct SA annotation (eks.amazonaws.com/role-arn)\n• SA token mounted (kubectl exec — env | grep AWS)\n• Trust policy on source role includes OIDC provider with correct sub condition (namespace:sa-name)\n\n2. Check AssumeRole to target account:\n• Source role has sts:AssumeRole permission on target role ARN\n• Target role trust policy allows source role to assume it\n• Both sides must allow — source needs permission, target needs trust\n\n3. Check target role permissions:\n• Target role has actual resource permissions (S3 read, RDS connect)\n• Resource-based policy (S3 bucket policy, KMS key policy) allows target role\n\n4. Network connectivity:\n• VPC peering / Transit Gateway between VPCs? Route tables updated?\n• Security Groups allow traffic on required ports?\n• VPC endpoint policy allows cross-account access?\n• DNS resolves (Private Hosted Zone shared?)\n\n5. Common gotchas:\n• KMS — resource encrypted with CMK, key policy missing kms:Decrypt for target role\n• S3 — cross-account needs BOTH IAM permission AND bucket policy\n• OIDC issuer URL mismatch (trailing slash, http vs https)\n• Condition keys too restrictive (aws:SourceVpc, aws:SourceIp blocking)\n\nDebugging: kubectl exec pod -- aws sts get-caller-identity, CloudTrail in target account shows exact denial reason.\n\nKey principle: Cross-account = check BOTH sides (source permission + target trust). CloudTrail in target shows exact error."}
  ]
},

    {num:1,q:"Migrate legacy infrastructure to AWS for a bank. Approach for security, compliance, minimal disruption?",score:"Reference",scoreClass:"score-pass",a:"Discovery: AWS Application Discovery Service. Classify via 6 R's. Prioritize by criticality.\n\nSecurity: Landing Zone/Control Tower, multi-account (prod/staging/security/logging), SCPs, Config rules, CloudTrail, PCI-DSS/SOX, KMS encryption, TLS 1.2+.\n\nMigration (phased): Start non-critical → build confidence. DMS with replication for DBs. Route 53 weighted routing (10%→25%→50%→100%) with instant rollback.\n\nOrg: CCoE team, stakeholder checkpoints, risk register, rollback plans, staff training."},
    {num:2,q:"EC2 in critical ASG unresponsive. How to troubleshoot and restore?",score:"Reference",scoreClass:"score-pass",a:"Immediate: Check ASG activity (replacing?). Increase desired capacity +1 (30-sec fix, buys time).\n\nInvestigate: CloudWatch (CPU, memory, disk). Common: disk full, OOM, network issue.\n\nAccess: SSM Session Manager. Check dmesg, /var/log/messages, app logs. If unreachable: stop → detach volume → attach to healthy instance → examine.\n\nPost-incident: Health check interval, custom alarms (disk 80%), lifecycle hooks, correct instance type, bake monitoring into AMI."},
    {num:3,q:"Cost optimization strategies for banking AWS environment?",score:"Reference",scoreClass:"score-pass",a:"Visibility: Tagging (team, env, project), Cost Explorer, Budgets. Just awareness = 15% reduction.\n\nCompute: Rightsizing (Compute Optimizer), Savings Plans (30-60%), dev/test auto-shutdown (65%), Spot for CI/CD/batch (70-80%).\n\nStorage: S3 lifecycle (Standard→IA→Glacier), cleanup (unattached EBS, old snapshots, unused EIPs).\n\nArchitecture: Lambda/Fargate for variable, Aurora Serverless (scales to zero).\n\nGovernance: Monthly cost reviews, make cost an engineering concern, FinOps practice."},
    {num:4,q:"Design DR for critical banking applications. Resilient and cost-effective?",score:"Reference",scoreClass:"score-pass",a:"Tier by RTO/RPO:\n\nTier 1 (critical, minutes): Multi-Site Active-Active, 2 regions, Aurora Global DB (<1s replication), Route 53 failover.\n\nTier 2 (important, hours): Warm Standby, scaled-down DR region, RDS cross-region replica, ready to scale up.\n\nTier 3 (non-critical, days): Pilot Light, minimal (DB only), IaC can spin up rest on demand.\n\nCross-cutting: S3 CRR, quarterly DR drills, automated runbooks, Route 53 health checks.\n\nCost: Don't apply Tier 1 to everything. Active-Active=2x, Pilot Light=10-15% extra."}
  ]

{
  id: "aws-2",
  category: "aws",
  title: "AWS — Interview Experience 2 (Gap Topics)",
  date: "July 16, 2026",
  targetRole: "Staff/Principal DevOps Engineer",
  avgScore: "All Passed (Model Answers)",
  questions: [
    {num:1,q:"Design production VPC. Public/private subnets, NAT Gateway, VPC Endpoints, Transit Gateway. Security Groups vs NACLs?",score:"Passed",scoreClass:"score-pass",a:"3-tier VPC: Public (ALB, NAT GW), Private (app/EKS), Data (RDS/ElastiCache). /16 CIDR, 3 AZs minimum.\n\nNAT GW: Private→internet (outbound only). One per AZ for HA.\n\nVPC Endpoints: Gateway (S3, DynamoDB — free) + Interface (ECR, Secrets Manager — avoid internet path, save cost).\n\nTransit Gateway: Hub-and-spoke for multi-VPC. Replaces messy N×N peering.\n\nSG vs NACL: SG=instance-level, stateful, allow-only. NACL=subnet-level, stateless, allow+deny, ordered rules.\n\nBest practices: /16 CIDR, 3 AZs, separate tiers, NAT per AZ, VPC endpoints for all AWS services, SSM instead of bastion, flow logs enabled."},
    {num:2,q:"Design IAM for 20 AWS accounts. SCPs, Permission Boundaries, cross-account access, OIDC federation for CI/CD?",score:"Passed",scoreClass:"score-pass",a:"Organizations structure: Management (billing only) → Security OU → Infrastructure OU → Production OU → Non-Prod OU → Sandbox OU.\n\nSCPs (guardrails can't be overridden): Deny disable CloudTrail, deny leave org, require IMDSv2, restrict regions, deny public S3.\n\nPermission Boundaries: Limit what delegated admins can create. Even with AdministratorAccess, boundary restricts.\n\nCross-account: Trust policy on target role → source account/role can AssumeRole.\n\nOIDC (CI/CD): GitHub Actions → assume role via web identity. No access keys, short-lived, scoped to repo+branch, auditable.\n\nBest practices: No root usage, federate via Identity Center, no long-lived keys, least privilege via Access Analyzer, quarterly reviews."},
    {num:3,q:"EKS vs ECS vs Fargate? Design container architecture for microservices on AWS.",score:"Passed",scoreClass:"score-pass",a:"EKS: K8s, multi-cloud portable, rich ecosystem (Helm/ArgoCD/Prometheus), complex, $73/mo control plane. Best: 50+ services, K8s expertise, need portability.\n\nECS: AWS-native, simpler, free control plane, tight AWS integration. Best: <20 services, AWS-only, smaller team.\n\nFargate: Serverless compute (for EKS or ECS). No node management. Best: batch, burst, isolation, per-pod pricing.\n\nProduction: Managed node groups (on-demand) for core + Spot for non-critical + Fargate for batch. VPC endpoints for ECR/S3/STS. Private subnets only. IRSA for pod-level IAM."},
    {num:4,q:"ALB vs NLB. Target groups, health checks, WAF integration. Design for microservices.",score:"Passed",scoreClass:"score-pass",a:"ALB: L7 (HTTP), path/host/header routing, WAF integration, ~100K req/s. Best for web apps, APIs, microservices.\n\nNLB: L4 (TCP/UDP), static IPs, millions req/s, ultra-low latency. Best for gRPC, gaming, IoT, TCP services, PrivateLink.\n\nMicroservices pattern: ALB with path-based routing → /api/payments/* → payment-tg, /api/orders/* → order-tg.\n\nHealth checks: /health endpoint, 2 healthy/3 unhealthy threshold, 15s interval, 30s deregistration delay.\n\nWAF on ALB: Rate limiting, SQL injection, XSS, geo-blocking, IP reputation.\n\nSticky sessions: Only for stateful legacy apps. Stateless microservices don't need."},
    {num:5,q:"How to secure AWS environment? GuardDuty, Security Hub, Config, WAF, KMS — how they work together?",score:"Passed",scoreClass:"score-pass",a:"Detection: GuardDuty (ML threat detection — compromised instances, unusual API, C2). No agent needed.\n\nAggregation: Security Hub (single pane — all findings from GuardDuty+Inspector+Config. Compliance scoring: CIS, PCI-DSS).\n\nCompliance: Config (resource state, rules: S3 encrypted? SG no 0.0.0.0/0? Auto-remediate via SSM).\n\nPrevention: WAF (on ALB/CloudFront — rate limit, SQL injection, XSS). Shield (DDoS).\n\nEncryption: KMS (CMK, envelope encryption, key policies, auto-rotation). Secrets Manager (auto-rotation with Lambda).\n\nAudit: CloudTrail (every API call, org-wide, immutable in log archive).\n\nAutomation: GuardDuty finding → EventBridge → Lambda (isolate instance, notify, create ticket). All automated."},
    {num:6,q:"Monitoring on AWS? CloudWatch metrics, alarms, Log Insights, Container Insights, alerting strategy?",score:"Passed",scoreClass:"score-pass",a:"Components: Metrics (time-series), Logs (storage+query), Alarms (thresholds), Log Insights (SQL-like queries), Container Insights (EKS/ECS), Synthetics (canary tests).\n\nCustom metrics: PutMetricData from app code (OrdersProcessed, QueueDepth).\n\nAlarms: Threshold-based → SNS → PagerDuty/Lambda. Composite alarms: page only when BOTH cpu AND latency high (reduces noise).\n\nLog Insights: Find slowest requests, error counts by service, P99 latency over time.\n\nContainer Insights: Auto-collects pod/node metrics for EKS. Pre-built dashboards.\n\nStrategy: P1=page (error>5%, service down), P2=Slack (CPU>70%), P3=digest (cost anomaly, cert expiring).\n\nCW + Prometheus: CW for AWS services (RDS, ALB). Prometheus for K8s workloads. Use both."},
    {num:7,q:"Lambda vs containers? Event-driven architecture, API Gateway, Step Functions, cold starts, concurrency?",score:"Passed",scoreClass:"score-pass",a:"Lambda: max 15min, 10GB RAM, instant scaling, cold starts, pay-per-invocation. Best: events, short tasks, glue, variable traffic.\n\nContainers: unlimited time, stateful, cheaper at steady high load. Best: long-running, complex apps.\n\nEvent patterns: S3→Lambda→DynamoDB, SQS→Lambda (batch), API GW→Lambda→response, EventBridge→Lambda.\n\nStep Functions: Orchestrate multiple Lambdas with retry, catch, parallel branches. Visual workflow.\n\nCold starts: Provisioned concurrency (warm N instances), smaller packages, Python/Node (fast) vs Java (slow), SnapStart (Java).\n\nConcurrency: 1000 default/region. Reserved concurrency for critical functions. Throttled = 429."},
    {num:8,q:"S3 security, lifecycle policies, replication, event notifications, encryption. How to secure a bucket?",score:"Passed",scoreClass:"score-pass",a:"Security layers: Block Public Access (first!) → Bucket Policy → IAM Policy → VPC Endpoint Policy.\n\nBucket policy: Deny unencrypted uploads, deny non-SSL, restrict to VPC endpoint.\n\nLifecycle: Standard (30d) → IA (90d) → Glacier IR (365d) → Deep Archive → Expire. Saves 80%+ on old data.\n\nReplication (CRR): Cross-region for DR/compliance. Requires versioning. Cross-account for log aggregation.\n\nEvent notifications: ObjectCreated → Lambda (process), SQS (queue), SNS (notify). Filter by prefix/suffix.\n\nEncryption: SSE-S3 (simple), SSE-KMS (audit/compliance, CMK), SSE-C (you manage key). Production: SSE-KMS with CMK.\n\nVersioning: Enable for audit trail + accidental delete protection."},
    {num:9,q:"Manage 20+ AWS accounts? Organizations, Control Tower, Landing Zone, cross-account CI/CD?",score:"Passed",scoreClass:"score-pass",a:"Why multi-account: Blast radius, security isolation, billing clarity, compliance, service limits.\n\nStructure: Management → Security OU (tooling + log archive) → Infrastructure OU (network + shared) → Workloads OU (prod + non-prod) → Sandbox OU.\n\nControl Tower: Automated landing zone, guardrails (preventive SCPs + detective Config rules), Account Factory (self-service provisioning), compliance dashboard.\n\nSCPs by OU: Root=deny leave org. Prod=restrict regions, require encryption. Sandbox=deny expensive services, budget limit.\n\nCross-account CI/CD: Shared-Services account runs pipeline → assumes deploy role in target account (OIDC, no keys).\n\nAccount vending: Request → Account Factory → baseline applied (CloudTrail, Config, GuardDuty, VPC, IAM) → SSO access. <30 min automated."},
    {num:10,q:"RDS Multi-AZ vs Read Replicas? Aurora vs RDS? Failover, backup, performance optimization?",score:"Passed",scoreClass:"score-pass",a:"Multi-AZ: HA (sync replication, auto-failover 60-120s). Standby not readable.\nRead Replicas: Scale reads (async, manual promote). Readable. Cross-region possible.\n\nAurora vs RDS: Aurora 3-5x faster, auto-scaling storage (10GB→128TB), 15 replicas (<10ms lag), <30s failover, 6 copies across 3 AZs. Aurora Serverless v2 for variable workloads.\n\nFailover: Writer endpoint (CNAME) flips to new primary (5s DNS). App retries on connection drop. RDS Proxy handles transparently (connection pooling + failover pinning).\n\nBackup: Automated (1-35 days retention, 5-min RPO). Manual snapshots (cross-region for DR). Aurora Backtrack (rewind up to 72h without restore!).\n\nPerformance: Performance Insights (top SQL by wait), slow query log, RDS Proxy (connection pooling), read/write splitting (writer vs reader endpoint), right-size instance, reserved instances."}
  ]
},

  id: "aws-3",
  category: "aws",
  title: "AWS — Interview Experience 3 (Remaining Gaps)",
  date: "July 16, 2026",
  targetRole: "Staff/Principal DevOps Engineer",
  avgScore: "All Passed (Model Answers)",
  questions: [
    {num:1,q:"Route53 routing policies? DNS failover, blue-green, weighted routing? Alias vs CNAME?",score:"Passed",scoreClass:"score-pass",a:"Policies: Simple (1 resource), Weighted (A/B testing 90/10), Latency (nearest region), Failover (active-passive DR), Geolocation (by country), Multivalue (multiple healthy IPs).\n\nFailover: Primary record + health check. If fails 3 times → returns secondary. TTL 60s for fast switch.\n\nWeighted (blue-green): 90/10 → 80/20 → 50/50 → 0/100 (gradual shift).\n\nAlias vs CNAME: Alias works at zone apex (example.com), free queries, returns IPs directly. CNAME can't be apex, costs money, extra DNS hop. Always use Alias for AWS resources.\n\nPrivate Hosted Zones: Internal DNS within VPC (service discovery)."},
    {num:2,q:"CloudFront — when/why? Edge locations, cache behaviors, origin failover, security?",score:"Passed",scoreClass:"score-pass",a:"CDN: 400+ edge locations globally. Reduces latency (nearest edge), reduces origin load (cached), DDoS protection (Shield free).\n\nCache behaviors (path-based): /api/* → ALB (no cache), /static/* → S3 (24h TTL), /images/* → S3 (7d TTL).\n\nOrigin failover: Origin Group (primary ALB + secondary ALB). 5xx from primary → retry secondary.\n\nInvalidation: Version assets in filenames (best) or aws cloudfront create-invalidation --paths.\n\nSecurity: OAC (only CloudFront accesses S3), signed URLs/cookies (premium content), WAF at edge (rate limit, geo-block, bot protection).\n\nPattern: Static → S3 origin (heavy cache) + Dynamic → ALB origin (no/short cache). Same domain via behaviors."},
    {num:3,q:"SNS vs SQS? Fan-out pattern, DLQ, FIFO vs Standard. Design event-driven architecture?",score:"Passed",scoreClass:"score-pass",a:"SNS: Pub/Sub (1-to-many), push, no persistence. SQS: Queue (1-to-1), pull, persistent until consumed.\n\nFan-out: Order → SNS topic → SQS:payment + SQS:inventory + SQS:email + Lambda:analytics. Each processes independently.\n\nStandard vs FIFO: Standard=unlimited throughput, at-least-once, best-effort order. FIFO=3000/s, exactly-once, strict order.\n\nDLQ: After maxReceiveCount failures (3) → message moves to DLQ. Alert on DLQ messages. Investigate + replay after fix.\n\nBest practices: Visibility timeout > processing time, always have DLQ, long polling (WaitTimeSeconds:20), batch operations, idempotent consumers."},
    {num:4,q:"DynamoDB vs RDS? Partition keys, capacity modes, GSI/LSI, Streams, TTL, backup?",score:"Passed",scoreClass:"score-pass",a:"DynamoDB: NoSQL, flexible schema, infinite horizontal scale, single-digit ms at any scale, zero ops. Use: sessions, IoT, gaming, simple access patterns.\n\nRDS: Relational, SQL, complex joins, ACID transactions. Use: complex queries, reporting, relationships.\n\nPartition Key: Must distribute evenly. Good=user_id (millions). Bad=status (hot partition).\nSort Key: Range queries within partition.\n\nCapacity: On-Demand (pay per request, unpredictable) vs Provisioned (set RCU/WCU, predictable, cheaper).\n\nGSI: Query by different attribute (anytime). LSI: Same PK different SK (table creation only).\n\nStreams: Table change → Lambda (event-driven). TTL: Auto-delete expired items (free). Global Tables: Multi-region active-active.\n\nDAX: In-memory cache (microsecond reads), read-through, no code changes."},
    {num:5,q:"Design CI/CD on AWS. CodePipeline/CodeBuild/CodeDeploy vs GitHub Actions. Blue-green with CodeDeploy?",score:"Passed",scoreClass:"score-pass",a:"AWS native: CodeCommit/GitHub → CodePipeline (orchestrator) → CodeBuild (build) → CodeDeploy (deploy).\n\nvs GitHub Actions: More flexible, multi-cloud, OIDC for AWS auth. AWS native = tighter integration.\n\nCodeBuild: buildspec.yml (pre_build: ECR login, build: docker build+push, post_build: write imagedefinitions).\n\nCodeDeploy Blue-Green (ECS): New task def → green TG → test traffic → hook validates → shift prod traffic → keep blue for rollback window → terminate blue.\n\nTraffic: AllAtOnce, Linear10Percent, Canary10Percent5Minutes.\n\nRollback: Instant — shift traffic back to blue (still running).\n\nRecommendation: All-AWS simple → CodePipeline. GitHub multi-cloud → Actions+OIDC. K8s → Actions+ArgoCD."},
    {num:6,q:"Connect on-prem to AWS? Direct Connect vs VPN? PrivateLink? When to use each?",score:"Passed",scoreClass:"score-pass",a:"VPN: IPSec over internet, 1.25Gbps, variable latency, encrypted, minutes setup, cheap. Good: quick connectivity, backup.\n\nDirect Connect: Physical fiber, 1-100Gbps, consistent low latency, NOT encrypted by default, weeks setup, expensive. Good: high bandwidth, consistent latency, compliance.\n\nDX HA: 2 connections at different locations + VPN backup.\n\nPrivateLink: Expose service privately across VPCs without peering. Provider (NLB) → PrivateLink → Consumer (VPC Endpoint). Traffic on AWS backbone. No routing changes. Per-service granularity.\n\nVPC Endpoints: Gateway (S3/DynamoDB, free) + Interface (other services, PrivateLink underneath).\n\nWhen: Quick → VPN. High bandwidth → DX. Private service exposure → PrivateLink. AWS services privately → VPC Endpoints."},
    {num:7,q:"Auto Scaling strategies — target tracking, step, predictive, scheduled? Mixed instances? Cooldown?",score:"Passed",scoreClass:"score-pass",a:"Target tracking: 'Keep CPU at 60%' (simplest, recommended). Auto-adjusts.\n\nStep: Graduated response (CPU 60-70% add 1, 70-80% add 2, >80% add 4). Good for spiky.\n\nPredictive: ML analyzes 14 days history → pre-scales. Good for regular patterns.\n\nScheduled: Cron-based (scale up 8AM, down 8PM). Known events.\n\nMixed instances: On-demand base (2) + 25% on-demand + 75% spot. Diversified types for spot availability. capacity-optimized strategy.\n\nHealth checks: ELB health (recommended over EC2). Grace period 300s (don't kill during startup).\n\nCooldown: 300s default. Prevents thrashing after scaling action.\n\nPattern: Predictive (pre-scale) + target tracking (fine-tune) + step (handle spikes)."},
    {num:8,q:"Troubleshoot: (1) App can't reach RDS (2) Lambda timing out (3) S3 access denied despite correct IAM?",score:"Passed",scoreClass:"score-pass",a:"RDS unreachable: 1) SG (app→RDS port allowed?) 2) Subnet routing (same VPC? peering?) 3) RDS status (available? failover?) 4) DNS (cached after failover?) 5) Connection limit (max_connections?) 6) Credentials rotated?\n\nLambda timeout: 1) Timeout config too low (default 3s) 2) VPC Lambda without NAT GW (can't reach internet!) — #1 cause 3) Cold start > timeout (increase/provisioned concurrency) 4) Downstream slow (DB/API) 5) Recursive invocation (infinite loop) 6) Low memory = low CPU (increase memory).\n\nS3 denied: Check ALL layers — Block Public Access AND Bucket Policy AND IAM AND VPC Endpoint Policy AND KMS key policy. Common: bucket denies non-VPC access, KMS decrypt permission missing, cross-account needs BOTH sides to allow, resource ARN mismatch (bucket vs bucket/*). Debug: IAM Policy Simulator, CloudTrail for exact denial."},
    {num:9,q:"ElastiCache — Redis vs Memcached? Caching patterns, cluster mode, failover? Prevent cache stampede?",score:"Passed",scoreClass:"score-pass",a:"Redis (use 95% of time): Data structures, persistence, replication, cluster mode, pub/sub. Memcached: Simple key-value, multi-threaded, no persistence.\n\nPatterns: Cache-Aside (lazy — check cache, miss→DB→cache), Write-Through (write both), Write-Behind (cache→async DB).\n\nCluster disabled: 1 primary + replicas (all data one shard, <100GB). Cluster enabled: Multiple shards (horizontal scale writes, >100GB).\n\nFailover: Primary fails → replica promoted (seconds). Multi-AZ for AZ survival. Use cluster endpoint.\n\nCache stampede: TTL expires → 1000 requests hit DB simultaneously. Solutions: Staggered TTL (jitter), lock-based refresh (first acquires lock), early refresh (before expiry), background refresh (never expire).\n\nMonitor: Evictions (cache too small), CacheMisses, ReplicationLag."},
    {num:10,q:"AWS Well-Architected Framework pillars? How to use in practice? Architecture review example?",score:"Passed",scoreClass:"score-pass",a:"6 Pillars: Operational Excellence (automate, IaC, CI/CD), Security (least privilege, encryption, detection), Reliability (multi-AZ, DR, scaling), Performance (right-size, cache, CDN), Cost (spot, reservations, lifecycle), Sustainability (efficient resources).\n\nPractice: Architecture review before building — check each pillar. AWS Well-Architected Tool (console) — answer questions, get recommendations, track risks quarterly.\n\nDecision example: ALB+EC2 vs API GW+Lambda for new API:\n- OpEx: Lambda wins (zero server mgmt)\n- Reliability: Depends (cold starts vs always-warm)\n- Performance: EC2 for latency-sensitive, Lambda for burst\n- Cost: Lambda if <5M req/month, EC2 if steady high traffic\n\nDocument in ADR (Architecture Decision Record): context, decision, rationale, consequences."}
  ]
},

  questions: [
    {num:1,q:"What is the purpose of Prometheus and Grafana in a monitoring system?",score:"Passed",scoreClass:"score-pass",a:"Prometheus:\n• Time-series database — scrapes and stores metrics with timestamps\n• Pull-based — scrapes /metrics endpoints on defined intervals\n• PromQL — query language to aggregate, filter, calculate metrics\n• Alertmanager — routes alerts to PagerDuty, Slack, email based on rules\n• Service discovery — auto-discovers targets via K8s API, EC2 tags, Consul\n• Exporters — node_exporter (OS metrics), kube-state-metrics (K8s objects), blackbox_exporter (endpoint probing)\n• ServiceMonitor (K8s) — CRD that auto-configures Prometheus scraping by label selector\n\nGrafana:\n• Visualization layer — dashboards on top of Prometheus and other datasources\n• Datasources — Prometheus, Loki, Tempo, CloudWatch, Elasticsearch — all in one UI\n• Alerting — Grafana-managed alerts with notification policies\n• Explore — ad-hoc metric/log/trace queries without building dashboards\n• Provisioning — dashboards and datasources as code (GitOps-friendly)\n\nHow they work together:\n• Prometheus collects + stores + alerts\n• Grafana queries Prometheus via PromQL and visualizes\n• Loki (logs) + Tempo (traces) + Prometheus (metrics) = full observability stack in Grafana\n\nKey metrics: RED (Rate, Errors, Duration) for services. USE (Utilization, Saturation, Errors) for infrastructure."},
    {num:2,q:"What is the difference between metrics and traces?",score:"Passed",scoreClass:"score-pass",a:"Metrics:\n• Numeric aggregates over time — CPU %, request rate, error count, latency p99\n• Low cardinality — cheap to store, query fast\n• Tell you WHAT is wrong — 'error rate spiked at 3AM'\n• Tools — Prometheus, CloudWatch, Datadog\n• Retention — long-term (months/years), aggregated over time\n\nTraces:\n• Record of a single request as it travels across multiple services\n• Distributed tracing — shows every hop (service A → B → DB → cache) with timing per span\n• Tell you WHERE and WHY — 'request took 2s because DB query in service B took 1.8s'\n• High cardinality — one trace per request, expensive to store all\n• Tools — Jaeger, Tempo, AWS X-Ray, Zipkin\n• Sampling — typically sample 1-10% of traces (head/tail sampling)\n\n3 Pillars of Observability:\n• Metrics — aggregate numbers (what/when)\n• Traces — request journey (where/why)\n• Logs — detailed events (exact what happened)\n\nPractical flow: Alert fires (metrics) → find affected requests (traces) → read detailed errors (logs)\n\nOpenTelemetry — vendor-neutral standard to instrument all three from same codebase."},
    {num:3,q:"What are the components of a trace?",score:"Passed",scoreClass:"score-pass",a:"• Trace — end-to-end record of a single request across all services. Identified by unique Trace ID\n• Span — single unit of work within a trace (one service call, one DB query, one cache lookup). Building block of a trace\n\nSpan attributes:\n• Span ID — unique ID for that span\n• Parent Span ID — links child to parent, forms the tree\n• Operation name — what it did (HTTP GET /orders, SELECT * FROM orders)\n• Start time + Duration — when it started, how long it took\n• Status — OK, Error, Unset\n• Attributes/Tags — key-value metadata (http.method, db.type, user.id)\n• Events — timestamped logs within a span (cache miss at t+12ms)\n• Links — connect spans across async boundaries (queue producer → consumer)\n\nContext propagation — Trace ID + Span ID passed between services via HTTP headers (traceparent in W3C standard, X-B3-TraceId in Zipkin). Stitches spans into one trace.\n\nTrace tree — root span (entry point) → child spans (downstream calls) → leaf spans (DB, cache, external API)\n\nExample:\nTrace: abc123\n├── [0ms]  API Gateway       → 250ms (root span)\n├── [5ms]  OrderService      → 200ms\n│   ├── [10ms] DB query      → 180ms ← bottleneck\n│   └── [195ms] Cache lookup → 2ms\n└── [210ms] NotificationSvc  → 35ms"},
    {num:4,q:"What are the different types of metrics that you have captured?",score:"Passed",scoreClass:"score-pass",a:"By instrumentation type (Prometheus):\n• Counter — monotonically increasing, never decreases. http_requests_total, errors_total. Use rate() for per-second rate\n• Gauge — goes up and down. cpu_usage, memory_used, active_connections, queue_depth\n• Histogram — samples into buckets, calculates percentiles. http_request_duration_seconds. Use for latency p50/p95/p99\n• Summary — calculates quantiles client-side. Less flexible than histogram for cross-instance aggregation\n\nBy domain:\n\nInfrastructure:\n• CPU utilization, memory usage, disk I/O, network throughput, node availability\n\nKubernetes:\n• Pod restarts, pending pods, OOMKilled count, HPA scaling events, PVC usage, node pressure\n\nApplication (RED method):\n• Rate — requests per second\n• Errors — error rate, error count by type\n• Duration — latency p50/p95/p99\n\nInfrastructure (USE method):\n• Utilization — % resource used\n• Saturation — queue depth, wait time\n• Errors — error rate at resource level\n\nBusiness:\n• Orders per minute, payment success rate, active users, checkout conversion rate\n\nKey principle: RED for services, USE for infrastructure, business metrics for SLOs."},
    {num:5,q:"Define SLI, SLO, and SLA.",score:"Passed",scoreClass:"score-pass",a:"SLI (Service Level Indicator):\n• Actual measurement of service performance — a metric\n• Examples: request latency (p99), error rate, availability (% successful requests), throughput\n• Formula: good events / total events × 100\n• 'Our API responded under 200ms for 99.2% of requests last month'\n\nSLO (Service Level Objective):\n• Internal target for an SLI — what you aim for\n• Set by engineering team based on user expectations\n• Example: '99.9% of requests must complete under 200ms' or 'availability ≥ 99.95%'\n• Error budget = 100% - SLO (e.g., 99.9% SLO = 0.1% = ~43 min/month allowed downtime)\n• If error budget exhausted → freeze deployments, focus on reliability\n\nSLA (Service Level Agreement):\n• External legal/business contract with customers\n• Always looser than SLO (buffer) — SLO 99.95%, SLA 99.9%\n• Breach = financial penalty (credits, refund)\n• Example: 'AWS guarantees 99.99% uptime for S3. Below that = service credits'\n\nRelationship: SLI (what you measure) → SLO (what you target internally) → SLA (what you promise externally)\n\nKey principle: SLO tighter than SLA — gives breathing room. Burn error budget = fix reliability. Never breach SLA."},
    {num:6,q:"What metrics are you monitoring with Prometheus and Grafana, and did you configure them yourself?",score:"Passed",scoreClass:"score-pass",a:"Yes, configured the full stack myself:\n• Deployed via kube-prometheus-stack Helm chart (Prometheus Operator, Alertmanager, Grafana, node-exporter, kube-state-metrics)\n• Custom ServiceMonitors for application metrics\n• Grafana dashboards provisioned as code (JSON/YAML in Git)\n• AlertManager routing: PagerDuty (P1), Slack (P2), email (P3)\n\nMetrics monitored:\n\nInfrastructure (USE method):\n• CPU utilization, memory usage, disk I/O, network throughput per node\n• Node conditions (pressure, NotReady)\n• Kubelet health, API server latency\n\nKubernetes:\n• Pod restarts, pending pods, OOMKilled, CrashLoopBackOff count\n• HPA current vs desired replicas\n• PVC usage %, node allocatable vs requested\n• Deployment rollout status\n\nApplication (RED method):\n• Request rate (http_requests_total)\n• Error rate (http_requests_total{status=~'5..'})\n• Duration/latency P50, P95, P99 (http_request_duration_seconds)\n• Custom business metrics (orders/min, payment success rate, queue depth)\n\nCI/CD:\n• Build duration, success/failure rate, queue wait time\n• Deployment frequency, rollback count\n\nAlerting strategy:\n• P1 (page): error rate >5%, service down, node NotReady >5min\n• P2 (Slack): CPU >70% sustained, latency P99 >2s, disk >80%\n• P3 (ticket): cert expiring <14d, pod restarts >5/hr, cost anomaly\n\nKey principle: RED for services, USE for infra, business metrics for SLOs. Alert on symptoms (user impact), not causes. Dashboard per team/namespace."}
  ]

    {num:1,q:"Tell me about some of the cost optimization strategies that you have used.",score:"Passed",scoreClass:"score-pass",a:"Compute:\n• Rightsizing — AWS Compute Optimizer recommendations. Downsized over-provisioned instances (30-40% savings)\n• Savings Plans/Reserved Instances — 1-year commit for stable workloads (30-60% savings)\n• Spot instances — CI/CD agents, batch jobs, non-critical workloads (70-80% savings)\n• Dev/test shutdown — Lambda scheduler, stop non-prod evenings/weekends (65% savings)\n• Graviton (ARM) — 20% cheaper, better performance\n\nKubernetes:\n• Karpenter — right-sizes nodes, bin-packs pods, terminates underutilized nodes\n• Spot for non-critical + on-demand for stateful/critical\n• Resource requests/limits tuned with VPA recommendations\n• Kubecost — per-team/namespace cost visibility and chargeback\n\nStorage:\n• S3 lifecycle — Standard → IA (30d) → Glacier (90d) → Deep Archive (365d). 80% savings on old data\n• Cleanup scripts — unattached EBS, old snapshots, unused EIPs (monthly cron)\n• GP3 over GP2 — 20% cheaper, better baseline performance\n\nArchitecture:\n• Lambda/Fargate for variable workloads — pay per use, zero idle cost\n• Aurora Serverless v2 — scales to near-zero for dev/staging DBs\n• CloudFront caching — reduced origin requests by 60%\n\nGovernance:\n• Mandatory tagging (team, env, project) — enforced via SCP\n• AWS Budgets with alerts at 80%/100%\n• Monthly cost reviews per team — cost as engineering responsibility\n• FinOps dashboard — Cost Explorer + CUR reports in Grafana"},
    {num:2,q:"What are the different cost optimization strategies that you can use?",score:"Passed",scoreClass:"score-pass",a:"1. Right-size:\n• Match resource to actual usage — measure, don't guess\n• Tools: Compute Optimizer, Kubecost, CloudWatch, VPA recommendations\n• Review quarterly — workloads change over time\n\n2. Purchase models:\n• On-demand (default, expensive), Savings Plans (1-3yr, 30-60%), Reserved (specific instance), Spot (70-90%, interruptible)\n• Strategy: Savings Plans for baseline, Spot for burst/fault-tolerant, On-demand for remainder\n\n3. Scheduling:\n• Stop non-prod evenings/weekends (65% savings)\n• Scale-to-zero dev environments (Fargate, Aurora Serverless, KEDA)\n\n4. Architecture optimization:\n• Serverless for variable (Lambda, Fargate) — zero idle cost\n• Caching (CloudFront, ElastiCache) — reduce compute/DB load\n• Async processing (SQS + Lambda) — smooth spikes, avoid over-provisioning\n• Multi-tier storage (S3 lifecycle, EBS GP3, EFS IA)\n\n5. Waste elimination:\n• Idle resources — unattached EBS, unused EIPs, orphan snapshots, stopped instances with attached storage\n• Overprovisioned — DB too large, oversized NAT Gateways\n• Tools: AWS Trusted Advisor, Cost Anomaly Detection\n\n6. Governance:\n• Tagging enforcement (SCP/Config rules) — no tag = no deploy\n• Budgets + alerts per team/project\n• Chargeback/showback — teams own their spend\n• FinOps culture — cost in sprint retros\n\n7. Data transfer:\n• VPC endpoints (avoid NAT Gateway charges for AWS API calls)\n• Same-AZ where possible (cross-AZ = $0.01/GB)\n• CloudFront for egress-heavy workloads (cheaper than direct)"}
  ]
},
{
  id: "serverless-1",
  category: "serverless",
  title: "Serverless — Session 1",
  date: "July 17, 2026",
  targetRole: "Staff/Principal DevOps Engineer (12 YOE)",
  avgScore: "All Passed (Model Answers)",
  questions: [
    {num:1,q:"What is serverless?",score:"Passed",scoreClass:"score-pass",a:"Execution model where cloud provider manages servers, scaling, patching. You only write code/config, pay per execution — zero idle cost.\n\n• No server management — no provisioning, no OS patching, no capacity planning\n• Auto-scales — from zero to thousands of concurrent executions automatically\n• Pay per use — billed per request + duration. No traffic = $0\n\nAWS Serverless services:\n• Lambda — event-driven functions (max 15min, 10GB RAM)\n• Fargate — serverless containers (ECS/EKS without managing nodes)\n• API Gateway — serverless HTTP/REST/WebSocket endpoints\n• DynamoDB — serverless NoSQL (on-demand mode)\n• Aurora Serverless — serverless relational DB (scales to near-zero)\n• S3 — serverless object storage\n• SQS/SNS/EventBridge — serverless messaging/eventing\n• Step Functions — serverless workflow orchestration\n\nWhen to use:\n• Variable/unpredictable traffic\n• Event-driven workloads (S3 upload → process, API call → respond)\n• Short-lived tasks (<15min)\n• Startups/MVPs — zero upfront cost\n\nWhen NOT to use:\n• Long-running processes (>15min)\n• Consistent high-throughput (EC2/containers cheaper at steady state)\n• GPU/specialized hardware\n• Cold start sensitive (sub-10ms latency requirements)\n\nTrade-offs: Less control, vendor lock-in, cold starts, debugging harder, 15min timeout, stateless."},
    {num:2,q:"Under what circumstances would you use Lambda and not use functions in EC2?",score:"Passed",scoreClass:"score-pass",a:"Use Lambda when:\n• Event-driven (S3 upload, API call, SQS message, CloudWatch event, DynamoDB stream)\n• Short execution (<15min)\n• Sporadic/unpredictable traffic — pay nothing when idle\n• Glue logic — connect AWS services together\n• Cron jobs (scheduled tasks via EventBridge)\n• Auto-scaling needed instantly (0 to 1000 concurrent in seconds)\n• No infra management desired — focus on code only\n\nUse EC2 when:\n• Long-running processes (>15min)\n• Consistent high-throughput — cheaper at steady state\n• Stateful applications — in-memory state, persistent connections (WebSockets)\n• GPU/custom hardware required\n• Sub-millisecond latency (no cold start tolerance)\n• Large binary/runtime dependencies (>10GB)\n• Full OS control needed (specific kernel tuning, custom networking)\n• Compliance requiring dedicated hosts\n\nCost crossover point:\n• Low/variable traffic → Lambda cheaper (no idle cost)\n• ~1M+ requests/day sustained → EC2/Fargate becomes cheaper\n• Calculate: Lambda per-request cost vs EC2 hourly cost at expected load\n\nKey insight: Lambda = per-request pricing, EC2 = per-hour pricing. Low/variable utilization → Lambda wins. Consistently high (>60%) → EC2 wins."}
  ]
},

  questions: [
    {num:1,q:"What are the security aspects you consider while building an application?",score:"Passed",scoreClass:"score-pass",a:"Code & Dependencies:\n• SAST in CI (SonarQube/Semgrep) — scan every PR\n• SCA (Snyk/Dependabot) — flag vulnerable dependencies\n• Secrets detection (git-secrets, Gitleaks) — pre-commit + CI\n• No hardcoded secrets — Vault/Secrets Manager, env injection at runtime\n\nContainer:\n• Non-root user, read-only filesystem, drop all capabilities\n• Distroless/Alpine base, pin image digests\n• Trivy scan in CI — block on Critical/High\n• Cosign image signing, SBOM generation\n\nKubernetes:\n• RBAC — least privilege per ServiceAccount\n• Network policies — default deny, explicit allow\n• Pod Security Standards — restricted profile\n• Kyverno/OPA — enforce no root, no latest, private registry only\n• Secrets via External Secrets Operator (not baked in manifests)\n\nInfrastructure (AWS):\n• IAM least privilege, OIDC federation (no long-lived keys)\n• VPC private subnets, Security Groups minimal\n• KMS encryption at rest, TLS in transit\n• CloudTrail, GuardDuty, Security Hub enabled\n• Terraform IaC scanned with Checkov/tfsec\n\nApplication:\n• Input validation, parameterized queries (no SQL injection)\n• Auth via OAuth2/OIDC, MFA enforced\n• Rate limiting at API Gateway/WAF\n• HTTPS only, TLS 1.2+, HSTS headers\n\nRuntime:\n• Falco — runtime threat detection\n• WAF — OWASP rules, geo-blocking, rate limiting\n• Alerting on anomalies (unusual outbound, privilege escalation)"}
  ]
},

    {num:1,q:"Define robust IAM strategy for banking AWS environment. Least privilege + monitor unauthorized activities?",score:"Reference",scoreClass:"score-pass",a:"Org: Multi-account (prod/staging/dev/security/logging). SCPs at OU level.\n\nIdentity: Federated via IAM Identity Center + AD/Okta. No long-lived IAM users. Role assumption.\n\nLeast privilege: Permission sets by job. Resource tagging. IAM Access Analyzer (policy generation from CloudTrail 90-day usage). Reduced permissions 60% using actual data.\n\nMonitoring: CloudTrail (all accounts, centralized, deletion prevented). GuardDuty (anomaly). Access Analyzer (external sharing). EventBridge rules (CreateUser, AttachPolicy, CreateAccessKey). Lambda auto-quarantine.\n\nGovernance: Quarterly reviews, 90-day unused = flagged, MFA everywhere."},
    {num:2,q:"Employee leaving. Steps to revoke access across AWS resources timely and securely?",score:"Reference",scoreClass:"score-pass",a:"Immediate (15 min for privileged):\n1. Disable IdP account (single kill switch for federated)\n2. Direct IAM users: deactivate keys, delete passwords, deactivate MFA\n3. Rotate shared credentials they accessed\n4. Revoke sessions (deny-all policy with timestamp condition)\n\nAudit:\n5. CloudTrail: filter by identity, check for backdoor roles\n6. AWS Config: resources they created\n7. Check Lambda, IAM roles with external trust policies\n\nCompliance:\n8. Document all steps in ticketing\n9. IAM credential report before/after\n10. CloudWatch alarm for 30 days (activity from deactivated user)\n\nTimeline: Complete <1 hour. Privileged: 15 minutes."},
    {num:3,q:"Implement Zero Trust Security model for IAM in AWS?",score:"Reference",scoreClass:"score-pass",a:"Never implicitly trust. Verify by identity, device, network, context.\n\nIdentity: MFA everywhere. Conditional access (SourceIp, time, MFA, SourceVpc). Sensitive ops need extra conditions.\n\nWorkloads: IRSA in EKS, instance profiles. No hardcoded creds. Each service own role.\n\nNetwork: VPC endpoints + endpoint policies. Even with IAM permission, only through private endpoint.\n\nData: Encryption everywhere. KMS key policies. S3 deny if not via endpoint. RDS IAM auth.\n\nContinuous: Short sessions (1hr max), re-auth for sensitive, GuardDuty, automated response.\n\nPrinciple: Trust nothing, verify everything, assume breach."},
    {num:4,q:"How to detect and respond to a potential data breach in AWS?",score:"Reference",scoreClass:"score-pass",a:"Detection: GuardDuty (ML threats), CloudTrail+Athena (patterns), Security Hub (aggregated), VPC Flow Logs, EventBridge rules, Macie (sensitive data).\n\nContain:\n1. Quarantine SG (deny all), revoke creds, block IPs via NACLs/WAF\n2. Preserve evidence (snapshot EBS, don't terminate)\n3. Assess scope via CloudTrail\n\nInvestigate: Timeline from CloudTrail, identify entry point, determine data exposure.\n\nRecover: Rotate creds, patch vuln, restore from known-good, verify integrity.\n\nPost: Legal notification (72hrs GDPR), customer notification, postmortem, update threat lists."}

{
  id: "ansible-1",
  category: "ansible",
  title: "Ansible — Interview Experience 1",
  date: "July 15, 2026",
  targetRole: "Staff/Principal DevOps Engineer",
  avgScore: "4.5/10 (answered questions)",
  questions: [
    {num:1,q:"What is Ansible and why do organizations prefer it over Puppet or Chef? What makes it unique?",score:"5.5/10",scoreClass:"score-mid",a:"Ansible: open-source automation (config management, deployment, orchestration, provisioning). Python-based, Red Hat.\n\nWhy preferred:\n1. Agentless — SSH/WinRM. No agent to install/maintain/patch. Smaller attack surface.\n2. Push-based — Run playbook, pushes NOW. Puppet/Chef pull every 30 min.\n3. YAML — Human-readable, low learning curve vs Puppet DSL/Chef Ruby.\n4. Idempotent — Same playbook twice = same result. Safe to re-run.\n5. No central server — Run from any machine. No SPOF like Puppet Master.\n\nWhen Puppet/Chef better: 10K+ nodes continuous drift, pull model for ephemeral nodes.\n\nScope beyond config: Orchestration, cloud provisioning, CI/CD, patching, network devices."},
    {num:2,q:"Explain Ansible inventory — static vs dynamic. How handle constantly changing inventory in cloud with auto-scaling?",score:"5/10",scoreClass:"score-mid",a:"Static: Fixed INI/YAML file with hosts, groups, children, host_vars/group_vars. Good for on-prem/stable.\n\nDynamic (modern — inventory plugins):\n```\nplugin: amazon.aws.aws_ec2\nregions: [us-east-1]\nfilters:\n  tag:Environment: production\n  instance-state-name: running\nkeyed_groups:\n  - key: tags.Role\n    prefix: role\ncompose:\n  ansible_host: private_ip_address\n```\n\nAuto-scaling: New instance tagged → next Ansible run auto-includes it. Terminated → auto-excluded. No manual work.\n\nPlugins: aws_ec2, azure_rm, gcp_compute, vmware_vm_inventory.\n\nHybrid: Multiple inventory sources merged automatically."},
    {num:3,q:"What are Ansible Roles? Why use instead of single playbook? How to structure for production?",score:"3.5/10",scoreClass:"score-low",a:"Roles = reusable, self-contained automation units.\n\nWhy: Reusability, modularity, team collaboration, testability (Molecule), sharing (Galaxy), maintainability.\n\nStructure:\nroles/nginx/\n├── tasks/main.yml (entry point)\n├── handlers/main.yml (restart/reload on notify)\n├── templates/*.j2 (Jinja2 dynamic configs)\n├── files/ (static files to copy)\n├── vars/main.yml (high-priority vars)\n├── defaults/main.yml (low-priority, easily overridden)\n├── meta/main.yml (dependencies)\n└── molecule/ (testing)\n\nKey: defaults = user overrides, vars = internal. Handlers run once at end.\n\nCalling: roles: [common, nginx, {role: app, app_version: '2.3.1'}]"},
    {num:4,q:"Scenario: Deploy new version across 200 prod servers behind LB with zero downtime. Design the playbook.",score:"Passed",scoreClass:"score-pass",a:"serial: 20 (10% batches). max_fail_percentage: 10 (abort if >10% fail).\n\nFlow per batch:\n1. pre_task: Remove from LB (elb_target state=absent + delegate_to localhost)\n2. Wait for drain (30s)\n3. Deploy (role: app-deploy)\n4. post_task: Health check (uri + retries/until)\n5. Re-enable in LB\n\nProgressive serial: [1, 5, '20%'] — canary pattern.\n\nRollback: rescue block deploys previous_version.\n\nSafety: --check first, --limit small group, Slack notifications."},
    {num:5,q:"What is Ansible Vault? How manage sensitive data securely in production pipeline?",score:"Passed",scoreClass:"score-pass",a:"AES-256 encryption for secrets in version control.\n\nStructure: group_vars/production/vars.yml (plain) + vault.yml (encrypted). Prefix: vault_db_password.\n\nMultiple vault IDs for different environments. CI/CD: vault password from pipeline secrets → temp file → playbook → rm file.\n\nLimitations vs HashiCorp Vault: No dynamic secrets, no rotation, no audit, no TTL.\n\nBest practice: Ansible Vault for the token, HashiCorp Vault lookup plugin for real secrets."},
    {num:6,q:"Scenario: Playbook succeeds on 45/50 servers, 5 fail with 'Unreachable.' Can SSH manually. What's wrong?",score:"Passed",scoreClass:"score-pass",a:"Run with -vvvv to see actual SSH command.\n\nCommon causes:\n1. SSH user mismatch (ansible_user differs)\n2. SSH key mismatch (different key than ~/.ssh/config)\n3. DNS/hostname stale\n4. Host key checking (no known_hosts entry)\n5. Firewall/SG (port 22 not open from control node)\n6. SSH MaxStartups hit (reduce forks)\n7. Python missing on target\n8. Bastion/ProxyJump not configured for Ansible\n\nDiagnosis: ansible-inventory --host, compare working vs failing, try raw module.\n\nPattern: Same 5 always = config. Random 5 = timeout/connection limits."},
    {num:7,q:"Explain Jinja2 templating. When/why use templates instead of static files? Production example?",score:"Passed",scoreClass:"score-pass",a:"Dynamic config generation with variables, conditionals, loops per host.\n\nNginx example: worker_processes from ansible_processor_vcpus, upstream block loops over groups['app_servers'] using hostvars, different logging for prod vs dev.\n\nKey: validate (test syntax before apply), notify (reload only if changed), hostvars (service discovery).\n\npg_hba.conf: Loop app_servers to auto-add access rules. Add server to inventory → next run updates DB access.\n\nWhen NOT: File identical everywhere (use copy), managed by another tool."},
    {num:8,q:"Scenario: Playbook takes 2 hours for 500 servers. How to optimize?",score:"Passed",scoreClass:"score-pass",a:"forks 5→50 (60-70% faster), SSH pipelining=True (30-40%), ControlPersist (10-15%), fact caching (5-10%), strategy:free (10-20%).\n\nAdditional: gather_facts:false, tags, async for long tasks, ansible-pull for 1000+, Mitogen plugin (3-7x).\n\nResult: 2 hours → 15-25 minutes.\n\nArchitecture for very large: Split inventory, parallel processes, AWX/Tower, pull-based."},
    {num:9,q:"Handlers — how differ from tasks? When NOT triggered? How to force?",score:"Passed",scoreClass:"score-pass",a:"Handlers: only when notified + changed, run once at end of play.\n\nWon't trigger: task didn't change, play fails before end, name typo, --check mode, changed_when:false.\n\nForce: meta:flush_handlers (run NOW), --force-handlers (even if play fails), changed_when:true.\n\nListen: multiple handlers on one event name.\n\nBest practice: flush before dependent tasks, --force-handlers in CI/CD."},
    {num:10,q:"Terraform vs Ansible — use Ansible for everything or split responsibilities? Recommendation?",score:"4/10",scoreClass:"score-mid",a:"Recommendation: BOTH. Terraform for provisioning, Ansible for configuration.\n\nTerraform for infra: Declarative with state, dependency graph, plan/destroy. Ansible has no state = can't track/destroy.\n\nAnsible for config: Packages, services, rolling updates, patching. Terraform provisioners are 'last resort', user_data only runs once.\n\nArchitecture:\nTerraform: VPC, EC2, RDS, IAM, EKS (WHAT exists)\nAnsible: Install, configure, deploy, patch (HOW it behaves)\n\nConnection: Terraform creates → Ansible aws_ec2 plugin discovers → configures.\n\nRight tool for right job."}
  ]
},
{
  id: "ansible-2",
  category: "ansible",

  questions: [
    {num:1,q:"What are Ansible Collections and how do they differ from Roles? Why did Ansible move to Collections architecture?",score:"Passed",scoreClass:"score-pass",a:"Collections = distribution format bundling roles + modules + plugins + playbooks with versioning and namespacing.\n\nBefore (< 2.10): 2500 modules in monolithic package. Update one = upgrade all. No namespacing.\n\nAfter: ansible-core (minimal ~70 modules) + Collections (installed separately, own versions).\n\nDifferences: Role = tasks/templates/vars for one job. Collection = entire ecosystem (amazon.aws has 100+ modules + roles).\n\nFQCN: amazon.aws.ec2_instance prevents conflicts. Pin versions in requirements.yml for reproducible CI/CD. Private Automation Hub for enterprise internal collections."},
    {num:2,q:"How do you handle errors in Ansible? Explain block/rescue/always. Production scenario?",score:"Passed",scoreClass:"score-pass",a:"Error handling mechanisms:\n\n1. ignore_errors: yes (simple, hides failures)\n2. failed_when (custom conditions)\n3. block/rescue/always (try/catch/finally):\n   - block: attempt deploy (download, stop, deploy, start, health check)\n   - rescue: rollback (deploy old version, notify Slack)\n   - always: cleanup temp files, ensure service running\n4. any_errors_fatal: true (stop ALL hosts if one fails — critical for DB migrations)\n5. max_fail_percentage with serial (stop if >X% of batch fails)\n\nProduction: Deploy with auto-rollback. If health check fails in block → rescue deploys previous version + notifies team. Always ensures service is running regardless."},
    {num:3,q:"What is AWX/Automation Controller? When use instead of CLI or CI/CD pipeline?",score:"Passed",scoreClass:"score-pass",a:"Web-based management layer: UI, RBAC, scheduling, audit, credential management.\n\nSolves: Who ran what when (audit), credential separation (users USE without SEEING), centralized execution, self-service UI for non-engineers, job scheduling, provisioning callbacks.\n\nUse CLI: small team <5. Use CI/CD: triggered deployments. Use AWX: multi-team RBAC, audit compliance, scheduled jobs, self-service.\n\nKey features: Credentials vault, RBAC per team/environment, Git-synced projects, workflow templates (chain playbooks with conditions), execution environments (containerized runtime).\n\nDon't use: single engineer, all CI/CD triggered, no compliance need."},
    {num:4,q:"What does idempotency mean? Which modules are NOT idempotent? How to make non-idempotent tasks safe?",score:"Passed",scoreClass:"score-pass",a:"Idempotency: same playbook multiple times = same result. If state exists → 'ok' not 'changed'.\n\nIdempotent: apt, service, file, template, user (check state before acting).\n\nNOT idempotent: command, shell, raw — always run, always report changed.\n\nMake safe:\n1. creates: /path/.done (skip if file exists)\n2. changed_when: condition (only mark changed when meaningful)\n3. register + when: not result.stat.exists\n4. lineinfile instead of shell echo >> (adds line only if missing)\n5. changed_when: false for read-only commands\n\nRule: Bare command/shell without creates, changed_when, or when = code smell in production."},
    {num:5,q:"What are callback plugins? When write a custom module vs using existing? Examples?",score:"Passed",scoreClass:"score-pass",a:"Callback plugins: hook into Ansible events (task start/end, play end). Customize output or integrate external systems.\n\nBuilt-in: timer (total time), profile_tasks (time per task), yaml (better output), json (parsing).\n\nCustom callback example: Send metrics to Datadog — v2_playbook_on_stats sends ok/changed/failures gauges.\n\nCustom modules — when: Internal API no module covers, need check mode support, complex reusable logic.\nWhen NOT: uri module works, command+changed_when suffices, existing collection exists.\n\nExample: feature_flag module — checks current state via API, changes if different, supports check_mode, proper changed/ok reporting. Used as: feature_flag: name=x state=enabled api_url=... api_token=..."},
    {num:6,q:"How to integrate Ansible into CI/CD pipeline? How to test Ansible code itself?",score:"Passed",scoreClass:"score-pass",a:"Pipeline: lint-and-test → deploy-staging (auto) → deploy-production (manual approval).\n\nLint: ansible-lint (style, deprecated). Syntax: --syntax-check. Unit: molecule (role in Docker). Integration: molecule + testinfra (verify end state). Staging: real deploy.\n\nCI/CD: GitHub Actions with OIDC for AWS auth. Vault password from secrets → temp file → playbook → rm. Pin collections in requirements.yml.\n\nMolecule: molecule.yml (driver), converge.yml (apply role), verify.yml (assertions like 'is nginx running? is port 80 open?').\n\nKey: No manual steps. Lint catches issues early. Molecule tests roles in isolation. Staging proves it works. Prod requires approval."},
    {num:7,q:"What are Ansible facts? Magic variables? Custom facts? When disable gathering?",score:"Passed",scoreClass:"score-pass",a:"Facts: System info gathered at play start (setup module). hostname, os_family, IP, CPU, memory, mounts.\n\nMagic variables (always available): inventory_hostname, groups['name'], hostvars['host']['fact'], play_hosts, group_names, role_path.\n\nReal use: Jinja2 template loops over groups['app_servers'] hostvars to build pg_hba.conf or nginx upstream dynamically.\n\nCustom facts: /etc/ansible/facts.d/app.fact script returning JSON. Access via ansible_local.app.version. Use: server reports its version → conditionally upgrade only old ones.\n\nset_fact: Runtime calculation (jvm_heap = memtotal * 0.7).\n\nDisable when: Don't use facts, network devices, performance (500 hosts × 3s), using fact caching. Minimal: gather_subset: [network]."},
    {num:8,q:"What is delegate_to? When use local_action? Production examples where delegation is essential?",score:"Passed",scoreClass:"score-pass",a:"delegate_to: Run task on DIFFERENT host than play target. Result stays with original host.\n\nExamples:\n1. LB management: delegate_to: localhost for AWS API calls (remove/add from ALB during rolling deploy)\n2. DNS update: delegate_to: localhost for Route53 after provisioning\n3. Cross-host: delegate_to: db_master to create replication slot for new replica\n4. Monitoring: delegate_to: localhost to register host via API\n5. run_once + delegate_to: DB migration runs once from first server\n\ndelegate_facts: true → store gathered facts under the delegated host, not current.\n\nlocal_action = shorthand for delegate_to: localhost."},
    {num:9,q:"How does Ansible manage Windows servers? Network devices? What's different from Linux?",score:"Passed",scoreClass:"score-pass",a:"Windows: WinRM connection (not SSH), port 5985/5986. win_ prefix modules (win_copy, win_service, win_package, win_shell, win_regedit). PowerShell instead of bash. No Python needed on target.\n\nNetwork: ansible_connection=network_cli (SSH to CLI). ansible_network_os=cisco.ios.ios. No Python on device — modules run locally, send commands over connection. gather_facts:false required.\n\nModules: cisco.ios.ios_interfaces, ios_vlans, ios_config (backup), ios_acls. Declarative — define state, module calculates diff. --diff shows config changes.\n\nKey differences: Connection type, module prefix (win_), no Python requirement, platform-specific collections."},
    {num:10,q:"How to manage Ansible for 5,000+ servers across regions and teams? Patterns and architecture?",score:"Passed",scoreClass:"score-pass",a:"Performance: forks=100, fact_caching=redis, pipelining=True, strategy=free, ControlPersist=120s.\n\nExecution patterns:\n1. Segmented: --limit by region/role/tag (never all 5000 at once)\n2. Pull mode (ansible-pull): cron every 30min, scales infinitely\n3. AWX: orchestration, RBAC per team, workflow templates\n\nRepo structure: inventory/{prod,staging}/aws_ec2.yml + group_vars/ | roles/ | playbooks/ | molecule/\n\nMulti-team: CODEOWNERS (platform owns common, security reviews hardening, teams own their app roles).\n\nTesting layers: Molecule → Dev (5 VMs) → Staging (50) → Canary (5% prod) → Full prod.\n\nKey decisions: Redis fact cache (not file), pull for compliance / push for deploys, AWX for teams, regional segmentation, canary pattern, version pinning (collections + Python), immutable where possible (bake AMIs)."}
  ]
},

  questions: [
    {num:1,q:"Ansible has 22 levels of variable precedence. Where to define variables in production? Which wins: group_vars, host_vars, role defaults, extra-vars?",score:"Passed",scoreClass:"score-pass",a:"Precedence (low→high): role defaults → group_vars/all → group_vars/group → host_vars → play vars → role vars → set_fact → extra-vars (HIGHEST).\n\nAnswer: extra-vars > host_vars > group_vars > role defaults.\n\nStrategy: defaults/ for safe defaults (override-friendly). group_vars for env-specific. host_vars for one-off host diffs. extra-vars for CI/CD deploy-time values.\n\nRules: Never same var at same level, prefix role vars (nginx_port not port), use ansible-inventory --host to debug. Common mistake: vars/main.yml (high priority) instead of defaults/ (overridable)."},
    {num:2,q:"What are lookup plugins? How different from modules? Production examples of lookups and filters?",score:"Passed",scoreClass:"score-pass",a:"Lookups: fetch data on CONTROL NODE (local). Modules: execute on MANAGED NODE (remote). Lookups return data, modules change state.\n\nKey lookups: file (read local), env (environment var), hashi_vault (secrets), aws_ssm (parameters), pipe (local command), password (generate), url (HTTP fetch), first_found (try paths).\n\nKey filters: int/bool (type), first/random/unique (lists), json_query (dict), default(30) (prevent undefined), password_hash (security), ipaddr (networking), ternary (inline if/else), combine (merge dicts), regex_search."},
    {num:3,q:"Explain advanced looping — loop over dictionaries, nested loops, until retry, registering loop results.",score:"Passed",scoreClass:"score-pass",a:"Dict loop: loop: users | dict2items → item.key, item.value.\n\nLoop control: index_var (numbering), label (clean output), pause (delay between).\n\nNested: ['app1','app2'] | product(['dev','prod']) | list.\n\nFilter: packages | selectattr('priority','equalto','critical') | list.\n\nUntil: retries:30, delay:10, until: health.status==200 (max 5min wait).\n\nRegister results: register: status → loop status.results → when: item.rc != 0 for failures."},
    {num:4,q:"How to use tags in complex playbooks? Tagging strategy for large codebase?",score:"Passed",scoreClass:"score-pass",a:"Execution: --tags deploy, --skip-tags restart, --list-tags.\n\nSpecial: 'always' (runs regardless of filter), 'never' (only when explicitly requested).\n\nTag roles: {role: nginx, tags: ['nginx','web']}.\n\nStrategy: Functional (install/configure/deploy/restart), Component (nginx/app/db), Lifecycle (setup/update/rollback).\n\nBest practices: Every task tagged, always for prerequisites, never for dangerous ops, document in README."},
    {num:5,q:"Company uses Ansible Vault + HashiCorp Vault. When use which? How integrate? AWS Secrets Manager?",score:"Passed",scoreClass:"score-pass",a:"Ansible Vault: Bootstrap (store HV token), small teams, rare-change secrets. Low complexity.\n\nHashiCorp Vault: Dynamic creds (new DB password each deploy), PKI, compliance audit, TTL/lease, multi-tool.\n\nAWS SM: AWS-native, RDS rotation, managed service.\n\nIntegration: Ansible Vault encrypts HV token → lookup plugin fetches dynamic creds → creds have 1hr TTL → no static passwords in Git.\n\nFlow: vault.yml (encrypted) holds token → playbook uses hashi_vault lookup → dynamic creds at runtime → always fresh."},
    {num:6,q:"How to manage inventory for multiple clouds + on-prem + blue-green deployments?",score:"Passed",scoreClass:"score-pass",a:"Multi-source: inventory/production/ with aws_ec2.yml + azure_rm.yml + on_prem_static.yml. Ansible merges all.\n\nBlue-green: Tag-based groups (deploy_blue, deploy_green via keyed_groups on tags.DeployGroup). Deploy to inactive → health check → switch ALB targets → swap tags.\n\nPatterns: Intersection (:&), Exclusion (:!), Regex (~), First N ([0:2] for canary)."},
    {num:7,q:"How to handle long-running tasks? Explain async/poll, fire-and-forget, wait_for.",score:"Passed",scoreClass:"score-pass",a:"Async+poll: async:3600, poll:60 — checks every 60s, max 1hr.\n\nFire-and-forget: poll:0, register job. Do other tasks. Then async_status + until:finished.\n\nParallel: Fire all backups (poll:0), then wait for all via loop over results.\n\nwait_for: Port open/closed, file appear/disappear, log message regex, with timeout.\n\nProduction: Graceful stop (async) → wait port closed → deploy → start → wait port open → health check with retries."},
    {num:8,q:"How to use Ansible to manage Kubernetes? When Ansible over Helm/kubectl?",score:"Passed",scoreClass:"score-pass",a:"kubernetes.core collection: k8s module (apply manifests/templates), k8s_info (query), k8s_scale, helm module.\n\nWhen Ansible: Orchestrate K8s + non-K8s together (deploy + DNS + LB + notify), complex Jinja2 logic, cluster bootstrapping (RBAC, policies, Helm charts), multi-cluster same config.\n\nWhen Helm: Package/distribute apps. When kubectl: Simple one-off CI/CD.\n\nBootstrap pattern: Install cert-manager + prometheus via helm module, apply network policies via k8s, configure Route53 via aws module — all in one playbook."},
    {num:9,q:"Explain strategy plugins (linear, free, debug). When change default? What is Mitogen?",score:"Passed",scoreClass:"score-pass",a:"linear (default): All hosts finish task N before task N+1. Predictable, slow.\n\nfree: Each host proceeds independently. Fast hosts don't wait. Output unordered. Use when tasks independent per host.\n\ndebug: Interactive debugger on failure. Inspect vars, retry tasks.\n\nMitogen: Third-party plugin replacing SSH layer with pure-Python channel. Single SSH session, no module upload. 3-7x faster. Drop-in (strategy=mitogen_linear). No playbook changes.\n\nRecommendation: Small=linear, large fleet=free, max perf=mitogen_free, debugging=debug."},
    {num:10,q:"How to test Ansible roles with Molecule? Drivers, scenarios, multi-OS, CI/CD integration?",score:"Passed",scoreClass:"score-pass",a:"Molecule lifecycle: create → converge → verify → destroy (molecule test = all).\n\nStructure: roles/nginx/molecule/default/ with molecule.yml, converge.yml, verify.yml.\n\nDrivers: Docker (fast, common), Podman (rootless), Vagrant (full VM), EC2 (real AWS).\n\nMulti-OS: platforms list with ubuntu:22.04, rocky:9, debian:12, amazon:2023. Same role tested against all.\n\nVerify: Ansible assertions (check_mode+failed_when) or Testinfra (Python: assert pkg.is_installed, svc.is_running, socket.is_listening).\n\nCI/CD: pip install molecule[docker] → cd roles/nginx → molecule test. Run on every PR.\n\nBest practices: Every role gets test, multi-OS matrix, test idempotence (run twice, 0 changed second time), keep fast (Docker>Vagrant)."}
  ]
},

  questions: [
    {num:1,q:"What are Execution Environments (EE) in Ansible? Why introduced? How to build and use?",score:"Passed",scoreClass:"score-pass",a:"EE = containerized images packaging ansible-core + Python deps + collections + system libs into portable container.\n\nWhy: 'Works on my machine' problem, dependency hell, Python venv chaos on AWX. Same EE runs everywhere (laptop, CI, AWX).\n\nBuild with ansible-builder: execution-environment.yml defines base image + galaxy requirements + Python requirements + system packages. Build → push to registry → use in navigator/AWX.\n\nUsage: ansible-navigator run deploy.yml --execution-environment-image my-ee:1.0.0\n\nAWX: Settings → EE → point to image → assign to Job Template.\n\nWorkflow: Define → Build in CI → version-tag → AWX/navigator uses specific version."},
    {num:2,q:"What is ansible-navigator? How differs from ansible-playbook? When to use?",score:"Passed",scoreClass:"score-pass",a:"Next-gen CLI replacing ansible-playbook/doc/inventory. Unified TUI with EE support.\n\nDifferences: EE support (runs in container), interactive TUI (drill into tasks/hosts), artifact recording (JSON replay), built-in docs/inventory browsing.\n\nModes: --mode stdout (traditional) or --mode interactive (TUI drill-down).\n\nReplay: ansible-navigator replay artifact.json — view past run results without re-executing. Great for debugging production.\n\nConfig: ansible-navigator.yml defines EE image, mode, artifact settings.\n\nUse navigator: EE-based, debugging, artifacts. Use ansible-playbook: simple, no EE, backward compat."},
    {num:3,q:"How to use Ansible for compliance enforcement? CIS benchmarks, STIG hardening at scale?",score:"Passed",scoreClass:"score-pass",a:"Compliance as Code: Define standards → Automate enforcement → Continuous audit → Report.\n\nCIS role: Tasks named by control number (1.1.1, 5.2.1). Each enforces one control. Tagged by level/category.\n\nAudit mode: --check --diff shows what WOULD change = non-compliant items.\n\nReporting: Register checks → set_fact compliance status → generate JSON → upload to S3/dashboard.\n\nSchedule via AWX: Daily --check (audit report), weekly enforce (fix drift).\n\nRoles available: ansible-lockdown/RHEL8-CIS, Ubuntu22-CIS, RHEL8-STIG.\n\nPattern: common + cis-hardening + monitoring applied to ALL servers."},
    {num:4,q:"Walk through production pipeline: Terraform provisions, Ansible configures. How do they pass data?",score:"Passed",scoreClass:"score-pass",a:"Method 1 (recommended): Tags as contract. Terraform tags instances (Role=webserver, ManagedBy=ansible). Ansible aws_ec2 plugin discovers by tags at runtime. No manual handoff.\n\nMethod 2: Terraform outputs (RDS endpoint, ALB DNS) → terraform output -json > tf_outputs.json → ansible-playbook -e @tf_outputs.json.\n\nMethod 3 (avoid): Terraform null_resource provisioner calling ansible-playbook. Fragile, not idempotent.\n\nPipeline: terraform apply → wait for instances ready → ansible-playbook with dynamic inventory + tf outputs.\n\nKey: Tags are the contract, dynamic inventory > static, outputs for non-discoverable data (endpoints), separate concerns (infra state vs config)."},
    {num:5,q:"Complex playbook failing with cryptic errors. Walk through debugging toolkit beyond -vvvv.",score:"Passed",scoreClass:"score-pass",a:"Toolkit:\n1. -v to -vvvv (progressive detail)\n2. strategy: debug (interactive — p vars, p result, r retry)\n3. --step (task by task confirmation)\n4. --start-at-task 'task name'\n5. debug module (print vars/msg)\n6. register + fail with context (show stdout/stderr/rc)\n7. ansible-lint (catch issues before run)\n8. --check --diff (see what would change)\n9. --limit single host (isolate)\n10. ansible-config dump --changed (effective config)\n\nCommon cryptic errors: MODULE FAILURE = Python issue on target. Shared connection closed = OOM. Permission denied = SELinux. Template not found = relative path wrong."},
    {num:6,q:"What is Automation Mesh? How does it solve execution at scale across networks?",score:"Passed",scoreClass:"score-pass",a:"Distributed execution layer in AAP. Run automation across isolated networks/DMZs without direct SSH from controller to every endpoint.\n\nNode types: Control (UI/API/scheduling), Execution (runs playbooks, close to targets), Hop (relay across network boundaries).\n\nWhy: Security (controller doesn't SSH everywhere), performance (execution near targets), network isolation (cross DMZ), compliance.\n\nInstance groups assign work to specific executors (DMZ jobs → DMZ execution node, EU jobs → EU node).\n\nOpen source equivalent: SSH jump hosts + regional bastions. Concept: distribute execution close to targets, minimize hops."},
    {num:7,q:"10 teams, 500 playbooks, 80 roles. How to organize? Monorepo vs multi-repo? Governance?",score:"Passed",scoreClass:"score-pass",a:"Hybrid approach (recommended):\n\nShared/platform (monorepo, platform team): common roles, security hardening, collections, compliance playbooks, inventory.\n\nPer-team repos: team-specific roles, deploy playbooks, team group_vars.\n\nShared roles as internal collection: publish to private Automation Hub. Teams pin versions in requirements.yml.\n\nGovernance: CODEOWNERS (platform team owns common, security owns hardening). Quality gates: lint + molecule + staging check + 2 approvals.\n\nVersioning: Semver for shared roles. Breaking change = major bump + migration guide. Teams pin major version.\n\nDocs: Every role has README + CHANGELOG + molecule tests as documentation."},
    {num:8,q:"How to use Ansible for disaster recovery automation? Walk through a DR scenario.",score:"Passed",scoreClass:"score-pass",a:"Strategy: Normal ops (maintain readiness) → DR event (execute recovery) → Post-DR (validate + failback).\n\nDR playbook: Confirm activation → stop replication → promote replica → verify primary → update DNS (Route53 TTL=60) → update connection strings → verify apps connect → notify team.\n\nDR readiness (daily): Check replication lag (<30s), backup freshness, DR region capacity. Report to Slack.\n\nQuarterly drill: Full automated DR test → verify → failback. All via Ansible (repeatable, tested).\n\nKey: Human confirmation gate (unless auto_dr=true), full audit logging, DNS failover, health verification before declaring success."},
    {num:9,q:"Difference between include_* and import_* in Ansible? Gotchas?",score:"Passed",scoreClass:"score-pass",a:"import_* (static): Parsed at load time. when: applies to EACH task inside. Tags flow in. Can't use variables in filename. Can't loop.\n\ninclude_* (dynamic): Parsed at runtime. when: decides whether to include at all. Tags DON'T flow in. CAN use variable filenames. CAN loop.\n\nGotchas:\n1. Tags don't propagate into include_tasks (use import for tag-based runs)\n2. Handlers in includes may not be visible for notify (use import)\n3. Variable filenames only with include (not import)\n\nRules: Variable filename → include. Tags must propagate → import. Loop over files → include. Default/simple → import."},
    {num:10,q:"How to identify which tasks/roles are slow? Profiling tools?",score:"Passed",scoreClass:"score-pass",a:"profile_tasks callback: Shows time per task at end. Immediately reveals bottlenecks.\n\nprofile_roles: Time per role (which role is expensive?).\n\nCommon bottlenecks: Package install (use list in single transaction), downloads (local mirror/AMI), fact gathering (cache/disable), SSH setup (pipelining), serial too low.\n\nProfiling workflow: Enable profile_tasks (always on) → identify top 3 slow → for each: can it be cached? parallelized? skipped? moved to AMI? → measure after fix → repeat.\n\nAdvanced: Custom callback to Prometheus (track task duration over time), ansible-navigator artifacts (replay analysis), set_fact timing blocks."}
  ]
},
